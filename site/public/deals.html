     rounds, documents, abstract, tasks, steps, events) cascade-delete in the DB. */
  function deleteBtn(dealId){
    return '<button class="act-btn danger" onclick="DF.deleteDealAsk(\''+dealId+'\')" title="Delete this deal permanently">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> Delete</button>';
  }
  function deleteDealAsk(dealId){
    var w=$('delWrap'); if(!w) return;
    w.innerHTML='<span class="delconfirm">Delete permanently?'
      + '<button class="act-btn" onclick="DF.deleteDealCancel(\''+dealId+'\')">Cancel</button>'
      + '<button class="act-btn danger solid" onclick="DF.deleteDealDo(\''+dealId+'\')">Yes, delete</button></span>';
  }
  function deleteDealCancel(dealId){ var w=$('delWrap'); if(w) w.innerHTML=deleteBtn(dealId); }
  async function deleteDealDo(dealId){
    var w=$('delWrap'); if(w) w.innerHTML='<span class="delconfirm">Deleting…</span>';
    try{
      var res=await q(sb.from('deals').delete().eq('id',dealId).select());
      if(!res || !res.length) throw new Error('Not permitted, or it was already removed.');
      deals=deals.filter(function(x){ return x.id!==dealId; });
      if(typeof aiToast==='function') aiToast('Deal deleted.');
      showPipeline();
    }catch(e){
      if(w) w.innerHTML='<span class="delconfirm err">Could not delete: '+esc(e.message||e)
        +' <button class="act-btn" onclick="DF.deleteDealCancel(\''+dealId+'\')">OK</button></span>';
    }
  }

  /* ---------- deal snapshot: progress + commission ---------- */
  function snapshotSection(d, steps){
    steps=steps||[];
    var total=steps.length, na=0, done=0;
    steps.forEach(function(s){ if(s.status==='done') done++; else if(s.status==='na') na++; });
    var denom=total-na, prog=denom>0?Math.round(100*done/denom):0;
    var commAmt = d.commission_amount!=null ? money(d.commission_amount)
      : (num(d.commission_pct)!=null && num(d.deal_value)!=null ? money(num(d.deal_value)*num(d.commission_pct)/100) : null);
    var cstat = d.commission_status ? (COMM_STATUS.filter(function(c){return c[0]===d.commission_status;})[0]||['','—'])[1] : null;
    var sub=[]; if(d.deal_value!=null) sub.push('Deal value '+money(d.deal_value)); if(d.commission_pct!=null) sub.push(d.commission_pct+'%');
    return '<div class="snap">'
      + '<div class="snap-prog">'
      +   '<div class="snap-k">Transaction progress</div>'
      +   (total
            ? '<div class="pgbar big"><span style="width:'+prog+'%"></span></div>'
              + '<div class="snap-sub">'+done+' of '+denom+' steps complete'+(prog===100?' · complete 🎉':'')+'</div>'
            : '<div class="snap-sub" style="margin-top:8px">Not set up yet.</div><button class="miniadd" onclick="DF.seedSteps(\''+d.id+'\')">+ Set up transaction checklist</button>')
      + '</div>'
      + '<div class="snap-comm">'
      +   '<button class="rev" onclick="DF.editCommission(\''+d.id+'\')">edit</button>'
      +   '<div class="snap-k">Commission</div>'
      +   '<div class="snap-commv">'+(commAmt||'—')+(cstat?' <span class="cst '+d.commission_status+'">'+cstat+'</span>':'')+'</div>'
      +   (sub.length?'<div class="snap-sub">'+sub.join(' · ')+'</div>':'<div class="snap-sub">Add deal value &amp; fee</div>')
      + '</div>'
      + '</div>';
  }

  /* ---------- transaction checklist ---------- */
  function checklistSection(d, steps){
    steps=steps||[];
    if(!steps.length){
      return '<div class="sub" style="color:var(--ink-faint);font-size:12.5px">No checklist yet — set up the full lease-transaction checklist to track every step from engagement to move-in.</div>'
        + '<button class="miniadd" onclick="DF.seedSteps(\''+d.id+'\')">+ Set up transaction checklist</button>';
    }
    var phases=[], byPhase={};
    steps.forEach(function(s){ var p=s.phase||'Other'; if(!byPhase[p]){ byPhase[p]=[]; phases.push(p); } byPhase[p].push(s); });
    return phases.map(function(p){
      var arr=byPhase[p], done=0, na=0;
      arr.forEach(function(s){ if(s.status==='done') done++; else if(s.status==='na') na++; });
      return '<div class="phase">'
        + '<div class="phase-h"><span class="phase-t">'+esc(p)+'</span><span class="phase-c">'+done+'/'+(arr.length-na)+'</span></div>'
        + arr.map(function(s){ return stepRow(s, d.id); }).join('')
        + '</div>';
    }).join('');
  }
  function stepRow(s, dealId){
    var st=STEP_STATUS[s.status]||STEP_STATUS.pending;
    return '<div class="step '+st.cls+'">'
      + '<button class="stepdot '+st.cls+'" onclick="DF.cycleStep(\''+s.id+'\',\''+dealId+'\',\''+s.status+'\')" title="Click to advance: to-do → in progress → done"></button>'
      + '<span class="step-l" onclick="DF.cycleStep(\''+s.id+'\',\''+dealId+'\',\''+s.status+'\')">'+esc(s.label)+'</span>'
      + (s.notes?'<span class="step-note-txt" title="'+esc(s.notes)+'">'+esc(s.notes)+'</span>':'')
      + '<span class="step-actions">'
      +   '<input type="date" class="step-due-in" value="'+(s.due_date||'')+'" onchange="DF.stepDue(\''+s.id+'\',this.value,\''+dealId+'\')" title="Due date">'
      +   '<button class="step-mini'+(s.notes?' has':'')+'" onclick="DF.stepNote(\''+s.id+'\',\''+dealId+'\')" title="'+(s.notes?'Edit note':'Add note')+'">✎</button>'
      +   '<button class="step-mini" onclick="DF.stepNA(\''+s.id+'\',\''+dealId+'\','+(s.status==='na'?'true':'false')+')" title="'+(s.status==='na'?'Un-skip':'Mark not applicable')+'">'+(s.status==='na'?'↩':'∅')+'</button>'
      + '</span>'
      + '</div>';
  }
  async function reloadSteps(dealId){
    var d=deals.filter(function(x){return x.id===dealId;})[0]; if(!d) return;
    var steps=[]; try{ steps=await q(sb.from('deal_steps').select('*').eq('deal_id',dealId).order('sort_order')); }catch(e){}
    var cb=$('checklistBody'); if(cb) cb.innerHTML=checklistSection(d,steps);
    var sw=$('snapWrap'); if(sw) sw.innerHTML=snapshotSection(d,steps);
  }
  async function seedSteps(dealId){
    try{
      var rows=STEP_TEMPLATE.map(function(t,i){ return {deal_id:dealId, phase:t[0], label:t[1], sort_order:i}; });
      await q(sb.from('deal_steps').insert(rows));
      reloadSteps(dealId);
    }catch(e){ alert('Could not set up the checklist.\nMake sure the deal-detail SQL has been run in Supabase.\n\n'+(e.message||e)); }
  }
  async function cycleStep(id, dealId, cur){
    var next=STEP_NEXT[cur]||'active';
    try{ await q(sb.from('deal_steps').update({status:next, completed_at: next==='done'?new Date().toISOString():null}).eq('id',id)); reloadSteps(dealId); }
    catch(e){ alert('Could not update step: '+(e.message||e)); }
  }
  async function stepNA(id, dealId, isNA){
    try{ await q(sb.from('deal_steps').update({status: isNA?'pending':'na', completed_at:null}).eq('id',id)); reloadSteps(dealId); }
    catch(e){ alert('Could not update step: '+(e.message||e)); }
  }
  async function stepDue(id, val, dealId){
    try{ await q(sb.from('deal_steps').update({due_date: val||null}).eq('id',id)); reloadSteps(dealId); }
    catch(e){ alert('Could not set due date: '+(e.message||e)); }
  }
  async function stepNote(id, dealId){
    var cur=''; try{ var r=(await q(sb.from('deal_steps').select('notes').eq('id',id).limit(1)))[0]; if(r&&r.notes) cur=r.notes; }catch(e){}
    var note=prompt('Note for this step:', cur);
    if(note===null) return;
    try{ await q(sb.from('deal_steps').update({notes:(note||'').trim()||null}).eq('id',id)); reloadSteps(dealId); }
    catch(e){ alert('Could not save note: '+(e.message||e)); }
  }

  /* ---------- commission editor ---------- */
  function editCommission(dealId){
    var d=deals.filter(function(x){return x.id===dealId;})[0]||{};
    function v(x){ return x==null?'':x; }
    openSheet('<h3>Commission &amp; deal value</h3><div class="ssub">Track the economics and where the fee stands.</div>'
      + '<div class="grid2">'
      + fld('Deal value','<input id="c_val" type="number" step="1000" inputmode="decimal" value="'+v(d.deal_value)+'" placeholder="0">','$ total')
      + fld('Commission','<input id="c_pct" type="number" step="0.1" inputmode="decimal" value="'+v(d.commission_pct)+'" placeholder="0">','%')
      + fld('Commission amount','<input id="c_amt" type="number" step="100" inputmode="decimal" value="'+v(d.commission_amount)+'" placeholder="auto from % if blank">','$')
      + fld('Status','<select id="c_stat"><option value="">— not set —</option>'+selOpts(COMM_STATUS,d.commission_status||'')+'</select>')
      + '</div>'
      + fld('Notes','<textarea id="c_notes" placeholder="e.g. 4% of aggregate rent; split 50/50 with listing side; invoiced on execution">'+esc(d.commission_notes||'')+'</textarea>')
      + '<div class="formerr" id="f_err"></div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn pri" id="f_save">Save</button></div>');
    $('f_save').addEventListener('click',async function(){
      this.disabled=true; this.textContent='Saving…';
      var val=num($('c_val').value), pct=num($('c_pct').value), amt=num($('c_amt').value);
      if(amt==null && pct!=null && val!=null) amt=Math.round(val*pct/100);
      var patch={deal_value:val, commission_pct:pct, commission_amount:amt, commission_status:($('c_stat').value||null), commission_notes:(($('c_notes').value||'').trim()||null)};
      try{
        await q(sb.from('deals').update(patch).eq('id',dealId).select().single());
        var d2=deals.filter(function(x){return x.id===dealId;})[0]; if(d2) Object.keys(patch).forEach(function(k){ d2[k]=patch[k]; });
        closeSheet(); openDeal(dealId);
      }catch(e){
        var m=e.message||''+e;
        $('f_err').textContent=/column .* does not exist|commission_/i.test(m)?'Run the deal-detail SQL in Supabase first (it adds the commission fields).':m;
        this.disabled=false; this.textContent='Save';
      }
    });
  }

  // Tenant-side lease risk review from the AI lease read (stored in abstract.data.__ai).
  function aiReviewPanel(a){
    var ai = a && a.data && a.data.__ai; if(!ai) return '';
    var sevColor={high:'#b3372f',medium:'#b7791f',low:'#5b7183'};
    var review=(ai.review||[]).slice().sort(function(x,y){ var o={high:0,medium:1,low:2}; return (o[x.severity]||3)-(o[y.severity]||3); });
    var items = review.length ? review.map(function(r){
      var c=sevColor[r.severity]||'#5b7183';
      return '<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line,#eee)">'
        + '<span style="flex:none;font:700 9.5px Inter;letter-spacing:.04em;color:#fff;background:'+c+';border-radius:4px;padding:2px 6px;margin-top:1px">'+esc((r.severity||'').toUpperCase())+'</span>'
        + '<span style="font-size:12.5px;line-height:1.5">'+esc(r.issue||'')+'</span></div>';
    }).join('') : '<div style="font-size:12px;color:var(--ink-faint);padding:4px 0">No notable tenant-side risks flagged.</div>';
    var when=''; try{ when=new Date(ai.at).toLocaleDateString(); }catch(e){}
    return '<div class="la-airev" style="margin-top:12px;border:1px solid #f0e2d0;background:#fbf7f0;border-radius:9px;padding:11px 13px">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><b style="font-size:12.5px;color:#8a5a1a">⚠ AI lease review</b>'
      + '<span style="font:400 10.5px Inter;color:var(--ink-faint)">'+(review.length?review.length+' flag'+(review.length>1?'s':''):'no flags')+(when?' · '+esc(when):'')+' · '+esc(ai.confidence||'')+' confidence</span></div>'
      + items
      + '<div style="font:400 10.5px Inter;color:var(--ink-faint);margin-top:7px">AI-generated from the lease PDF — not legal advice. Verify against the document and counsel.</div>'
      + '</div>';
  }

  /* ---------- create: deal (optionally kicking off the questionnaire) ---------- */
  function newDeal(){
    _pickedCompanyId=null;
    openSheet('<h3>New deal</h3><div class="ssub">Start tracking a client from tour through executed lease. Sending the questionnaire kicks off the whole intake — answers come back on the deal.</div>'
      + fld('Client / company name','<input id="f_name" placeholder="e.g. Pico Robertson Partners" autocomplete="off" oninput="DF.companySuggest(this.value)" autofocus><div class="sugg" id="f_csugg"></div>')
      + '<div id="f_chint" style="font-size:11.5px;color:var(--ink-faint);margin-top:6px">Pick a HubSpot company to link this deal to that client — its questionnaires, proposals &amp; leases then all live on the deal.</div>'
      + '<div class="formerr" id="f_err"></div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn" id="f_save">Create deal</button><button class="btn pri" id="f_save_q">Create &amp; send questionnaire</button></div>');
    loadCompanies();
    async function create(withQ){
      var name=($('f_name').value||'').trim();
      if(!name){ $('f_err').textContent='Enter a client name.'; return; }
      // exact-name match auto-links even if the broker didn't click a suggestion
      if(!_pickedCompanyId && Array.isArray(_companies)){ var mt=_companies.filter(function(c){return (c.name||'').toLowerCase()===name.toLowerCase();})[0]; if(mt) _pickedCompanyId=mt.id; }
      var b1=$('f_save'), b2=$('f_save_q'); if(b1) b1.disabled=true; if(b2) b2.disabled=true;
      var btn=withQ?b2:b1; var old=btn.textContent; btn.textContent='Creating…';
      try{
        var row;
        try{ row=await q(sb.from('deals').insert({owner_id:me.id, client_name:name, stage:'needs'}).select().single()); }
        catch(stageErr){ row=await q(sb.from('deals').insert({owner_id:me.id, client_name:name, stage:'touring'}).select().single()); }  // pre-migration fallback if the new stage values aren't enabled in the DB yet

        closeSheet(); openDeal(row.id);
      }catch(e){ $('f_err').textContent=e.message; if(b1) b1.disabled=false; if(b2) b2.disabled=false; btn.textContent=old; }
    }

  /* ---------- CoStar market-report import (Buildings tab) ----------
   * Upload the survey PDF pulled for this requirement → staged in a
   * deal_report_imports job row → deal-report-import-background (JWT-authed)
   * parses every building + available space with Claude while the browser
   * polls → the broker reviews/edits here → confirm writes deal_properties
   * candidates and upserts the internal market_spaces availability tracker.
   * The pure mapping (payload shapes, dedup_key, match, summary) lives in
   * assets/report-import.js, shared with tools/report-import-test.js.
   * COMPLIANCE: CoStar-sourced rows are broker-internal — they go ONLY to
   * org-scoped Supabase tables behind this login, never to vantage-data.json
   * or client/portal surfaces (see supabase/market-spaces.sql). */
  var _ri=null, _riTimer=null, _riTimer2=null;
  function importReport(dealId){
    _ri={dealId:dealId, plan:null, filename:null, open:{}, propsDone:false};
    loadPortalBuildings();                       // warm the catalog for matching
    openSheet('<h3>Import CoStar report</h3><div class="ssub">Upload the market survey / availability report you ran for this requirement. Claude reads every building and available space — you review and edit before anything is saved. <b>Internal only:</b> imported CoStar data never reaches client surfaces.</div>'
      + fld('Report PDF','<input id="ri_file" type="file" accept=".pdf,application/pdf">')
      + '<div class="ssub" style="margin:2px 0 8px">…or paste the report text instead:</div>'
      + '<div class="fld"><textarea id="ri_text" placeholder="Optional fallback — paste the CoStar rows here if you don\'t have the PDF"></textarea></div>'
      + '<div class="formerr" id="ri_err"></div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn pri" id="ri_go">⬆ Read report</button></div>');
    $('ri_go').addEventListener('click', riStart);
  }
  function fileB64(f){
    return new Promise(function(res,rej){
      var r=new FileReader();
      r.onload=function(){ res(String(r.result).split(',')[1]||''); };
      r.onerror=function(){ rej(new Error('Could not read that file.')); };
      r.readAsDataURL(f);
    });
  }
  function riStart(){
    var f=$('ri_file').files&&$('ri_file').files[0];
    var pasted=($('ri_text').value||'').trim();
    var err=$('ri_err');
    if(!f && !pasted){ err.textContent='Pick the report PDF (or paste its text).'; return; }
    if(f && !/pdf$/i.test(f.name) && f.type!=='application/pdf'){ err.textContent='That file isn\'t a PDF — export the report from CoStar as PDF, or paste its text below.'; return; }
    if(f && f.size>20*1024*1024){ err.textContent='File too large — 20MB max. Export a lighter version from CoStar (fewer photos).'; return; }
    _ri.filename=f?f.name:'pasted report text';
    _ri.file=f||null;   // kept for confirm: floor-plan pages render from this PDF
    $('ri_go').disabled=true;
    (f?fileB64(f):Promise.resolve(null))
      .then(function(b64){ return riCall(b64, pasted, f?f.name:null); })
      .catch(function(e){ riFail(e.message||String(e)); });
  }
  /* Background job pattern (market-reports / brochure filing): a sync function
   * 504s while Opus reads a full survey, so stage the PDF in a
   * deal_report_imports row, kick the background reader, poll the row. */
  /* Fully background: the sheet closes as soon as the upload is staged, a
   * bottom pill tracks progress, and it becomes a "Review & import" button
   * when Claude's done. The broker keeps working the whole time. */
  async function riCall(b64, pasted, filename){
    var started=Date.now();
    closeSheet();
    clearInterval(_riTimer); clearInterval(_riTimer2);
    pillSet('ri','Uploading '+esc(_ri.filename)+'…','busy');
    aiToast('Reading the report in the background — keep working. A Review button appears at the bottom when it\'s ready.');
    try{
      var s=await sb.auth.getSession(); var token=(s&&s.data&&s.data.session)?s.data.session.access_token:null;
      if(!token) throw new Error('Your session expired — please sign in again.');
      var jobId=bfNewJobId();
      await q(sb.from('deal_report_imports').insert({ id:jobId, org_id:ReportImport.ORG_ID, deal_id:_ri.dealId, filename:filename,
        pdf_b64:b64||null, src_text:(!b64&&pasted)?pasted:null }));
      var res=await fetch('/.netlify/functions/deal-report-import-background',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:token, jobId:jobId})});
      if(res.status===401) throw new Error('Your session expired — please sign in again.');
      if(res.status>=500) throw new Error('The reader couldn\'t start (HTTP '+res.status+'). Try again.');
      _riTimer=setInterval(function(){ pillSet('ri','Reading '+esc(_ri.filename)+' — '+Math.round((Date.now()-started)/1000)+'s (takes ~1–3 min)','busy'); },1000);
      riPoll(jobId);
    }catch(e){
      var m=(e&&e.message)||String(e);
      riFailPill(m + (/report_imports.*(does not exist|relation)/i.test(m)?' — run supabase/report-import-jobs.sql first.':''));
    }
  }
  function riPoll(jobId){
    _riTimer2=setInterval(async function(){
      try{
        // never select pdf_b64/src_text — that's the staged multi-MB upload
        var rows=await q(sb.from('deal_report_imports').select('id,status,result,error').eq('id',jobId).limit(1));
        var row=rows&&rows[0]; if(!row||row.status==='queued') return;
        clearInterval(_riTimer2); clearInterval(_riTimer);
        // consume: job rows are transient — delete now that we hold the result
        try{ await q(sb.from('deal_report_imports').delete().eq('id',jobId)); }catch(e){}
        if(row.status==='error'){ riFailPill(row.error||'The reader failed. Try again.'); return; }
        var data=row.result||{};
        var cat=await loadPortalBuildings();
        var existing=[]; try{ existing=await q(sb.from('deal_properties').select('id,building_id,address,name').eq('deal_id',_ri.dealId)); }catch(e){}
        _ri.plan=ReportImport.buildPlan({reportDate:data.reportDate, buildings:data.buildings||[]}, cat||[], existing, {filename:_ri.filename});
        if(!_ri.plan.buildings.length){ riFailPill('No buildings found in that document — is it a CoStar availability report or survey export?'); return; }
        pillSet('ri','📄 Report read — '+_ri.plan.buildings.length+' building'+(_ri.plan.buildings.length===1?'':'s')+' · Review &amp; import','ready',function(){ riReview(); });
        aiToast('Report read ✓ — click the button at the bottom to review & import.');
      }catch(e){ /* transient — keep polling */ }
    },4000);
  }
  // Errors surface on the pill first; clicking it opens the full explanation
  // sheet with the Try-again button.
  function riFailPill(msg){
    clearInterval(_riTimer); clearInterval(_riTimer2);
    pillSet('ri','⚠ Report import failed — see why','err',function(){ pillClear('ri'); riFail(msg); });
  }
  function riFail(msg){
    clearInterval(_riTimer); clearInterval(_riTimer2);
    openSheet('<h3>Import CoStar report</h3><div class="ssub">'+esc((_ri&&_ri.filename)||'')+'</div>'
      + '<div class="formerr" style="margin:4px 0 12px">'+esc(msg)+'</div>'
      + '<div class="ssub">Nothing was saved. Fix the file (or paste the report text instead) and try again.</div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Close</button><button class="btn pri" onclick="DF.importReport(\''+((_ri&&_ri.dealId)||'')+'\')">Try again</button></div>');
  }
  function riFootLine(){
    var sum=ReportImport.summarize(_ri.plan);
    return 'Will import '+sum.added+' building'+(sum.added===1?'':'s')+' · '+sum.spaces+' space'+(sum.spaces===1?'':'s')
      +(sum.matched?' · '+sum.matched+' matched to your map':'')
      +(sum.skipped?' · '+sum.skipped+' already on this deal (skipped)':'');
  }
  function riReview(){
    var p=_ri.plan;
    var rows=p.buildings.map(function(b,i){
      var badge = b.alreadyOnDeal ? '<span class="ri-badge dup" title="Already a candidate on this deal — its spaces still refresh the tracker">already on this deal</span>'
        : (b.buildingId ? '<span class="ri-badge hit" title="Matched to '+esc(b.catalogName||'')+' in your building catalog">✓ matched</span>'
        : '<span class="ri-badge new" title="Not in your catalog — imports as an address-only candidate">new — not in catalog</span>');
      var open=!!_ri.open[i];
      var head='<tr class="ri-b'+(b.include?'':' off')+'" data-i="'+i+'">'
        + '<td class="ri-ck"><input type="checkbox" data-act="inc" data-i="'+i+'"'+(b.include?' checked':'')+' title="Import this building"></td>'
        + '<td><div class="ri-nm">'+esc(b.catalogName||b.name||b.address||'Building')+'</div>'
        +   '<div class="ri-ad">'+esc(b.address||'')+(b.city?', '+esc(b.city):'')+(b['class']?' · Class '+esc(b['class']):'')+(b.rba?' · '+Number(b.rba).toLocaleString()+' SF':'')+(b.yearBuilt?' · built '+b.yearBuilt:'')+'</div></td>'
        + '<td>'+badge+'</td>'
        + '<td class="ri-cnt">'+b.spaces.length+' space'+(b.spaces.length===1?'':'s')+'</td>'
        + '<td class="ri-tog">'+(b.spaces.length?(open?'▾':'▸'):'')+'</td></tr>';
      var det='';
      if(open&&b.spaces.length){
        det='<tr class="ri-d"><td></td><td colspan="4"><table class="ri-sp"><thead><tr><th>Suite</th><th>Floor</th><th>SF</th><th>Asking rate</th><th>Basis</th><th>Type</th><th>Avail</th><th>Listing</th></tr></thead><tbody>'
          + b.spaces.map(function(sp,j){
              return '<tr>'
                + '<td>'+esc(sp.suite||'—')+'</td><td>'+esc(sp.floor||'—')+'</td>'
                + '<td><input class="ri-in" data-act="sf" data-i="'+i+'" data-j="'+j+'" inputmode="numeric" value="'+(sp.sf==null?'':sp.sf)+'" placeholder="—" title="Edit SF"></td>'
                + '<td><input class="ri-in" data-act="rate" data-i="'+i+'" data-j="'+j+'" inputmode="decimal" value="'+(sp.rate==null?'':sp.rate)+'" placeholder="—" title="Edit asking rate">'+(sp.ratePeriod?'<span class="ri-un">/SF/'+sp.ratePeriod+'</span>':'')+'</td>'
                + '<td>'+esc(sp.rateBasis||'—')+'</td>'
                + '<td>'+esc(sp.spaceType||'—')+'</td>'
                + '<td>'+esc(sp.availableDate||'now')+'</td>'
                + '<td class="ri-ad">'+esc([sp.listingBroker,sp.listingCompany].filter(Boolean).join(', ')||'—')+'</td></tr>';
            }).join('')
          + '</tbody></table></td></tr>';
      }
      return head+det;
    }).join('');
    openSheet('<h3>Review report import</h3><div class="ssub">'+esc(_ri.filename)+(p.reportDate?' · report date '+esc(p.reportDate):'')+' — found <b>'+p.buildings.length+' building'+(p.buildings.length===1?'':'s')+'</b>. Click a row to see &amp; edit its spaces; uncheck any you don\'t want. Checked buildings become candidates on this deal, and every space refreshes your internal availability tracker.</div>'
      + '<div class="cmpwrap" style="max-height:52vh;overflow-y:auto"><table class="ritable"><thead><tr><th class="ri-ck"><input type="checkbox" id="ri_all" checked title="Select all"></th><th>Building</th><th>Catalog</th><th>Spaces</th><th></th></tr></thead><tbody id="ri_body">'+rows+'</tbody></table></div>'
      + '<div class="formerr" id="ri_err"></div>'
      + '<div class="srow"><span class="ri-foot" id="ri_sum">'+esc(riFootLine())+'</span><button class="btn" onclick="DF.close()">Cancel</button><button class="btn pri" id="ri_confirm">Import to deal &amp; tracker</button></div>');
    $('sheet').classList.add('wide');
    $('ri_all').addEventListener('change',function(){ var on=this.checked; p.buildings.forEach(function(b){ b.include=on; }); riReview(); });
    var body=$('ri_body');
    body.addEventListener('click',function(e){
      if(e.target.closest('input')) return;                 // clicks on inputs never toggle the row
      var tr=e.target.closest('tr.ri-b'); if(!tr) return;
      var i=+tr.getAttribute('data-i');
      _ri.open[i]=!_ri.open[i]; riReview();
    });
    body.addEventListener('change',function(e){
      var t=e.target;
      if(t.getAttribute('data-act')!=='inc') return;
      var b=p.buildings[+t.getAttribute('data-i')]; if(!b) return;
      b.include=t.checked;
      var tr=t.closest('tr.ri-b'); if(tr) tr.classList.toggle('off',!t.checked);
      var el=$('ri_sum'); if(el) el.textContent=riFootLine();
    });
    body.addEventListener('input',function(e){
      var t=e.target, act=t.getAttribute('data-act');
      if(act!=='sf'&&act!=='rate') return;
      var b=p.buildings[+t.getAttribute('data-i')]; var sp=b&&b.spaces[+t.getAttribute('data-j')]; if(!sp) return;
      var n=t.value===''?null:Number(String(t.value).replace(/[$,\s]/g,''));
      if(n!=null&&!isFinite(n)) n=null;
      if(act==='sf') sp.sf=(n==null?null:Math.round(n)); else sp.rate=n;
    });
    $('ri_confirm').addEventListener('click',riConfirm);
  }
  async function riConfirm(){
    var p=_ri.plan, btn=$('ri_confirm'), err=$('ri_err');
    var included=p.buildings.filter(function(b){ return b.include; });
    if(!included.length){ err.textContent='Check at least one building to import.'; return; }
    var sum=ReportImport.summarize(p);
    btn.disabled=true; btn.textContent='Importing…'; err.textContent='';
    try{
      // 1) deal_properties candidates (skip buildings already on the deal);
      //    _ri.propsDone guards a retry after a tracker error from double-adding
      if(!_ri.propsDone){
        var adds=included.filter(function(b){ return !b.alreadyOnDeal; }).map(function(b){ return ReportImport.dealPropertyRow(b,_ri.dealId); });
        if(adds.length) await q(sb.from('deal_properties').insert(adds));
        _ri.propsDone=true;
      }
      // 2) market_spaces upsert on (org_id, dedup_key): refresh hits, insert the rest
      var rows=ReportImport.spacePayloads(p);
      var inserted=0, refreshed=0;
      if(rows.length){
        var keys=rows.map(function(r){ return r.dedup_key; });
        var hits=await q(sb.from('market_spaces').select('id,dedup_key').eq('org_id',ReportImport.ORG_ID).in('dedup_key',keys));
        var byKey={}; (hits||[]).forEach(function(h){ byKey[h.dedup_key]=h.id; });
        var seen={}, toInsert=[];
        for(var k=0;k<rows.length;k++){
          var r=rows[k];
          if(byKey[r.dedup_key]){ await q(sb.from('market_spaces').update(ReportImport.spacePatch(r)).eq('id',byKey[r.dedup_key])); refreshed++; }
          else if(!seen[r.dedup_key]){ seen[r.dedup_key]=1; toInsert.push(r); }   // in-report dupes collapse
        }
        if(toInsert.length){ await q(sb.from('market_spaces').insert(toInsert)); inserted=toInsert.length; }
      }
      // 3) floor plans embedded IN the report PDF: render the pages Claude
      //    flagged (masking any listing-broker contact box), file under each
      //    matched building — same pipeline as brochure filing. Best-effort:
      //    a bad page or missing pdf.js never sinks the import.
      var planImgs=0, planSkipped=0;
      if(_ri.file && !_ri.plansDone){
        var withPlans=included.filter(function(b){ return b.floorPlanPages && b.floorPlanPages.length; });
        if(withPlans.length){
          btn.textContent='Filing floor plans…';
          // off-catalog buildings file under 'prop_<deal_property_id>' — fetch
          // the deal rows (just inserted above) to resolve those keys
          var propRows=[]; try{ propRows=await q(sb.from('deal_properties').select('id,building_id,name,address').eq('deal_id',_ri.dealId)); }catch(e){}
          function mediaKeyFor(b){
            if(b.buildingId) return b.buildingId;
            var norm=function(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); };
            var hit=(propRows||[]).filter(function(x){ return !x.building_id && ((b.address&&norm(x.address)===norm(b.address)) || (b.name&&norm(x.name)===norm(b.name))); })[0];
            return hit?('prop_'+hit.id):null;
          }
          try{
            var pdfjs=await loadPdfjs();
            var buf=await _ri.file.arrayBuffer();
            var pdf=await pdfjs.getDocument({data:buf}).promise;
            for(var w=0;w<withPlans.length;w++){
              var bb=withPlans[w];
              var mk=mediaKeyFor(bb);
              if(!mk){ planSkipped+=bb.floorPlanPages.length; continue; }
              var entry={ buildingId:mk, catalogName:bb.catalogName, name:bb.name, filename:_ri.filename };
              var pages=BrochureFile._normalizePages(bb.floorPlanPages);
              for(var g=0;g<pages.length;g++){
                var fp=pages[g];
                if(fp.page>pdf.numPages){ planSkipped++; continue; }
                try{
                  var blob=await bfRenderPage(pdf,fp.page,fp.contactBox);
                  if(!blob){ planSkipped++; continue; }
                  var fpName=String(_ri.filename).replace(/\.pdf$/i,'')+'_p'+fp.page+'.png';
                  var fpPath=BrochureFile.storagePath(entry,'floorplan',bfUniq(),fpName);
                  var fpUp=await sb.storage.from(BF_BUCKET).upload(fpPath, blob, {upsert:false, contentType:'image/png'});
                  if(fpUp.error){ planSkipped++; continue; }
                  var fpPub=sb.storage.from(BF_BUCKET).getPublicUrl(fpPath);
                  await q(sb.from('building_media').insert(BrochureFile.floorplanMediaRow(entry,fp.page,fpPath,fpPub&&fpPub.data?fpPub.data.publicUrl:null)));
                  planImgs++;
                }catch(pe){ planSkipped++; }
              }
            }
          }catch(pe){ /* pdf.js unavailable — plans skipped, import still lands */ }
        }
        _ri.plansDone=true;
      }
      pillClear('ri');                 // the background-job pill has served its purpose
      openDeal(_ri.dealId);            // re-render Buildings behind the sheet (same tab stays active)
      openSheet('<h3>Report imported ✓</h3>'
        + '<div class="ri-done">'+esc(sum.line)+(planImgs?' · '+planImgs+' floor-plan image'+(planImgs===1?'':'s')+' filed':'')+(planSkipped?' ('+planSkipped+' page'+(planSkipped===1?'':'s')+' couldn\'t render)':'')+'</div>'
        + '<div class="ssub">The buildings are in this deal\'s <b>Market report</b> section'+(planImgs?' with the report\'s floor plans filed on their dossiers (listing-broker contacts masked)':'')+'. Next: drop any extra brochures on it, then export the report or build the client survey.</div>'
        + '<div class="ssub">Availability tracker: '+inserted+' new space'+(inserted===1?'':'s')+', '+refreshed+' refreshed — source “CoStar report”, internal only. They\'re live in the Market map\'s Spaces drawer.</div>'
        + '<div class="srow"><button class="btn pri" onclick="DF.close()">Done</button></div>');
    }catch(e){
      err.textContent='Import failed: '+(e.message||e)+(/market_spaces.*(does not exist|relation)/i.test(e.message||'')?' — run supabase/market-spaces.sql first.':'');
      btn.disabled=false; btn.textContent='Import to deal & tracker';
    }
  }

  /* ---------- Brochure auto-filing (Buildings tab) ----------
   * Phase 2 of the requirement→deliverable flow. Batch-drop listing brokers'
   * marketing PDFs → each is staged in a deal_brochure_extracts job row and
   * read by deal-brochure-extract-background (Claude identifies the building,
   * advertised spaces, floor-plan pages, filing label) → the broker reviews →
   * confirm uploads the PDF to the building-media bucket + building_media
   * (kind 'brochure'), renders the floor-plan pages to images (pdf.js, lazy)
   * as kind 'floorplan', and upserts market_spaces (source 'flyer').
   * Pure mapping lives in assets/brochure-file.js (shared with
   * tools/brochure-test.js). Not CoStar data — no firewall — but everything
   * here still runs behind the broker login. */
  var BF_BUCKET='building-media', BF_MAX_FILES=12;
  var _bf=null, _bfTimer=null, _bfSeq=0, _pdfjsP=null;
  function bfUniq(){ _bfSeq++; return Date.now()+'-'+_bfSeq; }
  function bfNewJobId(){
    if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,function(){ return (Math.random()*16|0).toString(16); });
  }
  function fileBrochures(dealId){
    _bf={dealId:dealId, jobs:[], plan:null, open:{}};
    loadPortalBuildings();                       // warm the catalog for matching
    openSheet('<h3>File brochures &amp; flyers</h3><div class="ssub">Drop the listing brokers\' marketing PDFs for this requirement — brochures, availability flyers, floor-plan packages, up to '+BF_MAX_FILES+' at once. Claude identifies which building each one belongs to, pulls the advertised spaces and floor-plan pages, and you review everything before it\'s filed.</div>'
      + fld('Marketing PDFs','<input id="bf_files" type="file" accept=".pdf,application/pdf" multiple>')
      + '<div class="formerr" id="bf_err"></div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn pri" id="bf_go">⬆ Read files</button></div>');
    $('bf_go').addEventListener('click', bfStart);
  }
  async function bfStart(){
    var files=Array.prototype.slice.call(($('bf_files').files)||[]);
    var err=$('bf_err');
    var v=bfValidate(files);
    if(v){ err.textContent=v; return; }
    $('bf_go').disabled=true; err.textContent='';
    bfLaunch(files);
  }
  function bfBusy(){ return !!(_bf&&_bf.jobs&&_bf.jobs.some(function(j){ return j.status==='queued'; })); }
  function bfValidate(files){
    if(bfBusy()) return 'Still reading the previous batch — wait for its Review button at the bottom.';
    if(!files.length) return 'Pick at least one PDF.';
    if(files.length>BF_MAX_FILES) return 'Up to '+BF_MAX_FILES+' files per batch — split the rest into a second run.';
    for(var i=0;i<files.length;i++){
      var f=files[i];
      if(!/pdf$/i.test(f.name)&&f.type!=='application/pdf') return '"'+f.name+'" isn\'t a PDF.';
      if(f.size>20*1024*1024) return '"'+f.name+'" is over 20MB — export a lighter version.';
    }
    return null;
  }
  // Shared launcher: stage every file as a job row, kick the background reader
  // for each, then poll IN THE BACKGROUND — the sheet closes immediately and
  // a bottom pill tracks progress. Used by the modal AND the drop zone.
  async function bfLaunch(files){
    closeSheet();
    try{
      var s=await sb.auth.getSession(); var token=(s&&s.data&&s.data.session)?s.data.session.access_token:null;
      if(!token) throw new Error('Your session expired — please sign in again.');
      for(var k=0;k<files.length;k++){
        var file=files[k], jobId=bfNewJobId();
        pillSet('bf','Uploading '+(k+1)+' of '+files.length+' — '+esc(file.name),'busy');
        var b64=await fileB64(file);
        await q(sb.from('deal_brochure_extracts').insert({ id:jobId, org_id:ReportImport.ORG_ID, deal_id:_bf.dealId, filename:file.name, pdf_b64:b64 }));
        var res=await fetch('/.netlify/functions/deal-brochure-extract-background',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({token:token, jobId:jobId})});
        if(res.status===401) throw new Error('Your session expired — please sign in again.');
        if(res.status>=500) throw new Error('The reader couldn\'t start for "'+file.name+'" (HTTP '+res.status+'). Try again.');
        _bf.jobs.push({ id:jobId, file:file, filename:file.name, status:'queued', result:null, error:null });
      }
      aiToast('Reading '+files.length+' file'+(files.length===1?'':'s')+' in the background — keep working. A Review button appears at the bottom when they\'re ready.');
      bfProgress(); bfPoll();
    }catch(e){ bfFailPill((e&&e.message)||String(e), /brochure_extracts.*(does not exist|relation)/i.test((e&&e.message)||'')?' Run supabase/brochure-filing.sql first.':''); }
  }
  /* Market-report drop zone: PDFs dropped (or browsed) go straight into the
   * filing pipeline — no modal, the progress sheet opens immediately.
   * NOTE: this handler is wired to BOTH dragenter and dragover on every zone.
   * Per the HTML drag-and-drop spec an element only becomes the drop target
   * if DRAGENTER is canceled — cancel only dragover and the drop retargets to
   * <body> (which is exactly what made drops open the PDF in a new tab). */
  function reportDragOver(ev){
    ev.preventDefault(); ev.stopPropagation();
    try{ ev.dataTransfer.dropEffect='copy'; }catch(e){}
    ev.currentTarget.classList.add('over');
  }
  function reportDragLeave(ev){ ev.currentTarget.classList.remove('over'); }
  function reportDrop(ev, dealId){
    ev.preventDefault(); ev.stopPropagation(); ev.currentTarget.classList.remove('over');
    fileBrochuresDrop(dealId, Array.prototype.slice.call((ev.dataTransfer&&ev.dataTransfer.files)||[]));
  }
  // Page-level guard: a drop that misses a zone (even by a pixel) must NOT let
  // the browser open the PDF in a new tab. Real zones stopPropagation, so a
  // drop reaching document was a miss — swallow it and point at the targets.
  document.addEventListener('dragover', function(e){ e.preventDefault(); });
  document.addEventListener('drop', function(e){
    e.preventDefault();
    if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){
      aiToast('Drop PDFs on a building card\'s 📎 chip or the dashed “Drop floor plans & brochures” zone (Market report tab).');
    }
  });
  function reportBrowse(){ _pdropTarget=null; var inp=$('rfDropInput'); if(inp) inp.click(); }
  function reportDropPick(dealId, inp){
    var files=Array.prototype.slice.call(inp.files||[]); inp.value='';
    var target=_pdropTarget; _pdropTarget=null;
    fileBrochuresDrop(dealId, files, target);
  }
  /* Per-building drop chip on each Market report card: the file goes to THAT
   * building — Claude still reads spaces/floor plans, but the building
   * assignment is locked to the card it was dropped on. */
  var _pdropTarget=null;
  function propDrop(ev, dealId, buildingId){
    ev.preventDefault(); ev.stopPropagation(); ev.currentTarget.classList.remove('over');
    fileBrochuresDrop(dealId, Array.prototype.slice.call((ev.dataTransfer&&ev.dataTransfer.files)||[]), buildingId);
  }
  function propBrowse(dealId, buildingId){
    _pdropTarget=buildingId; var inp=$('rfDropInput'); if(inp) inp.click();
  }
  // Remove a filed chip (two-click confirm). Inside the chip's <a>, so the
  // link must not open while confirming/deleting.
  async function deleteMediaChip(ev, el, mediaId, storagePath, dealId){
    ev.preventDefault(); ev.stopPropagation();
    if(!armConfirm(el,'sure?')) return;
    try{
      if(storagePath){ try{ await sb.storage.from(BF_BUCKET).remove([storagePath]); }catch(se){} }
      await q(sb.from('building_media').delete().eq('id',mediaId));
      openDeal(dealId);
    }catch(e){ alert('Could not remove: '+(e.message||e)); }
  }
  function fileBrochuresDrop(dealId, files, targetBuildingId){
    if(!files.length){
      // e.g. OneDrive cloud-placeholder drops can arrive with zero readable files
      aiToast('No readable file arrived in that drop. If it lives in OneDrive, right-click it → “Always keep on this device”, or click the 📎 chip to browse instead.');
      return;
    }
    var v=bfValidate(files);
    if(v){ aiToast(v); return; }
    _bf={dealId:dealId, jobs:[], plan:null, open:{}, target:targetBuildingId||null};
    loadPortalBuildings();
    if(targetBuildingId){ bfDirectFile(files); } else { bfLaunch(files); }
  }
  /* Direct filing (card drops): the broker said WHICH building — so the PDF
   * files there IMMEDIATELY as a clickable chip; no AI gate, no review, no
   * "doesn't look like marketing" rejection. Claude still reads each file in
   * the background as pure ENRICHMENT (floor-plan images, availability) and
   * quietly adds whatever it finds. */
  async function bfDirectFile(files){
    pillSet('bf','Filing '+files.length+' file'+(files.length===1?'':'s')+'…','busy');
    try{
      var mediaIds=[];
      for(var i=0;i<files.length;i++){
        var f=files[i];
        var entry={ buildingId:_bf.target, filename:f.name };
        var path=BrochureFile.storagePath(entry,'brochure',bfUniq());
        var up=await sb.storage.from(BF_BUCKET).upload(path, f, {upsert:false, contentType:'application/pdf'});
        if(up.error) throw new Error('Upload failed for "'+f.name+'": '+up.error.message);
        var pub=sb.storage.from(BF_BUCKET).getPublicUrl(path);
        var row=await q(sb.from('building_media').insert({ building_id:_bf.target, kind:'brochure', storage_path:path,
          url:pub&&pub.data?pub.data.publicUrl:null, title:f.name.replace(/\.pdf$/i,'') }).select().single());
        mediaIds.push((row&&row.id)||null);
      }
      _bf.mediaIds=mediaIds; _bf.mode='direct';
      openDeal(_bf.dealId);   // the chip is on the card NOW
      aiToast('Filed ✓ — click the chip under the address to open it. Claude is reading in the background for floor plans & availability.');
      bfLaunchEnrich(files);
    }catch(e){
      pillClear('bf');
      var m=(e&&e.message)||String(e);
      aiToast('Filing failed: '+m);
    }
  }
  // Stage the enrichment jobs (same background reader); completion is handled
  // by bfPoll's 'direct' branch. Failures here are non-fatal — the PDF is filed.
  async function bfLaunchEnrich(files){
    try{
      var s=await sb.auth.getSession(); var token=(s&&s.data&&s.data.session)?s.data.session.access_token:null;
      if(!token) return;
      for(var k=0;k<files.length;k++){
        var file=files[k], jobId=bfNewJobId();
        var b64=await fileB64(file);
        await q(sb.from('deal_brochure_extracts').insert({ id:jobId, org_id:ReportImport.ORG_ID, deal_id:_bf.dealId, filename:file.name, pdf_b64:b64 }));
        var res=await fetch('/.netlify/functions/deal-brochure-extract-background',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({token:token, jobId:jobId})});
        if(res.status>=400) continue;
        _bf.jobs.push({ id:jobId, file:file, filename:file.name, mediaId:_bf.mediaIds[k]||null, status:'queued', result:null, error:null });
      }
      if(!_bf.jobs.length){ pillClear('bf'); return; }
      pillSet('bf','Reading for floor plans & availability…','busy');
      bfPoll();
    }catch(e){ pillClear('bf'); /* enrichment is best-effort */ }
  }
  // Apply enrichment silently: label the filed chips, add scrubbed floor-plan
  // images, refresh the tracker. Never opens a review, never reports "not
  // marketing" as an error — the PDF is already where the broker put it.
  async function bfEnrichApply(){
    try{
      var cat=await loadPortalBuildings();
      var readable=_bf.jobs.filter(function(j){ return j.status==='done'&&j.result; });
      if(!readable.length){ pillClear('bf'); return; }   // filed; nothing more to add
      var pickables=(cat||[]).concat(_dealProps.filter(function(x){ return !x.building_id; })
        .map(function(x){ return { id:'prop_'+x.id, name:x.name||x.address||'Untitled', addr:x.address||'' }; }));
      _bf.plan=BrochureFile.buildPlan(readable.map(function(j){ return {filename:j.filename, result:j.result}; }), pickables, {});
      _bf.plan.entries.forEach(function(e,i){ e._file=readable[i]?readable[i].file:null; e._mediaId=readable[i]?readable[i].mediaId:null; });
      var tb=pickables.filter(function(b){ return b.id===_bf.target; })[0]||{ id:_bf.target, name:null };
      var planImgs=0, planSkipped=0;
      for(var i=0;i<_bf.plan.entries.length;i++){
        var e=_bf.plan.entries[i];
        BrochureFile.assignBuilding(e, tb);
        if(e._mediaId&&e.label){ try{ await q(sb.from('building_media').update({title:e.label}).eq('id',e._mediaId)); }catch(ue){} }
        var fr=await bfFilePlans(e);
        planImgs+=fr.imgs; planSkipped+=fr.skipped;
      }
      var ur=await bfUpsertSpaces(BrochureFile.spacePayloads(_bf.plan));
      pillClear('bf');
      if(planImgs||ur.inserted||ur.refreshed){
        openDeal(_bf.dealId);
        aiToast('Also pulled from '+(readable.length===1?'it':'them')+': '
          +(planImgs?planImgs+' floor-plan image'+(planImgs===1?'':'s')+' (broker contacts masked)':'')
          +(planImgs&&(ur.inserted||ur.refreshed)?' · ':'')
          +((ur.inserted||ur.refreshed)?(ur.inserted+' new / '+ur.refreshed+' refreshed tracker space'+((ur.inserted+ur.refreshed)===1?'':'s')):''));
      }
    }catch(e){ pillClear('bf'); /* enrichment is best-effort */ }
  }
  function bfProgress(){
    var done=_bf.jobs.filter(function(j){ return j.status!=='queued'; }).length;
    pillSet('bf','Reading '+_bf.jobs.length+' file'+(_bf.jobs.length===1?'':'s')+' — '+done+' done (each ~15–45s)','busy');
  }
  function bfPoll(){
    clearInterval(_bfTimer);
    _bfTimer=setInterval(async function(){
      var pending=_bf.jobs.filter(function(j){ return j.status==='queued'; }).map(function(j){ return j.id; });
      if(!pending.length){ clearInterval(_bfTimer); return; }
      try{
        // never select pdf_b64 — that's the staged multi-MB upload
        var rows=await q(sb.from('deal_brochure_extracts').select('id,status,result,error').in('id',pending));
        var by={}; (rows||[]).forEach(function(r){ by[r.id]=r; });
        var flipped=false;
        _bf.jobs.forEach(function(j){
          var r=by[j.id]; if(!r||r.status==='queued') return;
          j.status=r.status; j.result=r.result||null; j.error=r.error||null; flipped=true;
        });
        if(_bf.jobs.every(function(j){ return j.status!=='queued'; })){
          clearInterval(_bfTimer);
          // consume: job rows are transient — delete them now that we hold the results
          try{ await q(sb.from('deal_brochure_extracts').delete().in('id',_bf.jobs.map(function(j){ return j.id; }))); }catch(e){}
          if(_bf.mode==='direct'){ bfEnrichApply(); return; }   // card drop: PDF already filed — enrichment only
          var readable=_bf.jobs.filter(function(j){ return j.status==='done'&&j.result; }).length;
          if(!readable){
            bfFailPill('None of the files could be read.', _bf.jobs.map(function(j){ return j.filename+': '+(j.error||'no result'); }).join(' · '));
            return;
          }
          pillSet('bf','📎 '+readable+' file'+(readable===1?'':'s')+' read — Review &amp; file','ready',function(){ bfBuildReview(); });
          aiToast('Brochures read ✓ — click the button at the bottom to review & file.');
        } else if(flipped){ bfProgress(); }
      }catch(e){ /* transient — keep polling */ }
    },4000);
  }
  // Errors surface on the pill first; clicking opens the full sheet.
  function bfFailPill(msg, extra){
    clearInterval(_bfTimer);
    if(_bf&&_bf.jobs) _bf.jobs.forEach(function(j){ if(j.status==='queued') j.status='error'; });   // unblock bfBusy
    pillSet('bf','⚠ Brochure filing failed — see why','err',function(){ pillClear('bf'); bfFail(msg, extra); });
  }
  async function bfBuildReview(){
    var cat=await loadPortalBuildings();
    var readable=_bf.jobs.filter(function(j){ return j.status==='done'&&j.result; });
    if(!readable.length){
      bfFail('None of the files could be read.', _bf.jobs.map(function(j){ return j.filename+': '+(j.error||'no result'); }).join(' · '));
      return;
    }
    // Matchable buildings = the catalog PLUS this deal's own off-catalog rows
    // (as 'prop_<id>' pseudo-entries) — so the AI's address match lands on
    // Crenshaw buildings too, not just Santa Monica catalog entries.
    var pickables=(cat||[]).concat(_dealProps.filter(function(x){ return !x.building_id; })
      .map(function(x){ return { id:'prop_'+x.id, name:x.name||x.address||'Untitled', addr:x.address||'' }; }));
    _bf.plan=BrochureFile.buildPlan(readable.map(function(j){ return {filename:j.filename, result:j.result}; }), pickables, {});
    // re-attach the original File objects (same order buildPlan preserves)
    _bf.plan.entries.forEach(function(e,i){ e._file=readable[i]?readable[i].file:null; });
    // dropped on a specific building's card → that building wins over the AI's match
    if(_bf.target){
      var tb=pickables.filter(function(b){ return b.id===_bf.target; })[0];
      if(!tb&&/^prop_/.test(_bf.target)){
        var pr=_dealProps.filter(function(x){ return 'prop_'+x.id===_bf.target; })[0];
        tb={ id:_bf.target, name:(pr&&(pr.name||pr.address))||'this building' };
      }
      if(tb) _bf.plan.entries.forEach(function(e){ BrochureFile.assignBuilding(e, tb); });
    }
    _bf.failed=_bf.jobs.filter(function(j){ return j.status==='error'; });
    bfReview();
  }
  function bfFail(msg, extra){
    clearInterval(_bfTimer);
    openSheet('<h3>File brochures &amp; flyers</h3>'
      + '<div class="formerr" style="margin:4px 0 12px">'+esc(msg)+(extra?' '+esc(extra):'')+'</div>'
      + '<div class="ssub">Nothing was filed. Fix the files and try again.</div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Close</button><button class="btn pri" onclick="DF.fileBrochures(\''+((_bf&&_bf.dealId)||'')+'\')">Try again</button></div>');
  }
  function bfCatValue(b){ return (b.name||'Untitled')+' — '+(b.addr||''); }
  function bfFootLine(){ return BrochureFile.summarize(_bf.plan).line; }
  function bfReview(){
    var p=_bf.plan;
    // pickable buildings = the catalog PLUS this deal's own off-catalog rows
    // ('prop_' keys) — a Crenshaw deal has zero catalog matches, and its
    // buildings still need somewhere to file.
    var cat=(_portalBuildings||[]).concat(_dealProps.filter(function(x){ return !x.building_id; })
      .map(function(x){ return { id:'prop_'+x.id, name:x.name||x.address||'Untitled', addr:x.address||'' }; }));
    var dl='<datalist id="bf_dl">'+cat.map(function(b){ return '<option value="'+esc(bfCatValue(b))+'"></option>'; }).join('')+'</datalist>';

  function loadPdfjs(){
    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if(_pdfjsP) return _pdfjsP;
    _pdfjsP=new Promise(function(res,rej){
      var s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload=function(){
        try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); }
        catch(e){ rej(e); }
      };
      s.onerror=function(){ rej(new Error('Could not load the PDF renderer for floor-plan pages.')); };
      document.head.appendChild(s);
    });
    return _pdfjsP;
  }
  function bfRenderPage(pdf, pageNo, contactBox){
    return pdf.getPage(pageNo).then(function(page){
      var viewport=page.getViewport({scale:1.6});
      var canvas=document.createElement('canvas');
      canvas.width=Math.ceil(viewport.width); canvas.height=Math.ceil(viewport.height);
      var ctx2=canvas.getContext('2d');
      return page.render({canvasContext:ctx2, viewport:viewport}).promise.then(function(){
        if(contactBox){
          // scrub the listing-broker contact block — these images go on client
          // surfaces; pad the AI's box a hair so nothing peeks out at the edges
          var pad=0.01, w=canvas.width, h=canvas.height;
          var mx=Math.max(0,contactBox.x0-pad)*w, my=Math.max(0,contactBox.y0-pad)*h;
          var mx2=Math.min(1,contactBox.x1+pad)*w, my2=Math.min(1,contactBox.y1+pad)*h;
          ctx2.fillStyle='#fff'; ctx2.fillRect(mx,my,mx2-mx,my2-my);
        }
        return new Promise(function(res){ canvas.toBlob(function(b){ res(b); },'image/png'); });
      });
    });
  }
  // Render this entry's flagged floor-plan pages (masking broker-contact
  // boxes) and file them under the entry's building. Best-effort — a bad page
  // never sinks the filing. Returns {imgs, skipped}.
  async function bfFilePlans(e){
    var imgs=0, skipped=0;
    if(!e.floorPlanPages||!e.floorPlanPages.length||!e._file) return {imgs:0, skipped:0};
    try{
      var pdfjs=await loadPdfjs();
      var buf=await e._file.arrayBuffer();
      var pdf=await pdfjs.getDocument({data:buf}).promise;
      for(var j2=0;j2<e.floorPlanPages.length;j2++){
        var fp=e.floorPlanPages[j2];
        if(fp.page>pdf.numPages){ skipped++; continue; }
        try{
          var blob=await bfRenderPage(pdf,fp.page,fp.contactBox);
          if(!blob){ skipped++; continue; }
          var fpName=e.filename.replace(/\.pdf$/i,'')+'_p'+fp.page+'.png';
          var fpPath=BrochureFile.storagePath(e,'floorplan',bfUniq(),fpName);
          var fpUp=await sb.storage.from(BF_BUCKET).upload(fpPath, blob, {upsert:false, contentType:'image/png'});
          if(fpUp.error){ skipped++; continue; }
          var fpPub=sb.storage.from(BF_BUCKET).getPublicUrl(fpPath);
          await q(sb.from('building_media').insert(BrochureFile.floorplanMediaRow(e,fp.page,fpPath,fpPub&&fpPub.data?fpPub.data.publicUrl:null)));
          imgs++;
        }catch(pe){ skipped++; }
      }
    }catch(pe){ skipped+=e.floorPlanPages.length; }
    return {imgs:imgs, skipped:skipped};
  }
  // Tracker refresh: upsert on (org_id, dedup_key) — flyers fill, never blank,
  // and never demote listing-broker-confirmed rows (spacePatch). Synthetic
  // 'prop_' media keys are NOT catalog ids — those rows key by address alone.
  async function bfUpsertSpaces(rows){
    var inserted=0, refreshed=0;
    rows.forEach(function(r){ if(/^prop_/.test(r.building_id||'')) r.building_id=null; });
    if(rows.length){
      var keys=rows.map(function(r){ return r.dedup_key; });
      var hits=await q(sb.from('market_spaces').select('id,dedup_key,source,listing_broker,listing_company,listing_email,listing_phone').eq('org_id',ReportImport.ORG_ID).in('dedup_key',keys));
      var byKey={}; (hits||[]).forEach(function(h){ byKey[h.dedup_key]=h; });
      var seen={}, toInsert=[];
      for(var k=0;k<rows.length;k++){
        var r=rows[k], ex=byKey[r.dedup_key];
        if(ex){ await q(sb.from('market_spaces').update(BrochureFile.spacePatch(r,ex)).eq('id',ex.id)); refreshed++; }
        else if(!seen[r.dedup_key]){ seen[r.dedup_key]=1; toInsert.push(r); }
      }
      if(toInsert.length){ await q(sb.from('market_spaces').insert(toInsert)); inserted=toInsert.length; }
    }
    return {inserted:inserted, refreshed:refreshed};
  }
  async function bfConfirm(){
    var p=_bf.plan, btn=$('bf_confirm'), err=$('bf_err');
    var sum=BrochureFile.summarize(p);
    if(!sum.filed){ err.textContent='Nothing to file — check at least one document with a building picked.'; return; }
    btn.disabled=true; err.textContent='';
    var todo=p.entries.filter(function(e){ return e.include&&e.buildingId&&e._file; });
    var filed=0, planImgs=0, planSkipped=0, spacesNew=0, spacesRefreshed=0;
    try{
      for(var i=0;i<todo.length;i++){
        var e=todo[i];
        btn.textContent='Filing '+(i+1)+' of '+todo.length+'…';
        // 1) the PDF itself → building-media bucket + building_media (kind 'brochure')
        var path=BrochureFile.storagePath(e,'brochure',bfUniq());
        var up=await sb.storage.from(BF_BUCKET).upload(path, e._file, {upsert:false, contentType:'application/pdf'});
        if(up.error) throw new Error('Upload failed for "'+e.filename+'": '+up.error.message);
        var pub=sb.storage.from(BF_BUCKET).getPublicUrl(path);
        var url=pub&&pub.data?pub.data.publicUrl:null;
        await q(sb.from('building_media').insert(BrochureFile.brochureMediaRow(e,path,url)));
        filed++;
        // 2) floor-plan pages → rendered PNGs (kind 'floorplan')
        var fr=await bfFilePlans(e);
        planImgs+=fr.imgs; planSkipped+=fr.skipped;
      }
      // 3) tracker refresh
      var ur=await bfUpsertSpaces(BrochureFile.spacePayloads(p));
      spacesNew=ur.inserted; spacesRefreshed=ur.refreshed;
      pillClear('bf');                 // the background-job pill has served its purpose
      openDeal(_bf.dealId);
      openSheet('<h3>Brochures filed ✓</h3>'
        + '<div class="ri-done">Filed '+filed+' document'+(filed===1?'':'s')+(planImgs?' · '+planImgs+' floor-plan image'+(planImgs===1?'':'s'):'')+(planSkipped?' ('+planSkipped+' page'+(planSkipped===1?'':'s')+' couldn\'t render)':'')+'</div>'
        + '<div class="ssub">Each PDF and its floor plans are on the building\'s dossier now (open a building to see them under Brochures / floor plans).'
        + (spacesNew||spacesRefreshed?' Availability tracker: '+spacesNew+' new space'+(spacesNew===1?'':'s')+', '+spacesRefreshed+' refreshed — source “flyer”, live in the Market map\'s Spaces drawer.':'')+'</div>'
        + '<div class="srow"><button class="btn pri" onclick="DF.close()">Done</button></div>');
    }catch(e2){
      err.textContent='Filing failed: '+(e2.message||e2)+' — '+filed+' document'+(filed===1?'':'s')+' were already filed; fix and retry for the rest.';
      btn.disabled=false; btn.textContent='File documents';
    }
  }

  function bulkSel(scope){ return scope==='buildings'?'.bsel':(scope==='report'?'.rsel':'.tsel'); }
  function bulkDelLabel(){ return '🗑 Delete selected'; }
  function bulkDisarm(scope){ _delArm=null; if(_delTimer){ clearTimeout(_delTimer); _delTimer=null; } var b=$('bulkdel_'+scope); if(b){ b.textContent=bulkDelLabel(); b.classList.remove('armed'); } }
  function bulkSync(scope){
    var n=0; Array.prototype.forEach.call(document.querySelectorAll(bulkSel(scope)), function(b){ if(b.checked) n++; });
    var c=$('bulkcount_'+scope); if(c) c.textContent=n+' selected';
    var g=$('bulkgo_'+scope); if(g) g.disabled=(n===0);
    var dl=$('bulkdel_'+scope); if(dl) dl.disabled=(n===0);
    if(n===0 && _delArm===scope) bulkDisarm(scope);
  }
  function bulkAll(scope, checked){
    Array.prototype.forEach.call(document.querySelectorAll(bulkSel(scope)), function(b){ b.checked=checked; });
    bulkSync(scope);

  // Two-click delete: first click arms (button turns red "Click again…"), second confirms.
  var _delArm=null, _delTimer=null;
  async function bulkDelete(scope, dealId){
    var boxes=Array.prototype.slice.call(document.querySelectorAll(bulkSel(scope)+':checked'));
    if(!boxes.length) return;
    var btn=$('bulkdel_'+scope);
    if(_delArm!==scope){
      if(_delArm) bulkDisarm(_delArm);
      _delArm=scope;
      if(btn){ btn.textContent='Click again to delete '+boxes.length; btn.classList.add('armed'); }
      _delTimer=setTimeout(function(){ bulkDisarm(scope); }, 3500);
      return;
    }
    bulkDisarm(scope);
    if(btn){ btn.disabled=true; btn.textContent='Deleting…'; }
    try{
      if(scope==='touring'){
        var sids=boxes.map(function(b){ return b.getAttribute('data-sid'); }).filter(Boolean);
        if(sids.length) await q(sb.from('tour_stops').delete().in('id',sids));
      } else {
        var ids=boxes.map(function(b){ return b.getAttribute('data-id'); });
        try{ await q(sb.from('tour_stops').delete().in('property_id',ids)); }catch(e){}   // drop any tour stops for these buildings
        await q(sb.from('deal_properties').delete().in('id',ids));
      }
      openDeal(dealId);
    }catch(e){ alert('Could not delete the selected buildings: '+(e.message||e)); openDeal(dealId); }
  }
  async function bulkMove(scope, dealId){
    var boxes=Array.prototype.slice.call(document.querySelectorAll(bulkSel(scope)+':checked'));
    if(!boxes.length) return;
    var g=$('bulkgo_'+scope); if(g){ g.disabled=true; g.textContent='Working…'; }

      } else if(scope==='report'){

  /* ---------- generic two-click delete (same interaction as the bulk-delete):
     first click ARMS the button — it turns red "Really delete?"; a second click
     within 3.5s executes. Clicking anywhere else, or the timeout, disarms. ---------- */
  var _armBtn=null, _armHtml='', _armTmr=null;
  function armDisarm(){
    if(_armTmr){ clearTimeout(_armTmr); _armTmr=null; }
    if(_armBtn){ _armBtn.classList.remove('armed'); _armBtn.innerHTML=_armHtml; }
    _armBtn=null; _armHtml='';
  }
  function armConfirm(btn, label){
    if(_armBtn===btn){ armDisarm(); return true; }          // second click → go
    armDisarm();                                            // only one armed button at a time
    _armBtn=btn; _armHtml=btn.innerHTML;
    btn.classList.add('armed'); btn.textContent=label||'Really delete?';
    _armTmr=setTimeout(armDisarm, 3500);

  }
  document.addEventListener('mousedown', function(e){

  // Whole proposal thread. DB cascades the rounds + document ROWS (FKs), but
  // Storage objects don't cascade — collect and remove those files first.
  async function deleteProposal(btn, proposalId, dealId){
    if(!armConfirm(btn,'Really delete? rounds & files too')) return;
    btn.disabled=true; btn.textContent='Deleting…';
    try{
      var paths=[];
      try{
        (await q(sb.from('documents').select('storage_path').eq('proposal_id',proposalId))||[])
          .forEach(function(dc){ if(dc.storage_path && paths.indexOf(dc.storage_path)<0) paths.push(dc.storage_path); });
        var rids=((await q(sb.from('proposal_rounds').select('id').eq('proposal_id',proposalId)))||[]).map(function(r){ return r.id; });
        if(rids.length){
          (await q(sb.from('documents').select('storage_path').in('round_id',rids))||[])
            .forEach(function(dc){ if(dc.storage_path && paths.indexOf(dc.storage_path)<0) paths.push(dc.storage_path); });
        }
      }catch(e){}
      if(paths.length){ try{ await sb.storage.from('deal-files').remove(paths); }catch(e){} }
      await q(sb.from('proposals').delete().eq('id',proposalId));   // rounds + doc rows cascade in the DB
      openDeal(dealId);

    var w=window.open('','_blank'); if(!w){ alert('Please allow pop-ups to generate the market report.'); return; }

    // wait for floor-plan images before printing (capped so a dead URL can't hang it)

    var fired=false; function goPrint(){ if(fired) return; fired=true; try{ w.print(); }catch(e){} }

  /* ---------- client survey (Phase 3 of requirement→deliverable) ----------

  async function csBuild(dealId){

    btn.disabled=true; btn.textContent='Building…'; err.textContent='';
    try{
      var s=await sb.auth.getSession(); var token=(s&&s.data&&s.data.session)?s.data.session.access_token:null;
      if(!token) throw new Error('Your session expired — please sign in again.');
      var res=await fetch('/.netlify/functions/deal-survey-create',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({token:token, dealId:dealId, clientName:($('cs_name').value||'').trim(), clientLogoUrl:($('cs_logo').value||'').trim(), passcode:passcode})});
      var data=null; try{ data=await res.json(); }catch(e){}
      if(!res.ok) throw new Error((data&&data.error)||('The survey builder failed (HTTP '+res.status+').'));
      var skippedNote=(data.skipped&&data.skipped.length)?'<div class="ssub" style="color:#7a5a15">Not included (no catalog match): '+esc(data.skipped.join(', '))+' — open each and pick its catalog building, then rebuild.</div>':'';

        + '<div class="ri-done">'+data.buildingCount+' building'+(data.buildingCount===1?'':'s')+' packaged for your client</div>'
        + skippedNote
        + fld('Share link','<input id="cs_url" value="'+esc(data.url)+'" readonly onclick="this.select()">')
        + '<div class="ssub">Send the link and the passcode <b>separately</b> (link by email, passcode by text works well). The client sees dossiers, photos, floor plans and a compare view — and can download the PDF. This link stays listed on the deal\'s Market report section.</div>'
        + '<div class="srow"><button class="btn" onclick="DF.close()">Done</button>'
        +   '<button class="btn" onclick="window.open(\''+esc(data.url)+'\',\'_blank\')">Open it</button>'
        +   '<button class="btn pri" onclick="DF.copySurveyLink(this,\''+esc(data.url)+'\')">Copy link</button></div>');
      openDeal(dealId);   // refresh so the ledger line appears under the report section
    }catch(e){
      err.textContent=(e&&e.message)||String(e);
      btn.disabled=false; btn.textContent='Build survey';

  function copySurveyLink(btn, url){

      var t=btn.textContent; btn.textContent='copied ✓'; setTimeout(function(){ btn.textContent=t; },1400);
    }).catch(function(){ window.prompt('Copy the survey link:', url); });

  /* ---------- RFP: generate a Request for Proposal + send to listing brokers ---------- */
  var _rfpProps=[];
  async function generateRfp(dealId){
    await loadPortalBuildings();
    var d=deals.filter(function(x){return x.id===dealId;})[0]||{};
    try{ _rfpProps=await q(sb.from('deal_properties').select('*').eq('deal_id',dealId).order('sort_order')); }catch(e){ _rfpProps=[]; }
    var bldgList=_rfpProps.length?_rfpProps.map(function(p){return p.name;}).filter(Boolean).join(', '):'the shortlisted buildings';
    openSheet('<h3>Generate RFP</h3><div class="ssub">Describe the requirement and Claude drafts a Request for Proposal you can send to the listing brokers on this deal — asking each for base rent, opex, TI, free rent, escalations, options and parking.</div>'
      + fld('Requirement <span class="u">size, term, use, timing, must-haves</span>','<textarea id="rfp_req" style="min-height:120px" placeholder="e.g. ~9,500 RSF for a creative-office tenant, 5–7 year term, occupancy by Q1, needs 3.5/1,000 parking, prefers move-in-ready or modest TI, one renewal option.">'+esc(d.__rfpReq||'')+'</textarea>')
      + '<div class="hint" style="margin:2px 0 8px">Buildings on this deal: '+esc(bldgList)+'</div>'
      + '<div class="formerr" id="rfp_err"></div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn pri" id="rfp_go">✨ Generate RFP</button></div>');
    $('rfp_go').addEventListener('click',function(){ rfpGenerate(dealId, d, this); });

  async function rfpGenerate(dealId, d, btn){
    var req=($('rfp_req').value||'').trim();
    if(!req){ $('rfp_err').textContent='Add a line or two about the requirement first.'; return; }
    btn.disabled=true; btn.textContent='Drafting…'; $('rfp_err').textContent='';
    var ask='Draft a professional Request for Proposal (RFP) document from me — the tenant\'s broker at Havill & Co. — on behalf of my client'
      + (d.client_name?' '+d.client_name:'')+', to be sent to the listing brokers of the buildings we are considering. '
      + 'Base it on this requirement: '+req+'. Structure it as a clean business document: a short intro, the space requirement, our desired lease economics to respond to, the timeline, and a clear list of exactly what each landlord should include in their proposal (base rent and structure, operating expenses, tenant improvement allowance, free rent, annual escalations, renewal/expansion options, and parking). Keep it firm but professional. Output ONLY the RFP document in clean markdown — no preamble or commentary.';
    try{
      var s=await sb.auth.getSession(); var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
      var res=await fetch('/.netlify/functions/deal-ai-assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, dealId:dealId, question:ask})});
      var data=await res.json().catch(function(){return null;});
      var text=data&&data.text?data.text:(data&&data.error?('⚠️ '+data.error):'Could not draft. Please try again.');
      renderRfp(dealId, d, text);
    }catch(e){ $('rfp_err').textContent='Could not draft: '+(e.message||e); btn.disabled=false; btn.textContent='✨ Generate RFP'; }
  }
  function renderRfp(dealId, d, text){
    var subject='RFP — '+(d.client_name?d.client_name+' ':'')+'space requirement';
    // per-building distribution: resolve each building's listing contact from portal data
    var rows=_rfpProps.map(function(p){
      var pb=p.building_id?(_portalBuildings||[]).filter(function(b){return b.id===p.building_id;})[0]:null;
      var c=pb&&pb.leasingContact;
      var who=(c&&c.name?esc(c.name):'Listing broker')+(c&&c.company?' · '+esc(c.company):'');
      var right;
      if(c&&c.email){ right='<button class="btn pri" style="padding:5px 11px" onclick="DF.sendRfpTo(\''+esc(c.email)+'\',\''+dealId+'\',this)">✉ Send</button>'; }
      else { right='<span class="hint">No email on file — copy &amp; send</span>'; }
      return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line,#eee)"><div style="min-width:0;flex:1"><div style="font-size:13px;font-weight:600">'+esc(p.name||'Building')+'</div><div class="hint">'+who+'</div></div>'+right+'</div>';
    }).join('');
    openSheet('<h3>Request for Proposal</h3><div class="ssub">Review and edit, then send to each building\'s listing broker — or copy/download to send yourself.</div>'
      + '<textarea id="rfp_text" class="te-ta" style="min-height:260px">'+esc(text)+'</textarea>'
      + '<div class="srow" style="justify-content:space-between;align-items:center"><div style="display:flex;gap:10px"><button class="btn" onclick="DF.copyRfp()">Copy</button><button class="btn" onclick="DF.downloadRfp(\''+esc(subject)+'\')">Download</button></div>'
      + '<button class="btn" onclick="DF.close()">Done</button></div>'
      + (rows?'<div style="margin-top:14px"><div style="font:600 11.5px Inter;letter-spacing:.02em;color:var(--ink-soft,#40566b);margin-bottom:2px">SEND TO LISTING BROKERS</div>'+rows+'</div>':''));
    _rfpSubject=subject; _rfpDealId=dealId;
  }
  var _rfpSubject='RFP', _rfpDealId=null;
  function copyRfp(){ var t=$('rfp_text'); if(t){ t.select(); try{ document.execCommand('copy'); if(typeof aiToast==='function') aiToast('RFP copied.'); }catch(e){} } }
  function downloadRfp(subject){
    var t=$('rfp_text'); var text=t?t.value:'';
    var html='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(subject||'RFP')+'</title></head><body style="font:13px/1.6 Georgia,serif">'
      + (window.marked?window.marked.parse(text):'<pre style="white-space:pre-wrap">'+esc(text)+'</pre>')+'</body></html>';
    var blob=new Blob([html],{type:'application/msword'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(subject||'RFP').replace(/[^A-Za-z0-9._-]+/g,'_')+'.doc';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },100);
  }
  async function sendRfpTo(email, dealId, btn){
    var t=$('rfp_text'); var body=t?t.value:'';
    if(!body.trim()){ if(typeof aiToast==='function') aiToast('Nothing to send.'); return; }
    if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
    try{
      var s=await sb.auth.getSession(); var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
      var res=await fetch('/.netlify/functions/deal-send-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, to:email, subject:_rfpSubject, body:body, dealId:dealId})});

  // ---- live "market check": this round's net-effective vs the org's office comps ----
  var _compsCache=null, _compsLoading=false;
  async function loadComps(){
    if(_compsCache) return _compsCache;
    if(_compsLoading) return null;
    _compsLoading=true;
    try{
      var s=await sb.auth.getSession(); var token=(s&&s.data&&s.data.session)?s.data.session.access_token:null;
      var res=await fetch('/.netlify/functions/comps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, action:'list', mode:'broker'})});
      var d=await res.json().catch(function(){return {};});
      _compsCache=(d&&d.comps)||[];
    }catch(e){ _compsCache=[]; }
    _compsLoading=false;
    return _compsCache;
  }
  function _median(a){ if(!a.length) return null; var s=a.slice().sort(function(x,y){return x-y;}); var m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
  function marketCheckHtml(comps, round){
    var er=effectiveRent(round); var mine=er?er.netEff:null;
    var pool=(comps||[]).filter(function(c){ return (c.product_type==='office'||!c.product_type) && c.net_effective_rent_psf!=null; }).map(function(c){ return Number(c.net_effective_rent_psf); });
    var wrap='padding:9px 11px;border-radius:9px;font:400 12px Inter';
    if(!pool.length){
      return '<div style="'+wrap+';background:var(--bg,#f2f5f8);color:var(--ink-faint)">'+(comps&&comps.length?'No office comps to benchmark against yet.':'Add closed deals under <b>Market › Comps</b> to benchmark each round against the market.')+'</div>';
    }
    var lo=Math.min.apply(null,pool), hi=Math.max.apply(null,pool), med=_median(pool);
    var badge='';
    if(mine!=null){
      var pct=med?Math.round((mine-med)/med*100):0;
      var inRange=mine>=lo&&mine<=hi;
      var col=inRange?'#2f855a':(mine<lo?'#2b6cb0':'#b7791f');
      var txt=inRange?'within range':(mine<lo?Math.abs(pct)+'% below median':pct+'% above median');
      badge='<span style="margin-left:auto;font:700 10.5px Inter;color:#fff;background:'+col+';border-radius:5px;padding:2px 8px">'+txt+'</span>';
    }
    var mineTxt=mine!=null?('$'+mine.toFixed(2)+'/SF NER'):'enter base + term →';
    return '<div style="'+wrap+';background:#f6f8fa;border:1px solid var(--line,#e3e9ef)">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><b style="font-size:11.5px;letter-spacing:.02em;color:var(--ink-soft,#40566b)">MARKET CHECK</b>'
      +   '<span style="font-size:10.5px;color:var(--ink-faint)">office comps · '+pool.length+'</span></div>'
      + '<div style="display:flex;align-items:center;gap:10px"><span style="color:var(--ink-faint)">This round</span><b style="font-size:13px">'+mineTxt+'</b>'+badge+'</div>'
      + '<div style="display:flex;align-items:center;gap:10px;margin-top:3px"><span style="color:var(--ink-faint)">Comp NER</span><b>$'+lo.toFixed(2)+' – $'+hi.toFixed(2)+'</b><span style="color:var(--ink-faint);font-size:11px">median $'+med.toFixed(2)+'</span></div></div>';
  }

  function safeName(s){ return (s||'').replace(/[\\/:*?"<>|\n\r\t]/g,' ').replace(/\s+/g,' ').trim(); }
  function todayStamp(){ var dt=new Date(); return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); }
  function proposalFilename(){
    var d=_curRound?deals.filter(function(x){return x.id===_curRound.dealId;})[0]:null;
    var client=safeName((d&&d.client_name)||'')||'Proposal';
    var addr=safeName((_curRound&&(_curRound.address||_curRound.building))||'');
    var parts=[client+' Proposal']; if(addr) parts.push(addr); parts.push(todayStamp());
    return safeName(parts.join(' - '));
  }

  /* ---- firm letterhead (.docx template merge via docxtemplater) ---- */
  function getLetterhead(){
    var b64=null; try{ b64=localStorage.getItem('vantage_letterhead_docx'); }catch(e){}
    if(!b64) return null;
    try{ var bin=atob(b64), len=bin.length, bytes=new Uint8Array(len); for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i); return bytes.buffer; }catch(e){ return null; }
  }
  function pickLetterhead(){
    return new Promise(function(res){
      var inp=document.createElement('input'); inp.type='file'; inp.accept='.docx';
      inp.onchange=function(){
        var f=inp.files&&inp.files[0]; if(!f){ res(null); return; }
        var rd=new FileReader();
        rd.onload=function(){
          var ab=rd.result;
          try{ var bytes=new Uint8Array(ab), bin=''; for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
               localStorage.setItem('vantage_letterhead_docx', btoa(bin)); localStorage.setItem('vantage_letterhead_name', f.name); }catch(e){}
          res(ab);
        };
        rd.readAsArrayBuffer(f);

  function fillTemplateDocx(ab, data, filename){
    var DT = window.docxtemplater || window.Docxtemplater;
    if(!window.PizZip || !DT){ alert('The Word template engine is still loading — give it a second and try again.'); return; }
    try{
      var zip=new window.PizZip(ab);
      var doc=new DT(zip, {paragraphLoop:true, linebreaks:true, nullGetter:function(){ return ''; }});
      doc.render(data);
      var out=doc.getZip().generate({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      var url=URL.createObjectURL(out);
      var a=document.createElement('a'); a.href=url; a.download=(filename||'Proposal')+'.docx';
      document.body.appendChild(a); a.click();
      aiToast('Saved “'+(filename||'Proposal')+'.docx” to your Downloads.');
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
    }catch(e){
      var msg=e.message||(''+e);
      if(e.properties && e.properties.errors){ msg=e.properties.errors.map(function(x){ return (x.properties&&x.properties.explanation)||''; }).filter(Boolean).join('; ')||msg; }
      alert('Could not fill the letterhead template:\n'+msg+'\n\nCheck that your .docx uses the {merge tags} from the template guide.');
    }
  }
