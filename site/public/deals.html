  /* ---------- side-by-side compare ---------- */
  var _cmp=null;
  async function openCompare(dealId){
    var d=deals.filter(function(x){return x.id===dealId;})[0]; if(!d) return;
    $('pipelineView').style.display='none';
    var v=$('dealView'); v.style.display='block';
    $('crumb').innerHTML='Deal flow <b>›</b> '+esc(d.client_name||'Deal')+' <b>›</b> Compare';
    v.innerHTML='<div class="loading">Building comparison…</div>';
    try{
      var props=await q(sb.from('deal_properties').select('id,name').eq('deal_id',dealId));
      var proposals=await q(sb.from('proposals').select('*').eq('deal_id',dealId).order('created_at'));
      var rounds=await q(sb.from('proposal_rounds').select('*').eq('deal_id',dealId).order('round_no'));
      var propById={}; props.forEach(function(p){ propById[p.id]=p; });
      var byProp={}; rounds.forEach(function(r){ (byProp[r.proposal_id]=byProp[r.proposal_id]||[]).push(r); });
      var cols=proposals.filter(function(pr){ return (byProp[pr.id]||[]).length; }).map(function(pr){
        var rs=byProp[pr.id];
        return { proposal:pr, building:(pr.property_id&&propById[pr.property_id])?propById[pr.property_id].name:null,
                 rounds:rs, selId:rs[rs.length-1].id };
      });
      _cmp={dealId:dealId, deal:d, cols:cols};
      renderCompare();
    }catch(e){ v.innerHTML='<div class="loading">Could not build comparison: '+esc(e.message)+'</div>'; }
  }

  function cmpRound(i, roundId){ if(_cmp&&_cmp.cols[i]){ _cmp.cols[i].selId=roundId; renderCompare(); } }

  // export the current comparison (each column at its selected round) to .xlsx —
  // same engine numbers as the on-screen table; SheetJS is already loaded for the model
  function cmpExcel(){
    var c=_cmp; if(!c||!c.cols.length||!window.XLSX) return;
    var sel=c.cols.map(function(col){ return col.rounds.filter(function(r){return r.id===col.selId;})[0]||col.rounds[col.rounds.length-1]; });
    var eff=sel.map(effectiveRent);
    var head=['Metric'].concat(c.cols.map(function(col,i){
      return (col.proposal.title||'Proposal')+(col.building?' — '+col.building:'')+' (Rd '+sel[i].round_no+')';
    }));
    function r(label,fn){ return [label].concat(sel.map(fn)); }
    var aoa=[
      head,
      r('Building',            function(x,i){ return c.cols[i].building||''; }),
      r('Rent structure',      function(x){ return basisLabel(x.rent_basis,x.rent_basis_label); }),
      r('Size (SF)',           function(x){ return x.size_sf==null?null:Number(x.size_sf); }),
      r('Term (months)',       function(x){ return x.term_months==null?null:Number(x.term_months); }),
      r('Starting base ($/SF/yr)',    function(x){ return x.base_rent_psf==null?null:Number(x.base_rent_psf); }),
      r('Opex / NNN load ($/SF/yr)',  function(x){ return x.opex_psf==null?null:Number(x.opex_psf); }),
      ['Gross-equivalent start ($/SF/yr)'].concat(eff.map(function(e){ return e?Number(e.grossStart.toFixed(2)):null; })),
      r('Annual escalation (%)',      function(x){ return x.annual_escalation_pct==null?null:Number(x.annual_escalation_pct); }),
      r('Free rent (months)',         function(x){ return x.free_rent_months==null?null:Number(x.free_rent_months); }),
      r('TI allowance ($/SF)',        function(x){ return x.ti_psf==null?null:Number(x.ti_psf); }),
      ['Net effective rent ($/SF/yr)'].concat(eff.map(function(e){ return e?Number(e.netEff.toFixed(2)):null; })),
      ['Total cost over term ($/SF)'].concat(eff.map(function(e){ return e?Number(e.costPerSF.toFixed(2)):null; })),
      ['Total cost over term ($)'].concat(eff.map(function(e,i){
        var sf=sel[i].size_sf==null?null:Number(sel[i].size_sf);
        return (e&&sf)?Math.round(e.costPerSF*sf):null;
      })),
      [],
      ['Net effective rent normalizes each proposal to one $/SF/yr (gross-equivalent): base + opex, base escalated annually, free rent abating base only, TI credited up front, spread over the term. Prepared by Havill & Co.']
    ];
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[{wch:30}].concat(c.cols.map(function(){ return {wch:24}; }));
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Proposal comparison');
    XLSX.writeFile(wb, ((c.deal.client_name||'Deal')+' — proposal comparison.xlsx').replace(/[\\/:*?"<>|]/g,''));
  }

  function renderCompare(){
    var c=_cmp; if(!c) return;
    var v=$('dealView');
    var back='<button class="dsr-back" style="margin-bottom:14px" onclick="DF.openDeal(\''+c.dealId+'\')">‹ Back to deal</button>';
    if(!c.cols.length){
      v.innerHTML=back+'<div class="dealhead"><div><h1>'+esc(c.deal.client_name||'Deal')+' — compare</h1></div></div>'
        +'<div class="loading">No proposals with rounds yet. Add proposal terms first, then compare.</div>';
      return;
    }
    var sel=c.cols.map(function(col){ return col.rounds.filter(function(r){return r.id===col.selId;})[0]||col.rounds[col.rounds.length-1]; });
    var eff=sel.map(effectiveRent);
    var bestIdx=-1, bestVal=Infinity;
    eff.forEach(function(x,i){ if(x&&x.netEff<bestVal){ bestVal=x.netEff; bestIdx=i; } });

    function row(label,cells,cls){
      return '<tr'+(cls?' class="'+cls+'"':'')+'><td class="rl">'+label+'</td>'+cells.map(function(x){return '<td>'+x+'</td>';}).join('')+'</tr>';
    }
    function fmtTerm(r){ return r.term_months==null?'—':(r.term_months+' mo · '+(r.term_months/12).toFixed(1)+' yr'); }

    var headCells=c.cols.map(function(col,i){
      var opts=col.rounds.map(function(r){
        return '<option value="'+r.id+'"'+(r.id===col.selId?' selected':'')+'>Round '+r.round_no+(r.from_party==='landlord'?' · LL':' · us')+(r.status==='draft'?' (draft)':'')+'</option>';
      }).join('');
      return '<th class="colh">'+esc(col.proposal.title||'Proposal')
        +(col.building?'<div class="ad">'+esc(col.building)+'</div>':'')
        +'<select onchange="DF.cmpRound('+i+',this.value)">'+opts+'</select></th>';
    }).join('');

    var neCells=sel.map(function(r,i){
      if(!eff[i]) return '<td class="num">—<div class="sub2">needs base + term</div></td>';
      return '<td'+(i===bestIdx?' class="best"':'')+'><span class="ne-val">'+psf(eff[i].netEff)+'</span>'
        +(i===bestIdx?'<span class="bestbadge">Best</span>':'')+'<div class="sub2">$/SF/yr gross-equiv</div></td>';
    }).join('');
    var neRow='<tr class="ne"><td class="rl">Net effective rent</td>'+neCells+'</tr>';

    var body=''
      + row('Building', sel.map(function(r,i){ return esc(c.cols[i].building||'—'); }))
      + row('Rent structure', sel.map(function(r){ return esc(basisLabel(r.rent_basis,r.rent_basis_label)); }))
      + row('Size', sel.map(function(r){ return '<span class="num">'+(r.size_sf==null?'—':Number(r.size_sf).toLocaleString()+' SF')+'</span>'; }))
      + row('Term', sel.map(function(r){ return '<span class="num">'+fmtTerm(r)+'</span>'; }))
      + row('Starting base', sel.map(function(r){ return '<span class="num">'+psf(r.base_rent_psf)+'</span>'; }))
      + row('Opex / NNN load', sel.map(function(r){ return '<span class="num">'+(r.opex_psf==null?'—':psf(r.opex_psf))+'</span>'; }))
      + row('Gross-equiv start', sel.map(function(r,i){ return '<span class="num">'+(eff[i]?psf(eff[i].grossStart):'—')+'</span>'; }))
      + row('Annual escalation', sel.map(function(r){ return '<span class="num">'+(r.annual_escalation_pct==null?'—':Number(r.annual_escalation_pct).toFixed(1)+'%')+'</span>'; }))

      +   '(opex = the pass-through paid on top of base — leave blank for full-service). Base rent escalates annually by the '
      +   'escalation %, opex is held flat. Free rent abates base rent only. The TI allowance is credited up front. The total is '
      +   'spread over the term to one $/SF/yr — the number that compares full-service, modified-gross, and NNN deals fairly. '
      +   'Lowest wins. Switch any column\'s round to compare at a given point in the negotiation.</div>';

  async function portalAttach(){
    var d=deals.filter(function(x){return x.id===_ptDealId;})[0]; if(!d) return;
    var selEl=$('pt_pkg'); if(!selEl) return;
    // resolve the package by SLUG (the option value), never by list index — the
    // available list can shift between render and click, and an index would then
    // attach the WRONG client's shortlist. The DB unique constraint + insert also
    // reject an already-linked slug, so double-attach is safe.
    var slug=selEl.value;
    var p=ptLoadPackages().filter(function(x){ return x.slug===slug; })[0];
    if(!p){ var e0=$('pt_err'); if(e0) e0.textContent='That package is no longer available in this browser.'; return; }
    try{
      await q(sb.from('portal_package_links').insert({org_id:d.org_id, hs_company_id:d.hs_company_id, slug:p.slug, label:ptPkgLabel(p), created_by:me.id}).select());
      openPortal(_ptDealId);
    }catch(e){ var er=$('pt_err'); if(er) er.textContent='Could not attach: '+e.message; }
  }

  function attachLeaseDoc(dealId, abstractId){
    var inp=document.createElement('input');
    inp.type='file'; inp.accept='.pdf,.doc,.docx';
    inp.onchange=async function(){
      var file=inp.files&&inp.files[0]; if(!file) return;
      if(file.size>15*1024*1024){ alert('File too large — 15MB max.'); return; }
      var safe=file.name.replace(/[^A-Za-z0-9._-]/g,'_'); var path=dealId+'/'+randSlug(8)+'_'+safe;
      try{
        var up=await sb.storage.from('deal-files').upload(path, file, {upsert:false, contentType:file.type||undefined});
        if(up.error) throw up.error;
        await q(sb.from('documents').insert({deal_id:dealId, proposal_id:null, abstract_id:abstractId||null, kind:'lease',
          filename:file.name, storage_path:path, mime:file.type||null, size_bytes:file.size, uploaded_by:me.id}).select().single());
        openDeal(dealId);
      }catch(e){ alert('Upload failed: '+(e.message||e)); }
    };
    inp.click();
  }

  /* ---------- AI proposal drafting ---------- */
  /* ---------- background-job pills ----------
   * Persistent bottom-center status while Claude reads uploads in the
   * background: spinner while busy, a clickable "Review" button when ready,
   * a clickable error state on failure. Attached to <body>, so they survive
   * every deal re-render. */
  var _pills={};
  function pillHost(){
    var h=document.getElementById('jobpills');
    if(!h){ h=document.createElement('div'); h.id='jobpills'; h.className='jobpills'; document.body.appendChild(h); }
    return h;
  }
  function pillSet(id, html, state, onclick){
    var p=_pills[id];
    if(!p){ p=document.createElement('div'); _pills[id]=p; pillHost().appendChild(p); }
    p.className='jobpill'+(state==='ready'?' ready':(state==='err'?' err':''));
    p.innerHTML=(state==='busy'?'<span class="jp-spin"></span>':'')+html;
    p.onclick=onclick||null;
  }
  function pillClear(id){ var p=_pills[id]; if(p){ p.remove(); delete _pills[id]; } }

  function aiToast(msg){
    var t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
    setTimeout(function(){ t.classList.add('show'); },10);
    setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); },350); }, 9000);
  }
  function toggleVoice(btnId, targetId){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){ alert('Voice input isn\'t supported in this browser — try Chrome, or type the deal points.'); return; }
    if(_rec){ _rec.stop(); _rec=null; return; }
    _rec=new SR(); _rec.continuous=true; _rec.interimResults=false; _rec.lang='en-US';
    _rec.onresult=function(e){ var t=''; for(var i=e.resultIndex;i<e.results.length;i++){ t+=e.results[i][0].transcript; }
      var el=$(targetId); if(el) el.value=(el.value?el.value.replace(/\s*$/,'')+' ':'')+t.trim(); };
    _rec.onerror=function(){ var b=$(btnId); if(b) b.classList.remove('rec'); _rec=null; };
    _rec.onend=function(){ var b=$(btnId); if(b) b.classList.remove('rec'); _rec=null; };
    _rec.start(); var b=$(btnId); if(b) b.classList.add('rec');
  }
  function aiPickTmpl(){ var id=$('ai_tmpl').value; var t=_aiTmpls.filter(function(x){return x.id===id;})[0]; if(t) $('ai_tmplbody').value=t.body||''; }
  function aiDocx(){
    var f=$('ai_docx').files&&$('ai_docx').files[0]; if(!f) return;
    if(!window.mammoth){ alert('The .docx reader is still loading — try again in a moment.'); return; }
    f.arrayBuffer().then(function(ab){ return window.mammoth.extractRawText({arrayBuffer:ab}); })
      .then(function(r){ $('ai_tmplbody').value=r.value||''; })
      .catch(function(e){ alert('Could not read that .docx: '+(e.message||e)); });

  // Read a landlord proposal/LOI PDF → extract terms into a draft round (reverse of aiDraft).
  // Uploads the PDF (so it's attached to the proposal too), then a background function
  // reads it with Claude and writes a pre-filled DRAFT round for the broker to verify.
  function extractFromPdf(dealId, proposalId){
    var inp=document.createElement('input');
    inp.type='file'; inp.accept='.pdf,application/pdf';
    inp.onchange=async function(){
      var file=inp.files&&inp.files[0]; if(!file) return;
      if(!/pdf$/i.test(file.name) && file.type!=='application/pdf'){ alert('Please pick a PDF — for other formats, add the round manually.'); return; }
      if(file.size>15*1024*1024){ alert('File too large — 15MB max.'); return; }
      var safe=file.name.replace(/[^A-Za-z0-9._-]/g,'_');
      var path=dealId+'/'+randSlug(8)+'_'+safe;       // first folder = deal_id → storage RLS scopes by it
      try{
        var up=await sb.storage.from('deal-files').upload(path, file, {upsert:false, contentType:file.type||'application/pdf'});
        if(up.error) throw up.error;
        await q(sb.from('documents').insert({deal_id:dealId, proposal_id:proposalId, kind:'response',
          filename:file.name, storage_path:path, mime:file.type||'application/pdf', size_bytes:file.size, uploaded_by:me.id}).select().single());
        var s=await sb.auth.getSession(); var token=(s&&s.data&&s.data.session)?s.data.session.access_token:null;
        if(!token) throw new Error('Your session expired — please sign in again.');
        var res=await fetch('/.netlify/functions/deal-ai-extract-background',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({token:token, dealId:dealId, proposalId:proposalId, storagePath:path, filename:file.name})});
        if(res.status!==202 && !res.ok) throw new Error('Could not start the read (HTTP '+res.status+'). Is the AI key set up?');
        aiToast('📄 Claude is reading '+file.name+' — the terms will appear as a draft round in ~30 seconds.');
        openDeal(dealId);                       // show the attached file now
        setTimeout(function(){ openDeal(dealId); }, 32000);   // then the draft round

    };
    inp.click();
  }

  function mGet(o,path){ var p=path.split('.'), c=o; for(var i=0;i<p.length;i++){ if(c==null) return undefined; c=c[p[i]]; } return c; }
  function mSet(o,path,v){ var p=path.split('.'), c=o; for(var i=0;i<p.length-1;i++){ if(c[p[i]]==null) c[p[i]]={}; c=c[p[i]]; } c[p[p.length-1]]=v; }
  function optSeed(name,side,structure){ return { id:'o'+(++_optSeq)+'_'+Math.floor(Math.random()*1e6), name:name, side:side, structure:structure, sizeMode:'fixed', rsf:10000, termMonths:60, baseRentPSFmo:0, rentEscalationPct:3, opexBasePSFmo:0, opexGrowthPct:3, freeRentMonths:0, tiPSF:0, parking:{ratioPer1000:0,monthlyRate:0,escalationPct:3}, oneTime:{movingPSF:0,cablingPSF:0,ffnePSF:0}, makeGood:{on:false,psf:0} }; }
  function defaultModel(){ var a=optSeed('Renew in place','stay','FSG'); a._default=true; var b=optSeed('Relocate option','go','NNN'); b._default=true; return { discountRatePct:8, headcountStart:0, densityUsfPerEmp:200, loadFactor:1.15, growth:{low:5,base:10,high:15}, options:[a,b] }; }
  function modelKey(dealId){ return 'vantage_model_'+dealId; }
  function migrateOpt(o){ // upgrade old annual/RSF-year models to monthly ($/SF/mo, term in months)
    if(!o.id) o.id='o'+(++_optSeq)+'_'+Math.floor(Math.random()*1e6);
    if(o.termMonths==null) o.termMonths = o.termYears!=null ? Math.round(o.termYears*12) : 60;
    if(o.baseRentPSFmo==null) o.baseRentPSFmo = o.baseRentPSF!=null ? Math.round((o.baseRentPSF/12)*100)/100 : 0;
    if(o.opexBasePSFmo==null) o.opexBasePSFmo = o.opexBasePSF!=null ? Math.round((o.opexBasePSF/12)*100)/100 : 0;
    delete o.termYears; delete o.baseRentPSF; delete o.opexBasePSF; return o;
  }
  function loadModel(dealId){ try{ var raw=localStorage.getItem(modelKey(dealId)); if(raw){ var m=JSON.parse(raw); if(m&&m.options&&m.options.length){ m.options.forEach(migrateOpt); return m; } } }catch(e){} return defaultModel(); }
  // Auto-flow: keep the deal's financial model in sync with its proposals + lease abstract.
  // Runs silently whenever a deal is opened (so saving a round flows straight into the analysis).
  // Options LINKED to a proposal (o.proposalId) or the abstract (o.fromAbstract) auto-refresh from
  // that source; manually-added or unlinked options are never touched. Broker-set parking / one-time /
  // make-good on a linked option are preserved (rounds don't carry those).
  // Map a saved proposal round to occupancy-model option economics.
  function roundToEcon(r){
    var nnn=['NNN','NN','N','ABS'].indexOf(r.rent_basis)>=0;
    return { rsf:num(r.size_sf)||10000, termMonths:num(r.term_months)||60,
      baseRentPSFmo:Math.round(((num(r.base_rent_psf)||0)/12)*100)/100,
      opexBasePSFmo:Math.round(((num(r.opex_psf)||0)/12)*100)/100,
      structure:nnn?'NNN':'FSG', rentEscalationPct:num(r.annual_escalation_pct)||3,
      freeRentMonths:num(r.free_rent_months)||0, tiPSF:num(r.ti_psf)||0 };
  }
  function syncDealModel(dealId, proposals, rounds, abstract){
    var key=modelKey(dealId), model;
    try{ var raw=localStorage.getItem(key); model = raw? JSON.parse(raw) : defaultModel(); }catch(e){ model=defaultModel(); }
    if(!model.options) model.options=[];
    model.options.forEach(migrateOpt);
    // latest round per proposal (any status) drives refresh; a FINAL round is what
    // auto-adds a new option (drafts flow in only when the broker clicks "Add to
    // financial analysis"). Nothing is dropped unless the proposal lost all rounds.
    var latestRound={}, finalBest={};
    (rounds||[]).forEach(function(r){
      var l=latestRound[r.proposal_id]; if(!l||r.round_no>l.round_no) latestRound[r.proposal_id]=r;
      if(r.status==='final'){ var f=finalBest[r.proposal_id]; if(!f||r.round_no>f.round_no) finalBest[r.proposal_id]=r; }
    });
    var propById={}; (proposals||[]).forEach(function(p){ propById[p.id]=p; });
    var abstractOpt=null; model.options.forEach(function(o){ if(o.fromAbstract) abstractOpt=o; });
    // drop linked options whose proposal no longer has any round (proposal cleared/deleted)
    model.options=model.options.filter(function(o){ return !(o.proposalId && !latestRound[o.proposalId]); });
    // refresh EVERY existing linked option from its proposal's latest round (keeps
    // manually-added draft-based options fresh too)
    model.options.forEach(function(o){
      if(o.proposalId && latestRound[o.proposalId]){ Object.assign(o, roundToEcon(latestRound[o.proposalId])); var pr=propById[o.proposalId]; if(pr&&pr.title) o.name=pr.title; }
    });
    var byProp={}; model.options.forEach(function(o){ if(o.proposalId) byProp[o.proposalId]=o; });
    // auto-add a "go" option for any proposal with a FINAL round that isn't modeled yet
    Object.keys(finalBest).forEach(function(pid){
      if(byProp[pid]) return;
      var r=finalBest[pid], pr=propById[pid], econ=roundToEcon(r);
      model.options.push(Object.assign(optSeed((pr&&pr.title)||'Proposal','go',econ.structure), econ, {proposalId:pid}));
    });
    // refresh / create a "stay" option from the lease abstract
    if(abstract){
      var termY=5; if(abstract.commencement_date&&abstract.expiration_date){ var c=new Date(abstract.commencement_date),e=new Date(abstract.expiration_date); var yy=Math.round((e-c)/(365.25*86400000)); if(yy>0) termY=yy; }
      var aecon={ rsf:num(abstract.size_sf)||10000, baseRentPSFmo:Math.round(((num(abstract.base_rent_psf)||0)/12)*100)/100, termMonths:termY*12 };
      if(abstractOpt) Object.assign(abstractOpt, aecon);
      else model.options.unshift(Object.assign(optSeed('Renew in place','stay','FSG'), aecon, {fromAbstract:true}));
    }
    // once real linked options exist, drop the pristine default blanks
    var hasLinked=model.options.some(function(o){ return o.proposalId||o.fromAbstract; });
    if(hasLinked) model.options=model.options.filter(function(o){ return !o._default; });
    if(model.options.length){ try{ localStorage.setItem(key, JSON.stringify(model)); }catch(e){} }
    // if the model view is open on this deal, re-render live
    if(_modelDeal===dealId && $('modelView') && $('modelView').style.display!=='none'){ _model=model; renderModel(); }
  }
  function saveModel(){ try{ localStorage.setItem(modelKey(_modelDeal), JSON.stringify(_model)); }catch(e){} }
  function mergeDeal(o){ return Object.assign({}, o, { discountRatePct:_model.discountRatePct, headcountStart:_model.headcountStart, densityUsfPerEmp:_model.densityUsfPerEmp, loadFactor:_model.loadFactor, growth:_model.growth }); }

  // Explicit "Add to financial analysis": create/refresh a linked option for this
  // proposal from its latest round (ANY status — draft or final), then open the model.
  async function addProposalToModel(dealId, proposalId){
    var rounds=[]; try{ rounds=await q(sb.from('proposal_rounds').select('*').eq('proposal_id',proposalId).order('round_no',{ascending:false})); }catch(e){}
    var pr=null; try{ pr=(await q(sb.from('proposals').select('*').eq('id',proposalId).limit(1)))[0]||null; }catch(e){}
    var key=modelKey(dealId), model;
    try{ var raw=localStorage.getItem(key); model = raw? JSON.parse(raw) : defaultModel(); }catch(e){ model=defaultModel(); }
    if(!model.options) model.options=[];
    model.options.forEach(migrateOpt);
    var econ = rounds.length ? roundToEcon(rounds[0]) : {};
    var ex = model.options.filter(function(o){ return o.proposalId===proposalId; })[0];
    if(ex){ Object.assign(ex, econ); if(pr&&pr.title) ex.name=pr.title; }
    else { model.options.push(Object.assign(optSeed((pr&&pr.title)||'Proposal','go',econ.structure||'NNN'), econ, {proposalId:proposalId})); }
    if(model.options.some(function(o){ return o.proposalId||o.fromAbstract; })) model.options=model.options.filter(function(o){ return !o._default; });
    try{ localStorage.setItem(key, JSON.stringify(model)); }catch(e){}
    openModel(dealId);   // jump straight into Financial Analysis
  }

  function refreshOutputs(){
    if(!_model||!window.VModel) return;
    var runs=_model.options.map(function(o){ return VModel.runOption(mergeDeal(o)); });
    var bestNpv=null, bestIdx=-1;
    runs.forEach(function(r,i){ if(bestNpv==null||r.base.npv<bestNpv){ bestNpv=r.base.npv; bestIdx=i; } });
    runs.forEach(function(r,i){
      var o=_model.options[i];
      setTxt('mo_'+o.id+'_neteff', psf(r.base.netEffectivePSFmo)+'/SF/mo');
      setTxt('mo_'+o.id+'_allin', money(r.base.allIn));
      var npvCell=$('mo_'+o.id+'_npv'); if(npvCell){ npvCell.textContent=money(r.base.npv); npvCell.className='mval big npv'+(i===bestIdx&&runs.length>1?' best':''); }
      setTxt('mo_'+o.id+'_band', money(r.bands.low.npv)+' – '+money(r.bands.high.npv));
      var sz=r.base.rsf.toLocaleString()+' RSF'+(o.sizeMode==='byHeadcount'?' (sized)':'')+(r.base.shortfallSF>0?(' · ⚠ short '+r.base.shortfallSF.toLocaleString()+' SF'):'');
      setTxt('mo_'+o.id+'_size', sz);
    });
    var stay=null, go=null; runs.forEach(function(r){ if(r.side==='stay'&&!stay)stay=r; if(r.side==='go'&&!go)go=r; });
    var sum=$('modelSummary');
    if(sum){ if(stay&&go){ var dN=go.base.npv-stay.base.npv; sum.innerHTML='<div class="msum '+(dN<0?'go':'stay')+'"><b>'+(dN<0?'Relocating':'Renewing in place')+'</b> is the lower-NPV path by <b>'+money(Math.abs(dN))+'</b> over the term (base case) — Stay '+money(stay.base.npv)+' vs Go '+money(go.base.npv)+'.</div>'; } else sum.innerHTML=''; }
  }
  function setTxt(id,t){ var e=$(id); if(e) e.textContent=t; }
  function modelInput(optId,path,value,isNum){ var o=_model.options.filter(function(x){return x.id===optId;})[0]; if(!o) return; mSet(o,path, isNum?(value===''?0:Number(value)):value); saveModel(); if(path==='side'){ renderModel(); return; } refreshOutputs(); }
  function modelToggle(optId,path,checked){ var o=_model.options.filter(function(x){return x.id===optId;})[0]; if(!o) return; mSet(o,path,!!checked); saveModel(); renderModel(); }
  function modelDeal(path,value){ mSet(_model,path, value===''?0:Number(value)); saveModel(); refreshOutputs(); }
  function modelAdd(){ _model.options.push(optSeed('New option','go','NNN')); saveModel(); renderModel(); }
  function modelRemove(id){ if(_model.options.length<=1) return; _model.options=_model.options.filter(function(o){return o.id!==id;}); saveModel(); renderModel(); }
  function modelUnlink(id){ var o=_model.options.filter(function(x){return x.id===id;})[0]; if(!o) return; delete o.proposalId; delete o.fromAbstract; saveModel(); renderModel(); }
  function modelPrint(){ window.print(); }

  /* ---- Phase 4: scenario presets ---- */
  var SCENARIOS=[{key:'stayvsgo',label:'Stay vs Go'},{key:'expansion',label:'Expansion / contraction'},{key:'blendextend',label:'Blend & extend'},{key:'restack',label:'Restack / densify'}];
  function scenarioTemplate(key){
    function o(name,side,structure,over){ return Object.assign(optSeed(name,side,structure), over||{}); }
    if(key==='expansion') return [ o('Downsize & renew','stay','FSG',{rsf:8000}), o('Renew as-is','stay','FSG',{rsf:10000}), o('Expand — relocate','go','NNN',{rsf:14000,sizeMode:'byHeadcount',oneTime:{movingPSF:8,cablingPSF:6,ffnePSF:20}}) ];
    if(key==='blendextend') return [ o('Ride out current lease','stay','FSG',{termMonths:24}), o('Blend & extend','stay','FSG',{termMonths:84,tiPSF:20}) ];
    if(key==='restack') return [ o('Densify in place','stay','FSG',{rsf:10000,oneTime:{movingPSF:0,cablingPSF:2,ffnePSF:25}}), o('Relocate to grow','go','NNN',{rsf:14000,sizeMode:'byHeadcount',oneTime:{movingPSF:8,cablingPSF:6,ffnePSF:20}}) ];
    return [ o('Renew in place','stay','FSG',{}), o('Relocate option','go','NNN',{}) ];
  }
  function modelScenario(key){
    var lab=(SCENARIOS.filter(function(s){return s.key===key;})[0]||{label:key}).label;
    if(!confirm('Load the "'+lab+'" template? This replaces the current options (assumptions bar is kept).')) return;
    _model.options=scenarioTemplate(key); _model.scenario=key; saveModel(); renderModel();
  }

  /* ---- Phase 5: pre-populate from the deal's proposals + lease abstract ---- */
  async function modelPull(){
    var dealId=_modelDeal;
    var proposals=[], rounds=[], props=[], abst=null;
    try{ proposals=await q(sb.from('proposals').select('id,title,property_id,status').eq('deal_id',dealId).order('created_at')); }catch(e){}
    try{ rounds=await q(sb.from('proposal_rounds').select('*').eq('deal_id',dealId).eq('status','final').order('round_no')); }catch(e){}
    try{ props=await q(sb.from('deal_properties').select('id,name').eq('deal_id',dealId)); }catch(e){}
    try{ var a=await q(sb.from('lease_abstracts').select('*').eq('deal_id',dealId).limit(1)); abst=a&&a[0]; }catch(e){}
    var propName={}; props.forEach(function(p){ propName[p.id]=p.name; });
    var opts=[];
    if(abst){
      var termY=5;
      if(abst.commencement_date&&abst.expiration_date){ var c=new Date(abst.commencement_date), e=new Date(abst.expiration_date); var yr=Math.round((e-c)/(365.25*86400000)); if(yr>0) termY=yr; }
      opts.push(Object.assign(optSeed('Renew in place','stay','FSG'), { rsf:num(abst.size_sf)||10000, baseRentPSFmo:Math.round(((num(abst.base_rent_psf)||0)/12)*100)/100, termMonths:termY*12 }));
    }
    var best={}; rounds.forEach(function(r){ var b=best[r.proposal_id]; if(!b||r.round_no>b.round_no) best[r.proposal_id]=r; });
    proposals.forEach(function(pr){
      var r=best[pr.id]; if(!r) return;
      var name=(pr.property_id&&propName[pr.property_id])||pr.title||'Proposal';
      var nnn=['NNN','NN','N','ABS'].indexOf(r.rent_basis)>=0;
      opts.push(Object.assign(optSeed(name,'go',nnn?'NNN':'FSG'), {
        rsf:num(r.size_sf)||10000, termMonths:num(r.term_months)||60,
        baseRentPSFmo:Math.round(((num(r.base_rent_psf)||0)/12)*100)/100, opexBasePSFmo:Math.round(((num(r.opex_psf)||0)/12)*100)/100,
        rentEscalationPct:num(r.annual_escalation_pct)||3, freeRentMonths:num(r.free_rent_months)||0, tiPSF:num(r.ti_psf)||0
      }));
    });
    if(!opts.length){ alert('Nothing to pull yet. Add a lease abstract or some proposal rounds to this deal, then pull.'); return; }
    if(!confirm('Pull '+opts.length+' option'+(opts.length>1?'s':'')+' from '+(abst?'the lease abstract + ':'')+'this deal\'s proposals? This replaces the current options.')) return;
    _model.options=opts; saveModel(); renderModel();
  }

  function round4(v){ return Math.round((v+Number.EPSILON)*10000)/10000; }

  /* ==================================================================
     TOUR ROUTE OPTIMIZER + COORDINATED BROKER EMAILS
     Front-end only. Uses the existing commute.js "matrix" action for
     traffic-aware drive times, an exact/heuristic open-path solver to
     order the buildings, then assigns arrival→departure times from a
     start time + dwell + buffer, and (optionally) has Van draft one
     confirmation email per listing broker with that building's slot.
     ================================================================== */
  var _route=null;        // {dealId, stops:[...], plan:[...], startAddr, startPt}
  var _tourMail=null;     // {dealId, items:[{to,name,building,subject,text,sent}]}
  var _savedTour=null;    // deal_tours row for the OPEN deal (set by openDeal)
  var _dealSurveys=[];    // deal_surveys rows for the OPEN deal (set by openDeal)
  var _dealMedia={};      // building_media (brochure/floorplan) by media key for the OPEN deal
  var _dealProps=[];      // deal_properties rows for the OPEN deal (set by openDeal)
  // Media key: catalog id when the building is linked, else 'prop_<row id>' —
  // so brochures & floor plans file against ANY building on the deal, not just
  // Santa Monica catalog matches (the whole Crenshaw survey had zero matches).

  /* ---------- saved tour: persist the optimizer result (deal_tours) ----------
     The optimize run bills Google, so its result must survive click-out: on

     back — full itinerary + map with ZERO Google calls. Row shape lives in
     assets/tour-plan.js (pure + unit-tested). */
  async function saveTourPlan(r){
    var el=$('rt_saved');

      var row=TourPlan.rowFromPlan(r.dealId, r.plan, {
        dwell:r.dwell, buffer:r.buffer, startAddr:r.startAddr||null,

  // resolve a tour stop to a catalog building (lat/lng + leasingContact).
  // A stop links either directly (building_id) or via its deal_property.
  function _stopBuilding(stop, propById){
    var bid = stop.building_id || (stop.property_id && propById[stop.property_id] && propById[stop.property_id].building_id) || null;
    if(!bid || !_portalBuildings) return null;
    var b=_portalBuildings.filter(function(x){return x.id===bid;})[0];
    return (b && typeof b.lat==='number' && typeof b.lng==='number') ? b : null;
  }
  function _stopName(stop, propById){
    if(stop.property_id && propById[stop.property_id]) return propById[stop.property_id].name;
    return stop.label || 'Tour stop';
  }
  // haversine metres — fallback when Google returns null for a leg
  function _hav(a,b){
    var R=6371000, toR=Math.PI/180;
    var dLat=(b.lat-a.lat)*toR, dLng=(b.lng-a.lng)*toR;
    var s=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLng/2)*Math.sin(dLng/2);
    return 2*R*Math.asin(Math.sqrt(s));
  }
  // seconds for leg i→j, falling back to a ~30 km/h city estimate if null
  function _leg(dur, pts, i, j){
    var v=dur&&dur[i]&&dur[i][j]; if(v!=null && isFinite(v)) return v;
    return (_hav(pts[i],pts[j])/1000)/30*3600;
  }
  function fmtClock(d){ return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }

  // Open-path order over building matrix-indices `idxs`, optional fixed start
  // node `startNode` (>=0). Exact (permutations) for small sets, nearest-
  // neighbour + 2-opt above the exact threshold. Directed/asymmetric-safe.
  function _solveRoute(dur, pts, idxs, startNode){
    var B=idxs.length;
    function cost(order){
      var c=0;
      if(startNode>=0) c+=_leg(dur,pts,startNode,order[0]);
      for(var k=0;k<order.length-1;k++) c+=_leg(dur,pts,order[k],order[k+1]);
      return c;
    }
    if(B<=1) return idxs.slice();
    if(B<=8){ // exact — permute (Heap's algorithm)
      var best=null, bestC=Infinity, a=idxs.slice();
      var c=new Array(B).fill(0), i=0;
      var trial=a.slice(); var tc=cost(trial); if(tc<bestC){bestC=tc;best=trial.slice();}
      while(i<B){
        if(c[i]<i){
          var s=(i%2===0)?0:c[i]; var tmp=a[s]; a[s]=a[i]; a[i]=tmp;
          var cc=cost(a); if(cc<bestC){bestC=cc;best=a.slice();}
          c[i]++; i=0;
        } else { c[i]=0; i++; }
      }
      return best;
    }
    // heuristic: nearest-neighbour (from fixed start, or best of all starts) + 2-opt
    function nn(startFrom){
      var un=idxs.slice(), order=[], cur=startFrom;
      if(startFrom<0){ // pick an arbitrary first = idxs[0]
        cur=un.shift(); order.push(cur);
      }
      while(un.length){
        var bi=0, bd=Infinity;
        for(var k=0;k<un.length;k++){ var dd=_leg(dur,pts,cur,un[k]); if(dd<bd){bd=dd;bi=k;} }
        cur=un.splice(bi,1)[0]; order.push(cur);
      }
      return order;
    }
    var start = startNode>=0 ? nn(startNode) : (function(){
      var bo=null, bc=Infinity;
      for(var s=0;s<idxs.length;s++){ var o=[idxs[s]].concat(nn(-1).filter(function(x){return x!==idxs[s];})); var cc=cost(o); if(cc<bc){bc=cc;bo=o;} }
      return bo||idxs.slice();
    })();
    // 2-opt
    var improved=true, order=start.slice();
    while(improved){
      improved=false;
      for(var i2=0;i2<order.length-1;i2++){
        for(var j2=i2+1;j2<order.length;j2++){
          var cand=order.slice(0,i2).concat(order.slice(i2,j2+1).reverse(), order.slice(j2+1));
          if(cost(cand)<cost(order)-0.5){ order=cand; improved=true; }
        }
      }
    }
    return order;
  }

  // ---- entry: gather stops, ask for the parameters ----
  async function optimizeTour(dealId){
    var d=deals.filter(function(x){return x.id===dealId;})[0]; if(!d) return;
    await loadPortalBuildings();
    var tours=[], props=[];
    try{
      tours=await q(sb.from('tour_stops').select('*').eq('deal_id',dealId).order('scheduled_at',{ascending:true,nullsFirst:false}));
      props=await q(sb.from('deal_properties').select('id,name,building_id').eq('deal_id',dealId));
    }catch(e){ alert('Could not load the tour: '+(e.message||e)); return; }
    var propById={}; props.forEach(function(p){ propById[p.id]=p; });

    var geo=[], nogeo=[];
    (tours||[]).forEach(function(s){
      if(s.status==='cancelled') return;
      var b=_stopBuilding(s, propById);
      if(b) geo.push({stopId:s.id, buildingId:b.id, name:_stopName(s,propById), lat:b.lat, lng:b.lng, contact:b.leasingContact||null, addr:b.addr||''});
      else nogeo.push(_stopName(s,propById));
    });
    if(geo.length<2){
      openSheet('<h3>Optimize tour route</h3><div class="ssub">You need at least two tour stops that are linked to buildings in the catalog (so we have their locations). '
        +(nogeo.length?'These stops have no mapped building yet: '+esc(nogeo.join(', '))+'.':'Add buildings to the tour first.')+'</div>'
        +'<div class="srow"><button class="btn" onclick="DF.close()">Close</button></div>');
      return;
    }
    var startDefault = toLocalInput((tours.filter(function(t){return t.scheduled_at;})[0]||{}).scheduled_at) || '';
    var est = (geo.length+1)*(geo.length+1); // rough element ceiling incl. optional start
    openSheet('<h3>Optimize tour route</h3>'
      +'<div class="ssub">Van will order '+geo.length+' buildings for the shortest drive, then lay out arrival &amp; departure times. Uses live Google traffic-aware drive times.</div>'
      + fld('Tour date &amp; start time','<input id="rt_when" type="datetime-local" value="'+esc(startDefault)+'">')
      + '<div style="display:flex;gap:12px">'
      +   '<div class="fld" style="flex:1"><label>Minutes per building</label><input id="rt_dwell" type="number" min="5" max="90" value="20"></div>'
      +   '<div class="fld" style="flex:1"><label>Buffer between (park, walk)</label><input id="rt_buf" type="number" min="0" max="60" value="10"></div>'
      + '</div>'
      + fld('Start from (optional)','<input id="rt_start" placeholder="your office or a start address — blank = start at the best building">')
      +(nogeo.length?'<div style="font-size:11.5px;color:var(--ink-faint);margin-top:2px">Not routed (no mapped building): '+esc(nogeo.join(', '))+'</div>':'')
      +'<div style="font-size:11px;color:var(--ink-faint);margin-top:8px">≈ up to '+est+' Google elements (~$'+(est*0.01).toFixed(2)+') when you optimize.</div>'
      +'<div class="formerr" id="rt_err"></div>'
      +'<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn pri" id="rt_go">Optimize route</button></div>');
    _route={dealId:dealId, stops:geo, nogeo:nogeo};
    $('rt_go').addEventListener('click',function(){ runOptimize(); });
  }

  async function runOptimize(){
    var r=_route; if(!r) return;
    var whenV=$('rt_when').value;
    if(!whenV){ $('rt_err').textContent='Pick a tour date & start time.'; return; }
    var dwell=Math.max(5,parseInt($('rt_dwell').value,10)||20);
    var buffer=Math.max(0,parseInt($('rt_buf').value,10)||10);
    var startAddr=($('rt_start').value||'').trim();
    var btn=$('rt_go'); btn.disabled=true; btn.textContent='Optimizing…'; $('rt_err').textContent='';
    try{
      var s=await sb.auth.getSession(); var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
      // optional start point → geocode
      var startPt=null;
      if(startAddr){
        var gr=await fetch('/.netlify/functions/commute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, action:'geocode', items:[startAddr]})});
        var gd=await gr.json().catch(function(){return null;});
        var pt=gd&&gd.points&&gd.points[0];
        if(pt&&pt.ok) startPt={lat:pt.lat,lng:pt.lng}; else { $('rt_err').textContent='Could not find that start address — leave it blank or try a fuller address.'; btn.disabled=false; btn.textContent='Optimize route'; return; }
      }
      var pts=(startPt?[startPt]:[]).concat(r.stops.map(function(x){return {lat:x.lat,lng:x.lng};}));
      var offset=startPt?1:0;
      var idxs=r.stops.map(function(_,i){return i+offset;});
      // departureTime only if in the future (Routes rejects past times for traffic-aware)
      var whenIso=new Date(whenV).toISOString();
      var dep=(new Date(whenV).getTime() > Date.now()+60000) ? whenIso : undefined;
      var mr=await fetch('/.netlify/functions/commute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, action:'matrix', origins:pts, destinations:pts, departureTime:dep})});
      var md=await mr.json().catch(function(){return null;});
      if(!mr.ok||!md||!md.durations){ throw new Error((md&&md.error)||'Could not get drive times.'); }
      var dur=md.durations;
      var order=_solveRoute(dur, pts, idxs, startPt?0:-1);

      // assign arrival/departure
      var startT=new Date(whenV).getTime();
      var plan=[], t=startT;
      for(var k=0;k<order.length;k++){
        var si=order[k]-offset, stop=r.stops[si];
        var arrive=t;
        var depart=arrive+dwell*60000;
        var driveNext=null;
        if(k<order.length-1){ driveNext=Math.round(_leg(dur,pts,order[k],order[k+1])/60); t=depart+ (driveNext+buffer)*60000; }
        plan.push({stop:stop, arrive:new Date(arrive), depart:new Date(depart), driveNextMin:driveNext, bufferMin:buffer});
      }
      var leaveBy=null, firstDriveMin=null;
      if(startPt){ firstDriveMin=Math.round(_leg(dur,pts,0,order[0])/60); leaveBy=new Date(startT-firstDriveMin*60000); }
      _route.plan=plan; _route.dwell=dwell; _route.buffer=buffer; _route.leaveBy=leaveBy; _route.firstDriveMin=firstDriveMin; _route.startAddr=startAddr;
      _route.optimizedAt=new Date().toISOString();
      renderRoutePlan();
      saveTourPlan(_route);   // fire-and-forget: the paid result survives click-out
    }catch(e){ $('rt_err').textContent=(e.message||'Optimize failed.'); btn.disabled=false; btn.textContent='Optimize route'; }
  }

  function renderRoutePlan(){
    var r=_route, plan=r.plan;
    var last=plan[plan.length-1];
    var totalMin=Math.round((last.depart.getTime()-plan[0].arrive.getTime())/60000);
    var rows=plan.map(function(p,i){
      return '<div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)">'
        +'<div style="font:700 13px \'JetBrains Mono\',monospace;color:var(--accent,#2d6e7e);white-space:nowrap;min-width:118px">'+fmtClock(p.arrive)+'–'+fmtClock(p.depart)+'</div>'
        +'<div style="min-width:0;flex:1"><div style="font:700 14px \'Bricolage Grotesque\',sans-serif">'+ (i+1)+'. '+esc(p.stop.name)+'</div>'
        + (p.stop.addr?'<div style="font:500 11.5px Inter;color:var(--ink-soft)">'+esc(p.stop.addr)+'</div>':'')
        + (p.driveNextMin!=null?'<div style="font:500 11.5px Inter;color:var(--ink-faint);margin-top:4px">↓ '+p.driveNextMin+' min drive + '+p.bufferMin+' min buffer</div>':'')
        +'</div></div>';
    }).join('');
    openSheet('<h3>Optimized tour plan</h3>'
      +'<div class="ssub">'+plan.length+' buildings · '+totalMin+' min total'
        +(r.leaveBy?' · leave '+(r.startAddr?esc(r.startAddr):'your start')+' by <b>'+fmtClock(r.leaveBy)+'</b> ('+r.firstDriveMin+' min drive)':'')
        +'</div>'
      + rows
      +(r.nogeo&&r.nogeo.length?'<div style="font-size:11.5px;color:var(--ink-faint);margin-top:10px">Not in this route (no mapped building): '+esc(r.nogeo.join(', '))+'</div>':'')
      +'<div class="tsave" id="rt_saved">Saving this tour…</div>'
      +'<div class="formerr" id="rt_err2"></div>'
      +'<div class="srow" style="justify-content:space-between"><button class="btn" onclick="DF.optimizeTour(\''+r.dealId+'\')">‹ Adjust</button>'
      +'<div style="display:flex;gap:10px"><button class="btn" id="rt_apply">Apply schedule</button><button class="btn pri" id="rt_applymail">Apply &amp; draft emails</button></div></div>');
    $('rt_apply').addEventListener('click',function(){ applyRoute(false); });
    $('rt_applymail').addEventListener('click',function(){ applyRoute(true); });
  }

  async function applyRoute(thenMail){
    var r=_route; if(!r||!r.plan) return;
    var b1=$('rt_apply'), b2=$('rt_applymail'); if(b1)b1.disabled=true; if(b2){b2.disabled=true;b2.textContent='Saving…';}
    try{
      for(var i=0;i<r.plan.length;i++){
        var p=r.plan[i];
        await q(sb.from('tour_stops').update({scheduled_at:p.arrive.toISOString(), sort_order:i}).eq('id',p.stop.stopId).select().single());
      }
      if(thenMail){ closeSheet(); draftAllTourEmails(r.dealId); }
      else { closeSheet(); openDeal(r.dealId); if(typeof aiToast==='function') aiToast('Tour schedule updated.'); }
    }catch(e){ var er=$('rt_err2'); if(er) er.textContent='Could not save: '+(e.message||e); if(b1)b1.disabled=false; if(b2){b2.disabled=false;b2.textContent='Apply & draft emails';} }
  }

  // the logged-in broker's display name (for the email "from"/signature), cached
  var _brokerName=null;
  async function getBrokerName(){
    if(_brokerName) return _brokerName;
    try{ var r=await sb.from('profiles').select('full_name').eq('id',me.id).single();
      _brokerName=(r&&r.data&&r.data.full_name)||me.email||'Your broker'; }
    catch(e){ _brokerName=me.email||'Your broker'; }
    return _brokerName;
  }

  // ---- coordinated broker emails: one per building, with its time slot ----
  async function draftAllTourEmails(dealId){
    var d=deals.filter(function(x){return x.id===dealId;})[0]; if(!d) return;
    await loadPortalBuildings();
    var brokerName=await getBrokerName();
    var tours=[], props=[];
    try{
      tours=await q(sb.from('tour_stops').select('*').eq('deal_id',dealId).order('scheduled_at',{ascending:true,nullsFirst:false}));
      props=await q(sb.from('deal_properties').select('id,name,building_id').eq('deal_id',dealId));
    }catch(e){ alert('Could not load the tour.'); return; }
    var propById={}; props.forEach(function(p){ propById[p.id]=p; });
    var targets=[];
    (tours||[]).forEach(function(s){
      if(s.status==='cancelled') return;
      var b=_stopBuilding(s, propById);
      var contact=b&&b.leasingContact;
      if(contact&&contact.email) targets.push({name:_stopName(s,propById), when:s.scheduled_at, contact:contact, addr:(b&&b.addr)||''});
    });
    if(!targets.length){
      openSheet('<h3>Draft broker emails</h3><div class="ssub">None of the tour stops have a listing-broker email on file yet. Add buildings that have a leasing contact, then try again.</div><div class="srow"><button class="btn" onclick="DF.close()">Close</button></div>');
      return;
    }
    openSheet('<h3>Broker tour emails</h3><div class="ssub">Van is drafting '+targets.length+' short email'+(targets.length>1?'s':'')+' — one per listing broker, each with that building’s time…</div><div class="loading" style="padding:26px">✨ Drafting…</div>');
    var s=await sb.auth.getSession(); var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
    var items=await Promise.all(targets.map(function(tg){
      var slot = tg.when ? new Date(tg.when).toLocaleString([], {weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'}) : 'a time to be confirmed';
      // VERY short, one fixed time, and NEVER any client detail (client_name is
      // deliberately not passed — only "a client").
      var ask='Write a very short tour-request email from '+brokerName+', a tenant-representation broker at Havill & Co., to '
        + (tg.contact.name||'the listing broker')+(tg.contact.company?' at '+tg.contact.company:'')
        + ', the listing broker for '+tg.name+(tg.addr?' ('+tg.addr+')':'')+'. '
        + 'The entire email must be 2-3 sentences. State that '+brokerName+' has a client who would like to tour '+tg.name+' at '+slot
        + ', and ask them to confirm the building will be accessible at that time and who we should meet. '
        + 'ABSOLUTE RULE: never mention the client\'s name, company, industry, headcount, or ANY client detail — refer only to "a client". '
        + 'Give ONLY that one time; never propose alternatives. Warm but brief. '
        + 'Output ONLY the email: a "Subject:" line, then the body ending with the name '+brokerName+'. No preamble.';
      return fetch('/.netlify/functions/deal-ai-assist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, dealId:dealId, question:ask})})
        .then(function(res){ return res.json().catch(function(){return null;}); })
        .then(function(data){ return {name:tg.name, to:tg.contact.email, toName:tg.contact.name||'', subject:'Tour request — '+tg.name, text:(data&&data.text)||'Could not draft this one — try again.', sent:false}; })
        .catch(function(){ return {name:tg.name, to:tg.contact.email, toName:tg.contact.name||'', subject:'Tour request — '+tg.name, text:'Could not draft this one — try again.', sent:false}; });
    }));
    _tourMail={dealId:dealId, items:items};
    renderTourMail();
  }

  function renderTourMail(){
    var m=_tourMail; if(!m) return;
    var rows=m.items.map(function(it,i){
      return '<div style="border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px'+(it.sent?';opacity:.6':'')+'">'
        +'<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">'
        +'<div style="font:700 13.5px \'Bricolage Grotesque\',sans-serif">'+esc(it.name)+'</div>'
        +'<div style="font:500 11.5px Inter;color:var(--ink-soft)">'+esc(it.toName?it.toName+' · ':'')+esc(it.to)+'</div></div>'
        +'<textarea class="te-ta" id="tm_'+i+'" style="margin-top:8px;min-height:150px">'+esc(it.text)+'</textarea>'
        +'<div class="srow" style="justify-content:flex-end;margin-top:8px">'
        + (it.sent?'<span style="font:600 12px Inter;color:var(--fitness,#2e7d4f)">Sent ✓</span>'
                  :'<button class="btn" onclick="DF.tourMailCopy('+i+')">Copy</button><button class="btn pri" onclick="DF.tourMailSend('+i+')">Send</button>')
        +'</div></div>';
    }).join('');
    var anyUnsent=m.items.some(function(it){return !it.sent;});
    openSheet('<h3>Broker tour emails</h3><div class="ssub">Review each note, edit anything, then send. Each has just that building’s time and never mentions the client.</div>'
      + rows
      +'<div id="tm_msg" style="font:500 12px Inter;min-height:15px;color:var(--ink-faint)"></div>'
      +'<div class="srow" style="justify-content:space-between"><button class="btn" onclick="DF.close()">Done</button>'
      +(anyUnsent?'<button class="btn pri" id="tm_all">Send all</button>':'')+'</div>');
    var all=$('tm_all'); if(all) all.addEventListener('click',function(){ tourMailSendAll(); });
  }

  function tourMailCopy(i){
    var t=$('tm_'+i); if(!t) return; t.select();
    try{ document.execCommand('copy'); if(typeof aiToast==='function') aiToast('Copied.'); }catch(e){}
  }
  async function tourMailSend(i){
    var m=_tourMail; if(!m||!m.items[i]) return;
    var it=m.items[i]; var ta=$('tm_'+i); var bodyv=ta?ta.value:it.text;
    var msg=$('tm_msg'); if(msg){ msg.textContent='Sending to '+it.to+'…'; msg.style.color='var(--ink-faint)'; }
    try{
      var s=await sb.auth.getSession(); var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
      var res=await fetch('/.netlify/functions/deal-send-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, to:it.to, subject:it.subject, body:bodyv, dealId:m.dealId})});
      var data=await res.json().catch(function(){return null;});
      if(data&&data.ok){ it.text=bodyv; it.sent=true; renderTourMail(); }
      else if(msg){ msg.textContent=(data&&data.error)||'Could not send — copy it instead.'; msg.style.color='#C2453F'; }
    }catch(e){ if(msg){ msg.textContent='Network error.'; msg.style.color='#C2453F'; } }
  }
  async function tourMailSendAll(){
    var m=_tourMail; if(!m) return;
    var btn=$('tm_all'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
    for(var i=0;i<m.items.length;i++){ if(!m.items[i].sent){ /* eslint-disable no-await-in-loop */ await tourMailSend(i); } }
  }

  return {
    optimizeTour:optimizeTour, draftAllTourEmails:draftAllTourEmails, tourMailCopy:tourMailCopy, tourMailSend:tourMailSend,
    showEmails:showEmails, filterEmails:filterEmails, viewEmail:viewEmail, composeEmail:composeEmail, draftCompose:draftCompose, connectEmail:connectEmail, pickProvider:pickProvider,
    openModel:openModel, addProposalToModel:addProposalToModel, modelInput:modelInput, modelToggle:modelToggle, modelDeal:modelDeal, modelAdd:modelAdd, modelRemove:modelRemove, modelUnlink:modelUnlink, modelPrint:modelPrint, modelPdf:modelPdf, modelExcel:modelExcel, modelScenario:modelScenario, modelPull:modelPull,
    showDashboard:showDashboard, showPipeline:showPipeline, setPipeView:setPipeView, openDeal:openDeal, openCompare:openCompare, cmpRound:cmpRound, cmpExcel:cmpExcel, toggleClosed:toggleClosed,
    openPortal:openPortal, portalCoSuggest:portalCoSuggest, portalCoPick:portalCoPick, portalInvite:portalInvite, portalRevoke:portalRevoke, portalAttach:portalAttach, portalDetach:portalDetach, portalNotify:portalNotify,
    clientLinkCompany:clientLinkCompany, clientCoSuggest:clientCoSuggest, clientCoPick:clientCoPick, sendQuestionnaire:sendQuestionnaire, viewQuestionnaire:viewQuestionnaire, copyFieldById:copyFieldById, addMatchToDeal:addMatchToDeal,
    showClients:showClients, rosterSearch:rosterSearch, rosterSort:rosterSort, rosterStartDeal:rosterStartDeal, openClientDetail:openClientDetail, openClientByUid:openClientByUid, rosterSendQuestionnaire:rosterSendQuestionnaire,
    deleteDealAsk:deleteDealAsk, deleteDealCancel:deleteDealCancel, deleteDealDo:deleteDealDo,
    editCommission:editCommission, seedSteps:seedSteps, cycleStep:cycleStep, stepDue:stepDue, stepNote:stepNote, stepNA:stepNA,
    newTask:newTask, toggleTask:toggleTask, deleteTask:deleteTask, recGo:recGo,
    newDeal:newDeal, companySuggest:companySuggest, companyPick:companyPick, newProperty:newProperty, propSuggest:propSuggest, propPick:propPick, setPropStatus:setPropStatus, addToTour:addToTour, importReport:importReport, fileBrochures:fileBrochures, reportDragOver:reportDragOver, reportDragLeave:reportDragLeave, reportDrop:reportDrop, reportBrowse:reportBrowse, reportDropPick:reportDropPick, propDrop:propDrop, propBrowse:propBrowse, deleteMediaChip:deleteMediaChip, bulkSync:bulkSync, bulkAll:bulkAll, bulkMove:bulkMove, bulkDelete:bulkDelete, viewBuilding:viewBuilding, generateMarketReport:generateMarketReport, clientSurvey:clientSurvey, copySurveyLink:copySurveyLink, deleteSurvey:deleteSurvey, dealTab:dealTab, buildTourFromTouring:buildTourFromTouring, newProposal:newProposal, npMode:npMode, newRound:newRound,
    generateRfp:generateRfp, copyRfp:copyRfp, downloadRfp:downloadRfp, sendRfpTo:sendRfpTo,
    setStage:setStage, basisChange:basisChange, marketCheck:marketCheck, close:closeSheet, proposalPdf:proposalPdf, proposalDocx:proposalDocx, copyProposal:copyProposal,
    proposalTemplateDl:proposalTemplateDl, clearLetterhead:clearLetterhead,
    shareDeal:shareDeal, toggleProposalVisible:toggleProposalVisible,
    attachDoc:attachDoc, attachLeaseDoc:attachLeaseDoc, downloadDoc:downloadDoc, deleteDoc:deleteDoc, toggleDocVisible:toggleDocVisible,
    aiDraft:aiDraft, aiPickTmpl:aiPickTmpl, aiDocx:aiDocx, toggleVoice:toggleVoice, editRound:editRound, extractFromPdf:extractFromPdf,
    newTourStop:newTourStop, editTourStop:editTourStop, toggleTourVisible:toggleTourVisible, tourPropChange:tourPropChange,
    editAbstract:editAbstract, addKeyDate:addKeyDate, toggleAbstractVisible:toggleAbstractVisible, readLease:readLease,
    effectiveRent:effectiveRent, grossEquiv:grossEquiv,
    deleteProp:deleteProp, deleteStop:deleteStop, deleteProposal:deleteProposal,
    deleteSavedTour:deleteSavedTour, deleteIntake:deleteIntake
  };
})();
