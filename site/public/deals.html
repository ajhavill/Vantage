<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantage — Deal flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vantage.css"/>
<style>
  /* ---- Deal-flow specific (reuses vantage.css tokens + topbar/auth/buttons) ---- */
  .crumb b{color:var(--ink-soft)}
  .navlink{font:600 12.5px Inter;color:var(--ink-soft);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .navlink:hover{color:var(--accent)}

  .wrap{max-width:1120px;margin:0 auto;padding:22px}
  .vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .vhead h1{font-size:22px}
  .vhead .sub{font-size:12.5px;color:var(--ink-faint);margin-top:3px}

  /* pipeline board */
  .pipe{display:grid;gap:14px;overflow-x:auto;padding-bottom:6px}
  .pcol{background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:160px}
  .pcol .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .pcol .ph .t{font:600 11px Inter;text-transform:uppercase;letter-spacing:.11em;color:var(--ink-faint)}
  .pcol .ph .c{font:600 11px 'JetBrains Mono';color:var(--ink-faint);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  .dcard{background:var(--paper-2);border:1px solid var(--line-2);border-radius:11px;padding:12px;margin-bottom:10px;cursor:pointer;transition:border-color .14s,box-shadow .14s,transform .14s}
  .dcard:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
  .dcard .nm{font:700 14.5px 'Bricolage Grotesque';color:var(--ink);line-height:1.15}
  .dcard .mt{font:500 11.5px Inter;color:var(--ink-faint);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
  .dcard .mt b{color:var(--ink-soft);font-weight:600;font-family:'JetBrains Mono'}
  .pcol .empty{font:400 11.5px Inter;color:var(--ink-faint);text-align:center;padding:14px 4px}
  .closedsec{margin-top:20px}
  .closedtog{font:600 12px Inter;color:var(--ink-faint);background:none;border:0;cursor:pointer;padding:6px 0}
  .closedtog:hover{color:var(--ink-soft)}
  .closedlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:8px}

  /* detail */
  .dealhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .dealhead h1{font-size:24px}
  .dealhead .meta{font:500 12.5px Inter;color:var(--ink-faint);margin-top:4px}
  .stagepick{display:flex;align-items:center;gap:8px}
  .stagepick label{font:600 10.5px Inter;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-faint)}

  .sec{margin-top:26px}
  .sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .sec-h h2{font:700 15px 'Bricolage Grotesque';color:var(--ink)}
  .sec-h .hint{font:400 11.5px Inter;color:var(--ink-faint)}

  .pcard{border:1px solid var(--line);border-radius:13px;background:var(--paper-2);padding:14px 16px;margin-bottom:12px}
  .pcard .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .pcard .top .nm{font:700 15px 'Bricolage Grotesque';color:var(--ink)}
  .pcard .top .ad{font:500 12px Inter;color:var(--ink-soft);margin-top:2px}
  .tag{font:600 10px Inter;text-transform:uppercase;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-soft);background:var(--paper);white-space:nowrap}
  .tag.b{background:var(--building);color:#fff;border-color:var(--building)}
  .nm-link{cursor:pointer;transition:color .12s}
  .nm-link:hover{color:var(--accent)}

  /* building detail sheet */
  .bd-specs{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
  .bd-spec{display:flex;flex-direction:column;gap:1px;border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:var(--paper-2);min-width:78px}
  .bd-spec-l{font:600 10px Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint)}
  .bd-spec-v{font:700 13px Inter;color:var(--ink)}
  .bd-h{font:700 12.5px Inter;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin:16px 0 6px}
  .bd-p{font:500 13px Inter;color:var(--ink-soft);line-height:1.55;margin:3px 0}
  .bd-avail{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
  .bd-avail th{text-align:left;font:600 10.5px Inter;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);border-bottom:1px solid var(--line);padding:5px 8px}
  .bd-avail td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--ink)}
  .bd-avail .num{text-align:right}
  .bd-amens{display:flex;flex-direction:column;gap:6px}
  .bd-amen{display:grid;grid-template-columns:70px 1fr 30px;align-items:center;gap:9px;font:600 12px Inter;color:var(--ink-soft)}
  .bd-amen .bd-bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden}
  .bd-amen .bd-bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .bd-amen b{text-align:right;color:var(--ink)}
  .bd-feats{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .bd-feat{font:600 11.5px Inter;color:var(--ink-soft);background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

  /* rounds table */
  .rounds{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .rtable{width:100%;border-collapse:collapse;font-size:12.5px}
  .rtable th{font:600 10px Inter;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);text-align:left;padding:8px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
  .rtable td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .rtable tr:last-child td{border-bottom:0}
  .rtable .num{font-family:'JetBrains Mono';text-align:right;white-space:nowrap}
  .party{font:600 10px Inter;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:6px}
  .party.tenant{background:rgba(45,110,126,.12);color:var(--accent)}
  .party.landlord{background:rgba(201,84,63,.13);color:var(--dining)}
  .draftpill{font:600 9.5px Inter;text-transform:uppercase;letter-spacing:.06em;color:#9a6a00;background:#fbeecb;border-radius:5px;padding:2px 6px;margin-left:6px}
  .ge{font:500 11.5px Inter;color:var(--ink-faint);margin-top:8px}
  .ge b{color:var(--ink-soft);font-family:'JetBrains Mono'}

  /* emails tab */
  .em-conn{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:12px;background:var(--paper-2);padding:13px 16px;margin-bottom:16px}
  .em-conn.ok{border-color:#bfe3cd;background:rgba(46,140,90,.08);color:#2e7d4f;font:600 12.5px Inter}
  .em-conn .em-sub{font:400 11.5px Inter;color:var(--ink-faint);margin-top:4px;max-width:640px;line-height:1.5}
  .em-filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .em-filters input{flex:1;min-width:200px;font:500 13px Inter;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper);color:var(--ink)}
  .em-filters select{font:500 13px Inter;padding:9px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper);color:var(--ink)}
  .em-filters input:focus,.em-filters select:focus{outline:none;border-color:var(--accent)}
  .em-row{border:1px solid var(--line);border-radius:11px;background:var(--paper-2);padding:12px 15px;margin-bottom:9px;cursor:pointer;transition:border-color .12s}
  .em-row:hover{border-color:var(--accent)}
  .em-subj{font:700 14px 'Bricolage Grotesque';color:var(--ink)}
  .em-meta{font:500 11.5px Inter;color:var(--ink-faint);margin-top:2px}
  .em-snip{font:400 12px Inter;color:var(--ink-soft);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .em-st{font:700 9px Inter;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:1px}
  .em-st.sent{background:rgba(46,140,90,.14);color:#2e7d4f}
  .em-st.draft{background:#fbeecb;color:#9a6a00}
  .em-st.fail{background:rgba(201,84,63,.13);color:var(--dining)}
  .em-viewbody{font:400 13.5px Inter;line-height:1.6;color:var(--ink);white-space:normal;border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--paper);max-height:340px;overflow-y:auto;margin-bottom:14px}
  .em-prov{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .em-prov button{font:600 13px Inter;text-align:left;padding:11px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
  .em-prov button:hover{border-color:var(--accent);color:var(--accent)}
  .em-note{font:400 11.5px Inter;color:var(--ink-faint);line-height:1.6;margin-bottom:8px}

  /* portal building autocomplete */
  .sugg{display:none;margin:-6px 0 12px;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;max-height:230px;overflow-y:auto;background:var(--paper)}
  .sugg.on{display:block}
  .sugg-i{display:flex;flex-direction:column;gap:1px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .sugg-i:last-child{border-bottom:0}
  .sugg-i:hover{background:var(--paper-2)}
  .sugg-n{font:600 13px Inter;color:var(--ink)}
  .sugg-a{font:500 11.5px Inter;color:var(--ink-faint)}
  .sugg-none{padding:9px 12px;font:500 11.5px Inter;color:var(--ink-faint)}
  .pcard .pactions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .pstat{font:500 11.5px Inter;padding:5px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--paper);color:var(--ink-soft);cursor:pointer;white-space:nowrap}
  .pstat:focus{outline:none;border-color:var(--accent)}
  .ptag-in{font:600 11px Inter;color:#2e7d4f}
  .te-ta{width:100%;min-height:230px;font:400 13px Inter;line-height:1.5;padding:12px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper);color:var(--ink);resize:vertical;margin-bottom:12px}

  .miniadd{font:600 11.5px Inter;color:var(--accent);background:none;border:0;cursor:pointer;padding:6px 0;display:inline-flex;align-items:center;gap:5px}
  .miniadd:hover{text-decoration:underline}

  /* modal */
  .ov{position:fixed;inset:0;z-index:2500;display:none;align-items:flex-start;justify-content:center;background:rgba(20,26,38,.46);backdrop-filter:blur(2px);padding:42px 16px;overflow-y:auto}
  .ov.show{display:flex}
  .sheet{width:min(560px,100%);background:var(--paper-2);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 24px}
  .sheet h3{font:700 17px 'Bricolage Grotesque';color:var(--ink);margin-bottom:3px}
  .sheet .ssub{font:400 12px Inter;color:var(--ink-faint);margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .fld.full{grid-column:1/-1}
  .fld label{font:600 10.5px Inter;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}
  .fld input,.fld select,.fld textarea{font:500 14px Inter;padding:10px 12px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper);color:var(--ink);width:100%}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent)}
  .fld textarea{resize:vertical;min-height:62px}
  .fld .u{font:500 11px Inter;color:var(--ink-faint)}
  .srow{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .btn{font:600 13px Inter;border-radius:9px;padding:10px 16px;cursor:pointer;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-soft)}
  .btn:hover{border-color:var(--ink-faint)}
  .btn.pri{background:var(--building);color:#fff;border-color:var(--building)}
  .btn.pri:hover{filter:brightness(1.07)}
  .btn:disabled{opacity:.6;cursor:default}
  .formerr{font:500 12px Inter;color:#C2453F;min-height:15px;margin-top:4px}
  .delx{font:500 11.5px Inter;color:var(--ink-faint);background:none;border:0;cursor:pointer}
  .delx:hover{color:var(--dining)}
  .loading{font:500 13px Inter;color:var(--ink-faint);text-align:center;padding:40px}

  /* share + visibility */
  .dhactions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .act-btn.danger{color:#C2453F;border-color:rgba(194,69,63,.35)}
  .act-btn.danger:hover{background:rgba(194,69,63,.07);border-color:#C2453F}
  .act-btn.danger.solid{background:#C2453F;color:#fff;border-color:#C2453F}
  .act-btn.danger.solid:hover{background:#a83a35}
  .delconfirm{display:inline-flex;align-items:center;gap:8px;font:600 12px Inter;color:#C2453F}
  .delconfirm.err{color:#C2453F}

  /* clients roster */
  .rost-search{font:500 13px Inter;padding:9px 13px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper);min-width:200px}
  .rost-search:focus{outline:none;border-color:var(--accent)}
  .rost-sortwrap{display:inline-flex;align-items:center;gap:6px;font:600 11px Inter;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint)}
  .rost-sort{font:500 13px Inter;padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper);color:var(--ink);cursor:pointer}
  .rost-sort:focus{outline:none;border-color:var(--accent)}
  .rost-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:18px}
  .rost-card{border:1px solid var(--line);border-radius:13px;background:var(--paper-2);padding:15px 16px}
  .rost-nm{font:700 15.5px 'Bricolage Grotesque',sans-serif;color:var(--ink);display:flex;align-items:center;gap:8px}
  .rost-hs{font:700 9px Inter;text-transform:uppercase;letter-spacing:.05em;color:#fff;background:var(--building);border-radius:5px;padding:2px 6px}
  .rost-sub{font:500 12px Inter;color:var(--ink-soft);margin-top:2px}
  .rost-deals{margin-top:11px;display:flex;flex-direction:column;gap:6px}
  .rost-deal{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer}
  .rost-deal:hover{border-color:var(--accent)}
  .rost-stage{font:700 10px Inter;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);background:rgba(45,110,126,.09);border-radius:5px;padding:3px 7px;white-space:nowrap}
  .rost-deal-meta{font:500 11.5px Inter;color:var(--ink-faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rost-go{margin-left:auto;font:600 11.5px Inter;color:var(--accent);white-space:nowrap}
  .rost-more{font:500 11.5px Inter;color:var(--ink-faint);padding:2px 2px}
  .rost-nodeal{margin-top:11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:500 12px Inter;color:var(--ink-faint)}
  .rost-start{font:600 11.5px Inter;color:var(--accent);background:none;border:1px dashed var(--line-2);border-radius:8px;padding:5px 10px;cursor:pointer}
  .rost-start:hover{border-color:var(--accent);border-style:solid}
  .rost-stage.dead{color:var(--ink-faint);background:var(--line)}
  /* client directory card + detail rows */
  .cd-cardline{margin-top:9px;min-height:2px}
  .cd-tag{font:700 10px Inter;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);background:var(--line);border-radius:5px;padding:3px 8px}
  .cd-tag.on{color:#fff;background:var(--accent)}
  .cd-counts{font:500 11.5px Inter;color:var(--ink-faint);margin-top:7px}
  .cd-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper-2);cursor:pointer;text-decoration:none;margin-bottom:7px}
  .cd-row:hover{border-color:var(--accent)}
  .cd-row-nm{font:600 12.5px Inter;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cd-row-meta{font:500 11.5px Inter;color:var(--ink-faint);white-space:nowrap}
  .cd-row-meta.ok{color:var(--fitness,#2e7d4f)}
  .cd-chip{font:600 10.5px Inter;color:var(--accent);border:1px solid var(--line-2);border-radius:6px;padding:3px 7px;white-space:nowrap}
  .cd-chip:hover{border-color:var(--accent)}
  .cd-row .rost-go{margin-left:auto}

  /* questionnaire answers viewer */
  .qa-wrap{border:1px solid var(--line);border-radius:11px;background:var(--paper-2);padding:6px 14px;margin:6px 0 4px;max-height:52vh;overflow:auto}
  .qa-sec{font:700 10.5px Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:12px 0 5px;padding-top:8px;border-top:1px solid var(--line)}
  .qa-sec:first-child{border-top:0;padding-top:2px}
  .qa-row{display:flex;gap:14px;padding:5px 0;font:500 12.5px Inter}
  .qa-l{color:var(--ink-faint);min-width:150px;flex:none}
  .qa-v{color:var(--ink)}
  .qa-dim{color:var(--ink-faint)}

  /* questionnaire section: link cards + best-fit match panel */
  .qnr-card{border:1px solid var(--line);border-radius:12px;background:var(--paper-2);padding:13px 15px;margin-bottom:10px}
  .qnr-card-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .qnr-co{font:700 13.5px 'Bricolage Grotesque',sans-serif;color:var(--ink)}
  .qnr-actions{margin-top:9px}
  .qnr-linkrow{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}
  .qnr-linkinput{flex:1;min-width:220px;font:500 12.5px 'JetBrains Mono',monospace;padding:8px 11px;border:1px solid var(--line-2);border-radius:8px;background:var(--paper);color:var(--ink)}
  .qnr-linkinput:focus{outline:none;border-color:var(--accent)}
  .qnr-hint{font:400 11.5px Inter;color:var(--ink-faint);margin-top:6px}
  .qnr-match{margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .qnr-match-h{font:700 12px Inter;color:var(--ink);margin-bottom:9px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .qnr-fit{font:700 10px Inter;text-transform:uppercase;letter-spacing:.04em;color:#fff;background:var(--accent);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:1px}
  .qnr-add{margin-left:auto;font:600 11px Inter;color:var(--accent);background:none;border:1px solid var(--line-2);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap}
  .qnr-add:hover{border-color:var(--accent)}
  .qnr-add:disabled{opacity:.7;cursor:default}
  .vis{font:600 10.5px Inter;border:1px solid var(--line-2);background:var(--paper);color:var(--ink-faint);border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap}
  .vis:hover{border-color:var(--ink-faint)}
  .vis.on{background:rgba(63,143,107,.12);border-color:rgba(63,143,107,.4);color:var(--fitness)}
  .linkbox input{width:100%;font:500 12.5px 'JetBrains Mono';padding:9px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--paper);color:var(--ink)}
  .docs{margin-top:10px;display:flex;flex-direction:column;gap:4px}
  .docrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
  .docname{display:inline-flex;align-items:center;gap:7px;font:600 12.5px Inter;color:var(--accent);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .docname:hover{text-decoration:underline}

  /* AI drafting */
  .miniadd.ai{color:#7a5af0}
  .vbtn{font-size:13px;line-height:1;background:none;border:1px solid var(--line-2);border-radius:7px;padding:2px 7px;cursor:pointer;margin-left:6px}
  .vbtn.rec{background:rgba(201,84,63,.15);border-color:var(--dining);animation:vpulse 1s infinite}
  @keyframes vpulse{0%,100%{opacity:1}50%{opacity:.45}}
  .rev{font:600 10.5px Inter;color:var(--accent);background:none;border:0;cursor:pointer;text-decoration:underline;margin-left:6px}
  .draftbox{font:400 13px Inter;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:9px;padding:12px 14px;max-height:300px;overflow-y:auto;line-height:1.55}

  @media (max-width:560px){

  /* side-by-side compare */

  .cmp thead th{background:var(--paper);position:sticky;top:0;z-index:2}
  .cmp .colh{font:700 13.5px 'Bricolage Grotesque';color:var(--ink);min-width:172px}

  .cmp .bestbadge{display:inline-block;font:700 9px Inter;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--accent);border-radius:5px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .cmpnote{font:400 11.5px Inter;color:var(--ink-faint);line-height:1.55;margin-top:14px}

  /* view toggle */

  /* deals table */

  .phase{margin-bottom:15px}

  .step-note-txt{font:500 11.5px Inter;color:var(--ink-faint);font-style:italic;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* sub-nav */
  .subnav{max-width:1120px;margin:0 auto;padding:16px 22px 0;display:flex;gap:6px}

  .dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .dstat{background:var(--paper-2);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
  .dstat .k{font:600 10px Inter;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint)}
  .dstat .v{font:800 26px 'Bricolage Grotesque';color:var(--ink);margin-top:4px;line-height:1}
  .dstat .s{font:500 11px Inter;color:var(--ink-faint);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .due:last-child{border-bottom:0}

  .due-when{font:700 11px 'JetBrains Mono';color:var(--ink-faint);width:56px;flex:none}

      var cstat=d.commission_status?'<span class="cst '+d.commission_status+'">'+(COMM_STATUS.filter(function(c){return c[0]===d.commission_status;})[0]||['','?'])[1]+'</span>':'';
      var denom=(a.stepsTotal||0)-(a.stepsNa||0);
      var prog=denom>0?Math.round(100*(a.stepsDone||0)/denom):0;
      var pgcell=a.stepsTotal?('<div class="pgbar"><span style="width:'+prog+'%"></span></div><em>'+prog+'%</em>'):'<em style="color:var(--ink-faint)">—</em>';

        +'<td class="cl"><b>'+esc(d.client_name||'Untitled')+'</b></td>'

    var body=live.map(row).join('')
      + (dead.length?('<tr class="deadhdr"><td colspan="8">Closed / dead ('+dead.length+')</td></tr>'+dead.map(row).join('')):'');

      +'</tr></thead><tbody>'+body+'</tbody></table></div>';

  // Bulk aggregate across all deals: primary building, latest final round economics, step progress.
  async function loadAgg(){
    var ids=deals.map(function(d){return d.id;});
    var agg={}; deals.forEach(function(d){ agg[d.id]={}; });
    if(!ids.length) return agg;
    var props=[], proposals=[], rounds=[], steps=[];
    try{ props=await q(sb.from('deal_properties').select('id,deal_id,name,sort_order').in('deal_id',ids)); }catch(e){}
    try{ proposals=await q(sb.from('proposals').select('id,deal_id,property_id,created_at').in('deal_id',ids)); }catch(e){}
    try{ rounds=await q(sb.from('proposal_rounds').select('deal_id,round_no,status,base_rent_psf,size_sf,term_months').eq('status','final').in('deal_id',ids)); }catch(e){}
    try{ steps=await q(sb.from('deal_steps').select('deal_id,status').in('deal_id',ids)); }catch(e){}
    var propName={}; props.forEach(function(p){ propName[p.id]=p.name; });
    var propsByDeal={}; props.forEach(function(p){ (propsByDeal[p.deal_id]=propsByDeal[p.deal_id]||[]).push(p); });
    var proposalsByDeal={}; proposals.forEach(function(pr){ (proposalsByDeal[pr.deal_id]=proposalsByDeal[pr.deal_id]||[]).push(pr); });
    var bestRound={}; rounds.forEach(function(r){ var b=bestRound[r.deal_id]; if(!b||r.round_no>b.round_no) bestRound[r.deal_id]=r; });
    var stepAgg={}; steps.forEach(function(s){ var a=stepAgg[s.deal_id]=stepAgg[s.deal_id]||{done:0,na:0,total:0}; a.total++; if(s.status==='done') a.done++; else if(s.status==='na') a.na++; });
    deals.forEach(function(d){
      var a=agg[d.id]; var bldg=null;
      var prs=(proposalsByDeal[d.id]||[]).slice().sort(function(x,y){return (x.created_at||'').localeCompare(y.created_at||'');});
      for(var i=0;i<prs.length;i++){ if(prs[i].property_id&&propName[prs[i].property_id]){ bldg=propName[prs[i].property_id]; break; } }
      if(!bldg){ var dp=(propsByDeal[d.id]||[]).slice().sort(function(x,y){return (x.sort_order||0)-(y.sort_order||0);}); if(dp.length) bldg=dp[0].name; }
      a.building=bldg; a.round=bestRound[d.id]||null;
      var sa=stepAgg[d.id]||{done:0,na:0,total:0}; a.stepsDone=sa.done; a.stepsNa=sa.na; a.stepsTotal=sa.total;
    });
    return agg;
  }

  /* ==================================================================
     CLIENTS ROSTER (Phase 2 of merging Clients into Deals)
     A "Clients" lens on the same data: every client (HubSpot companies +
     anyone with a deal), grouped, each showing their deal(s). Click a
     deal to open the unified client+deal page; start one if there's none.
     ================================================================== */
  var _roster=[], _rosterQ='', _rosterSort='recent', _companiesConfigured=null;

  function _keyFor(hsId, name){ return hsId ? ('hs:'+hsId) : ('nm:'+String(name||'').trim().toLowerCase()); }

  // Build the client directory: everyone you've ENGAGED — has a deal (active OR
  // past), a shared package, a questionnaire, or a comp. Enriched with HubSpot info.
  async function buildRoster(){
    await loadCompanies();
    var hsById={}; (_companies||[]).forEach(function(c){ hsById[c.id]=c; });
    var byKey={};
    function ensure(uid, name, hsId){
      if(!byKey[uid]){
        var hs=hsId&&hsById[hsId];
        byKey[uid]={ uid:uid, hs_company_id:hsId||null, name:(name||(hs&&hs.name)||'(unnamed)'), industry:hs?hs.industry:null, city:hs?hs.city:null, inHubspot:!!hsId, deals:[], intakes:[], packages:[], comps:[] };
      }
      return byKey[uid];
    }
    // deals — active AND past (the whole book of business)
    deals.forEach(function(d){ ensure(_keyFor(d.hs_company_id,d.client_name), d.client_name, d.hs_company_id).deals.push(d); });
    // engagement signals (RLS-scoped to the firm)
    var intakes=[], pkgs=[], comps=[];
    try{ intakes=await q(sb.from('intakes').select('slug,company_name,status,hs_company_id,created_at,completed_at').order('created_at',{ascending:false})); }catch(e){}
    try{ pkgs=await q(sb.from('portal_package_links').select('slug,label,hs_company_id,created_at').order('created_at',{ascending:false})); }catch(e){}
    try{ comps=await q(sb.from('comps').select('tenant,building_name,address,rsf,execution_date,net_effective_rent_psf').order('execution_date',{ascending:false,nullsFirst:false})); }catch(e){}
    (intakes||[]).forEach(function(it){ ensure(_keyFor(it.hs_company_id,it.company_name), it.company_name, it.hs_company_id).intakes.push(it); });
    (pkgs||[]).forEach(function(p){ if(p.hs_company_id) ensure('hs:'+p.hs_company_id, null, p.hs_company_id).packages.push(p); });
    (comps||[]).forEach(function(cm){ if(cm.tenant) ensure(_keyFor(null,cm.tenant), cm.tenant, null).comps.push(cm); });

    var arr=Object.keys(byKey).map(function(k){ return byKey[k]; });
    function recency(c){ return [ (c.deals[0]&&(c.deals[0].updated_at||c.deals[0].created_at)), (c.intakes[0]&&c.intakes[0].created_at), (c.packages[0]&&c.packages[0].created_at) ].filter(Boolean).sort().reverse()[0]||''; }
    arr.forEach(function(c,i){
      c.key='rk'+i;   // stable, quote-safe id for onclick handlers
      c.deals.sort(function(a,b){ return String(b.updated_at||b.created_at).localeCompare(String(a.updated_at||a.created_at)); });
      c._active=c.deals.some(function(d){ return d.stage!=='dead'; });
    });
    // active clients first, then by most-recent activity, then name
    arr.sort(function(a,b){
      if(a._active&&!b._active) return -1;
      if(!a._active&&b._active) return 1;
      var r=recency(b).localeCompare(recency(a)); if(r) return r;
      return String(a.name||'').localeCompare(String(b.name||''));
    });
    return arr;
  }

  // last-activity / closed-date helpers for sorting
  function _lastActivity(c){ var d=c.deals[0]; return d?String(d.updated_at||d.created_at):''; }
  function _closedDate(c){
    var closed=c.deals.filter(function(d){ return d.stage==='executed'||d.stage==='dead'; });
    if(!closed.length) return '';
    return closed.map(function(d){ return String(d.updated_at||d.created_at); }).sort().reverse()[0];
  }
  function sortRoster(list){
    var s=_rosterSort||'recent', arr=list.slice();
    if(s==='name') arr.sort(function(a,b){ return String(a.name||'').localeCompare(String(b.name||'')); });
    else if(s==='namez') arr.sort(function(a,b){ return String(b.name||'').localeCompare(String(a.name||'')); });
    else if(s==='active') arr.sort(function(a,b){ if(a._active&&!b._active)return -1; if(!a._active&&b._active)return 1; return _lastActivity(b).localeCompare(_lastActivity(a)); });
    else if(s==='closed') arr.sort(function(a,b){ var ca=_closedDate(a),cb=_closedDate(b); if(ca&&!cb)return -1; if(!ca&&cb)return 1; return cb.localeCompare(ca)|| String(a.name||'').localeCompare(String(b.name||'')); });
    else arr.sort(function(a,b){ return _lastActivity(b).localeCompare(_lastActivity(a)); }); // recent
    return arr;
  }

    var out={tasks:[],steps:[],absts:[]};

    try{ out.steps=await q(sb.from('deal_steps').select('deal_id,label,due_date,status').not('due_date','is',null).in('status',['pending','active'])); }catch(e){}
    try{ out.absts=await q(sb.from('lease_abstracts').select('deal_id,key_dates,expiration_date')); }catch(e){}
    return out;
  }

  function statCard(k,v,sub){ return '<div class="dstat"><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(sub?'<div class="s">'+esc(sub)+'</div>':'')+'</div>'; }
  function byStageMini(active){ var c={}; active.forEach(function(d){ c[d.stage]=(c[d.stage]||0)+1; }); return STAGES.filter(function(s){return c[s[0]];}).map(function(s){ return c[s[0]]+' '+s[1].toLowerCase(); }).join(' · '); }

  async function renderDashboard(){
    var el=$('dashboardView');
    el.innerHTML='<div class="loading">Loading your dashboard…</div>';
    var data; try{ data=await loadDashData(); }catch(e){ el.innerHTML='<div class="loading">Could not load dashboard: '+esc(e.message)+'</div>'; return; }
    var tasks=data.tasks||[], steps=data.steps||[], absts=data.absts||[];
    var year=new Date().getFullYear();
    var dealById={}; deals.forEach(function(d){ dealById[d.id]=d; });
    var active=deals.filter(function(d){ return d.stage!=='dead' && d.stage!=='executed'; });
    var pipeComm=active.reduce(function(s,d){ return s+(num(d.commission_amount)||0); },0);
    var collectedYTD=deals.filter(function(d){ return d.commission_status==='paid' && d.commission_paid_on && (new Date(d.commission_paid_on)).getFullYear()===year; }).reduce(function(s,d){ return s+(num(d.commission_amount)||0); },0);
    var collectedAll=deals.filter(function(d){ return d.commission_status==='paid'; }).reduce(function(s,d){ return s+(num(d.commission_amount)||0); },0);
    var openTasks=tasks.filter(function(t){ return !t.done; });
    var overdue=0;
    openTasks.forEach(function(t){ if(t.due_date&&daysUntil(t.due_date)<0) overdue++; });
    steps.forEach(function(s){ if(daysUntil(s.due_date)<0) overdue++; });

    // "What's due" — merge tasks, checklist steps, and lease critical dates
    var feed=[];
    openTasks.forEach(function(t){ if(t.due_date) feed.push({date:t.due_date, kind:'task', label:t.title, dealId:t.deal_id, id:t.id}); });
    steps.forEach(function(s){ feed.push({date:s.due_date, kind:'step', label:s.label, dealId:s.deal_id}); });
    absts.forEach(function(a){
      (a.key_dates||[]).forEach(function(k){ if(k&&k.date) feed.push({date:k.date, kind:'critical', label:(k.label||'Critical date'), dealId:a.deal_id}); });
      if(a.expiration_date) feed.push({date:a.expiration_date, kind:'critical', label:'Lease expiration', dealId:a.deal_id});
    });
    feed.sort(function(x,y){ return x.date<y.date?-1:(x.date>y.date?1:0); });
    var feedItems=feed.filter(function(f){ var du=daysUntil(f.date); return du!=null && du<=60; }).slice(0,14);

    var recs=buildRecs(active, steps, tasks, absts, dealById);

    el.innerHTML =
      '<div class="vhead"><div><h1>Dashboard</h1><div class="sub">Your book of business at a glance.</div></div>'
      + '<button class="share-btn" onclick="DF.newTask(null)"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Add task</button></div>'
      + '<div class="dstats">'
      +   statCard('Commission collected (YTD)', money(collectedYTD), collectedAll>collectedYTD?('All-time '+money(collectedAll)):'')
      +   statCard('Pipeline commission', money(pipeComm), active.length+' active deal'+(active.length===1?'':'s'))
      +   statCard('Deals in pipeline', String(active.length), byStageMini(active))
      +   statCard('Open tasks', String(openTasks.length), overdue?(overdue+' overdue'):'on track')
      + '</div>'
      + '<div class="dgrid">'
      +   '<div class="dpanel"><div class="dpanel-h">What\'s due <span class="dpanel-x" onclick="DF.newTask(null)">+ task</span></div>'
      +     (feedItems.length? feedItems.map(function(f){ return feedRow(f,dealById); }).join('') : '<div class="dempty">Nothing due in the next 60 days. Add a task to stay ahead.</div>')
      +   '</div>'
      +   '<div class="dpanel"><div class="dpanel-h">Recommended next steps</div>'
      +     (recs.length? recs.map(recRow).join('') : '<div class="dempty">You\'re all caught up. Nice work 🎉</div>')
      +   '</div>'
      + '</div>';
  }

  function feedRow(f, dealById){
    var d=dealById[f.dealId]; var client=d?(d.client_name||'Deal'):'';
    var du=daysUntil(f.date), over=du<0;
    var when= over? (Math.abs(du)+'d late') : (du===0?'today':(du+'d'));
    var open = f.dealId ? ' onclick="DF.openDeal(\''+f.dealId+'\')"'
      : (f.kind==='task'&&f.id ? ' onclick="DF.newTask(null,\''+f.id+'\')"' : '');
    return '<div class="due'+(over?' over':'')+'"'+open+'>'
      + '<span class="due-when">'+esc(when)+'</span>'
      + '<span class="due-l"><span class="due-kind '+f.kind+'"></span>'+esc(f.label)+(client?' <em>· '+esc(client)+'</em>':'')+'</span>'
      + '<span class="due-date">'+fmtDate(f.date)+'</span>'
      + (f.kind==='task'?'<button class="due-done" onclick="event.stopPropagation();DF.toggleTask(\''+f.id+'\',true)" title="Mark done">✓</button>':'')
      + '</div>';
  }
  function recRow(r){
    var click = ' onclick="DF.recGo(\''+(r.act||'')+'\','+(r.dealId?'\''+r.dealId+'\'':'null')+','+(r.taskId?'\''+r.taskId+'\'':'null')+')"';
    return '<div class="rec sev'+r.sev+'"'+click+'>'
      + '<span class="rec-dot"></span><span class="rec-t">'+esc(r.text)+'</span><span class="rec-go">→</span></div>';
  }
  // Take the broker from a recommendation straight to the thing to do:
  // open the deal (if any), then the right editor/section for the action.
  async function recGo(act, dealId, taskId){
    if(dealId){ await openDeal(dealId); }
    if(act==='edittask'){ newTask(dealId||null, taskId); }
    else if(act==='newtask'&&dealId){ newTask(dealId); }
    else if(act==='commission'&&dealId){ editCommission(dealId); }
    else if(act==='checklist'||act==='lease'){ var el=$(act==='checklist'?'checklistBody':'leaseSec'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }
  }
  function buildRecs(active, steps, tasks, absts, dealById){
    var recs=[];
    steps.forEach(function(s){ var du=daysUntil(s.due_date); if(du!=null&&du<0){ var d=dealById[s.deal_id]; recs.push({sev:2, dealId:s.deal_id, act:'checklist', text:'You\'re behind on “'+s.label+'”'+(d?' for '+(d.client_name||'a client'):'')}); } });
    tasks.forEach(function(t){ if(!t.done&&t.due_date){ var du=daysUntil(t.due_date); if(du!=null&&du<0){ var d=dealById[t.deal_id]; recs.push({sev:2, dealId:t.deal_id, act:'edittask', taskId:t.id, text:'Overdue task: '+t.title+(d&&d.client_name?' — '+d.client_name:'')}); } } });
    absts.forEach(function(a){ if(a.expiration_date){ var du=daysUntil(a.expiration_date); if(du!=null&&du>=0&&du<=120){ var d=dealById[a.deal_id]; recs.push({sev:1, dealId:a.deal_id, act:'lease', text:(d&&d.client_name?d.client_name:'A client')+'’s lease expires in '+du+' days — start the renewal conversation'}); } } });
    var taskDeal={}; tasks.forEach(function(t){ if(!t.done&&t.deal_id) taskDeal[t.deal_id]=true; });
    active.forEach(function(d){ if(!taskDeal[d.id]) recs.push({sev:0, dealId:d.id, act:'newtask', text:'No next action set for '+(d.client_name||'a deal')+' — add a task'}); });
    active.forEach(function(d){ if(d.commission_amount==null && d.commission_pct==null) recs.push({sev:0, dealId:d.id, act:'commission', text:'Add commission terms for '+(d.client_name||'a deal')}); });
    recs.sort(function(a,b){ return b.sev-a.sev; });
    return recs.slice(0,7);
  }

  /* ---------- tasks ---------- */
  function tasksSection(d, tasks){
    tasks=tasks||[];
    var open=tasks.filter(function(t){return !t.done;}), done=tasks.filter(function(t){return t.done;});
    var rows=open.length? open.map(function(t){ return taskRow(t,d.id); }).join('') : '<div class="sub" style="color:var(--ink-faint);font-size:12.5px">No open tasks.</div>';
    var doneRows=done.length?('<details class="tasks-done"><summary>'+done.length+' completed</summary>'+done.map(function(t){return taskRow(t,d.id);}).join('')+'</details>'):'';
    return rows+doneRows+'<button class="miniadd" onclick="DF.newTask(\''+d.id+'\')">+ Add task</button>';
  }
  function taskRow(t, dealId){
    var over=(!t.done && t.due_date && daysUntil(t.due_date)<0);
    return '<div class="task'+(t.done?' done':'')+'">'
      + '<button class="taskchk'+(t.done?' on':'')+'" onclick="DF.toggleTask(\''+t.id+'\','+(t.done?'false':'true')+',\''+dealId+'\')" title="'+(t.done?'Reopen':'Mark done')+'"></button>'
      + '<span class="task-l">'+esc(t.title)+'</span>'
      + (t.priority==='high'&&!t.done?'<span class="task-pri">High</span>':'')
      + (t.due_date?'<span class="task-due'+(over?' over':'')+'">'+fmtDate(t.due_date)+'</span>':'')
      + '<button class="step-mini" onclick="DF.newTask(\''+dealId+'\',\''+t.id+'\')" title="Edit">✎</button>'
      + '<button class="delx" onclick="DF.deleteTask(\''+t.id+'\',\''+dealId+'\')">remove</button>'
      + '</div>';
  }
  function refreshTaskViews(dealId){
    if($('dashboardView') && $('dashboardView').style.display!=='none') renderDashboard();
    else if(dealId && $('dealView').style.display!=='none') reloadTasks(dealId);
  }
  async function reloadTasks(dealId){
    var d=deals.filter(function(x){return x.id===dealId;})[0]; if(!d) return;
    var tasks=[]; try{ tasks=await q(sb.from('deal_tasks').select('*').eq('deal_id',dealId).order('due_date',{ascending:true,nullsFirst:false})); }catch(e){}
    var tb=$('tasksBody'); if(tb) tb.innerHTML=tasksSection(d,tasks);
  }
  async function toggleTask(id, done, dealId){
    try{ await q(sb.from('deal_tasks').update({done:done, completed_at: done?new Date().toISOString():null}).eq('id',id)); refreshTaskViews(dealId); }
    catch(e){ alert('Could not update task: '+(e.message||e)); }
  }
  async function deleteTask(id, dealId){
    if(!confirm('Remove this task?')) return;
    try{ await q(sb.from('deal_tasks').delete().eq('id',id)); refreshTaskViews(dealId); }
    catch(e){ alert('Could not remove task: '+(e.message||e)); }
  }
  async function newTask(dealId, taskId){
    var t={}; if(taskId){ try{ t=(await q(sb.from('deal_tasks').select('*').eq('id',taskId).limit(1)))[0]||{}; }catch(e){} }
    var dealPicker='';
    if(!dealId){
      var opts=deals.filter(function(d){return d.stage!=='dead';}).map(function(d){ return '<option value="'+d.id+'"'+((t.deal_id===d.id)?' selected':'')+'>'+esc(d.client_name||'Untitled')+'</option>'; }).join('');
      dealPicker=fld('Link to deal (optional)','<select id="t_deal"><option value="">— none —</option>'+opts+'</select>');
    }
    openSheet('<h3>'+(taskId?'Edit task':'New task')+'</h3>'
      + fld('Task','<input id="t_title" value="'+esc(t.title||'')+'" placeholder="e.g. Follow up with landlord on TI" autofocus>')
      + '<div class="grid2">'
      +   fld('Due date','<input id="t_due" type="date" value="'+(t.due_date||'')+'">')
      +   fld('Priority','<select id="t_pri">'+selOpts([['low','Low'],['normal','Normal'],['high','High']], t.priority||'normal')+'</select>')
      + '</div>'
      + dealPicker
      + '<div class="formerr" id="f_err"></div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn pri" id="f_save">'+(taskId?'Save':'Add task')+'</button></div>');
    $('f_save').addEventListener('click',async function(){
      var title=($('t_title').value||'').trim(); if(!title){ $('f_err').textContent='Enter a task.'; return; }
      this.disabled=true; this.textContent='Saving…';
      var linkDeal = dealId || ($('t_deal')?($('t_deal').value||null):null);
      var patch={title:title, due_date:($('t_due').value||null), priority:$('t_pri').value, deal_id:linkDeal};
      try{
        if(taskId){ await q(sb.from('deal_tasks').update(patch).eq('id',taskId)); }
        else{ patch.owner_id=me.id; await q(sb.from('deal_tasks').insert(patch)); }
        closeSheet(); refreshTaskViews(dealId||linkDeal);
      }catch(e){ $('f_err').textContent=/deal_tasks|does not exist/i.test(e.message||'')?'Run the deal-tasks SQL in Supabase first.':(e.message||''+e); this.disabled=false; this.textContent=taskId?'Save':'Add task'; }
    });
  }

  /* ---------- deal detail view ---------- */
  async function openDeal(id){
    var d=deals.filter(function(x){return x.id===id;})[0]; if(!d) return;
    _navTo('deal='+encodeURIComponent(id));
    $('pipelineView').style.display='none';
    $('dashboardView').style.display='none';
    var mv3=$('modelView'); if(mv3) mv3.style.display='none';
    var ev3=$('emailsView'); if(ev3) ev3.style.display='none';
    var cvO=$('clientsView'); if(cvO) cvO.style.display='none';
    setSubnav('deal');
    if(window.Van) Van.setContext({dealId:id, label:(d.client_name||'this deal')});
    var v=$('dealView'); v.style.display='block';
    $('crumb').innerHTML='Deal flow <b>›</b> '+esc(d.client_name||'Deal');
    v.innerHTML='<div class="loading">Loading deal…</div>';
    try{
      var props=await q(sb.from('deal_properties').select('*').eq('deal_id',id).order('sort_order'));
      var proposals=await q(sb.from('proposals').select('*').eq('deal_id',id).order('created_at'));

      var abstracts=await q(sb.from('lease_abstracts').select('*').eq('deal_id',id).order('created_at'));
      var events=[]; try{ events=await q(sb.from('deal_events').select('type,detail,created_at').eq('deal_id',id).order('created_at',{ascending:false})); }catch(e){}
      var steps=[]; try{ steps=await q(sb.from('deal_steps').select('*').eq('deal_id',id).order('sort_order')); }catch(e){}
      var tasks=[]; try{ tasks=await q(sb.from('deal_tasks').select('*').eq('deal_id',id).order('due_date',{ascending:true,nullsFirst:false})); }catch(e){}
      try{ syncDealModel(id, proposals, rounds, abstracts[0]||null); }catch(e){}
      renderDeal(d,props,proposals,rounds,docs,tours,abstracts[0]||null,events,steps,tasks);
    }catch(e){ v.innerHTML='<div class="loading">Could not load deal: '+esc(e.message)+'</div>'; }
  }

  function ago(iso){ if(!iso) return ''; var s=Math.floor((Date.now()-new Date(iso).getTime())/1000); if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }
  function renderDeal(d,props,proposals,rounds,docs,tours,abstract,events,steps,tasks){
    steps=steps||[]; tasks=tasks||[];
    var ev=events||[];
    var opens=ev.filter(function(e){return e.type==='open';}).length;
    var dls=ev.filter(function(e){return e.type==='download';}).length;
    // portal events carry WHO in detail ("email" or "email · xlsx"); passcode-link
    // events have no identity. Show per-person counts when we have them.
    var byWho={};
    ev.forEach(function(e){
      var m=/^([^\s·]+@[^\s·]+)/.exec(e.detail||'');
      if(m){ var w=byWho[m[1]]=byWho[m[1]]||{opens:0,last:null}; if(e.type==='open') w.opens++; if(!w.last) w.last=e.created_at; }
    });
    var whoBits=Object.keys(byWho).slice(0,3).map(function(w){
      return esc(w)+(byWho[w].opens?' '+byWho[w].opens+'×':'')+(byWho[w].last?' ('+ago(byWho[w].last)+')':'');
    });
    var engLine = ev.length ? '<div class="meta" style="margin-top:3px"><span style="color:var(--accent)">👁 Client opened '+opens+'×</span>'+(ev[0]?' · last '+ago(ev[0].created_at):'')+(dls?' · '+dls+' download'+(dls>1?'s':''):'')
      +(whoBits.length?'<br><span style="color:var(--ink-faint)">Portal: '+whoBits.join(' · ')+'</span>':'')+'</div>' : '';
    var stageOpts=Object.keys(STAGE_LABEL).map(function(k){
      return '<option value="'+k+'"'+(d.stage===k?' selected':'')+'>'+STAGE_LABEL[k]+'</option>';
    }).join('');

    var propById={}; props.forEach(function(p){ propById[p.id]=p; });

    var toursHtml = (tours&&tours.length) ? tours.map(function(s){ return tourCard(s, propById, d.id); }).join('')
      : '<div class="sub" style="color:var(--ink-faint);font-size:12.5px">No tour stops scheduled yet.</div>';
    var tourCount=(tours&&tours.length)||0;
    var toursSection = toursHtml + '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">'
      + '<button class="miniadd" onclick="DF.newTourStop(\''+d.id+'\')">+ Add tour stop</button>'
      + '<button class="miniadd" onclick="DF.buildTourFromTouring(\''+d.id+'\')">↻ Build from “touring” buildings</button>'
      + (tourCount>=2?'<button class="miniadd" onclick="DF.optimizeTour(\''+d.id+'\')" title="Van orders the buildings for the shortest drive and lays out arrival times">🗺️ Optimize route &amp; times</button>':'')
      + (tourCount>=1?'<button class="miniadd" onclick="DF.draftAllTourEmails(\''+d.id+'\')" title="Van drafts one email per listing broker with each building’s time slot">✉️ Draft broker emails</button>':'')
      + '</div>';

    var tourPropIds={}; (tours||[]).forEach(function(t){ if(t.property_id) tourPropIds[t.property_id]=true; });
    // Building funnel: candidates (Buildings) → shortlisted (Market report) → tour
    var candidateProps = props.filter(function(p){ return p.status!=='shortlisted'; });
    var reportProps = props.filter(function(p){ return p.status==='shortlisted'; });
    var propsHtml = candidateProps.length ? candidateProps.map(function(p){ return propCard(p, d.id, tourPropIds[p.id]); }).join('') : '<div class="sub" style="color:var(--ink-faint);font-size:12.5px">No candidate buildings — add best-fit buildings from the questionnaire, or add one manually.</div>';

    var propsHtml2 = propsHtml + '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="miniadd" onclick="DF.newProperty(\''+d.id+'\')">+ Add building</button>'
      + (candidateProps.length?'<button class="miniadd ai" onclick="DF.generateRfp(\''+d.id+'\')" title="Draft a Request for Proposal and send it to the listing brokers">📋 Generate RFP</button>':'')+'</div>';

    var reportHtml = reportProps.length ? reportProps.map(function(p){ return reportCard(p, d.id); }).join('') : '<div class="sub" style="color:var(--ink-faint);font-size:12.5px">No buildings in the market report yet. On a candidate building above, click “→ Add to market report”.</div>';
    var reportSection = reportHtml + '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:4px">'
      + (reportProps.length?'<button class="share-btn" onclick="DF.generateMarketReport(\''+d.id+'\')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg> Generate market report</button>':'')+'</div>';

    // group rounds + documents by proposal
    var roundsByProp={}; rounds.forEach(function(r){ (roundsByProp[r.proposal_id]=roundsByProp[r.proposal_id]||[]).push(r); });
    var docsByProp={}; (docs||[]).forEach(function(dc){ if(dc.proposal_id){ (docsByProp[dc.proposal_id]=docsByProp[dc.proposal_id]||[]).push(dc); } });
    var leaseDocs=(docs||[]).filter(function(dc){ return !dc.proposal_id; });   // deal-level / lease docs (e.g. the signed lease PDF)

    var propsHtmlList = proposals.length ? proposals.map(function(pr){
      var rs=(roundsByProp[pr.id]||[]);
      var bldg = pr.property_id && propById[pr.property_id] ? propById[pr.property_id].name : null;
      var rowsHtml = rs.length ? rs.map(roundRow).join('') :
        '<tr><td colspan="9" style="color:var(--ink-faint)">No rounds yet — add the first proposal terms.</td></tr>';
      var visBtn='<button class="vis '+(pr.client_visible?'on':'')+'" onclick="DF.toggleProposalVisible(\''+pr.id+'\','+(pr.client_visible?'false':'true')+',\''+d.id+'\')" title="Toggle whether the client can see this proposal">'
        +(pr.client_visible?'● Shown to client':'○ Hidden from client')+'</button>';
      return '<div class="pcard">'
        + '<div class="top"><div><div class="nm">'+esc(pr.title||'Proposal')+'</div>'
        +   (bldg?'<div class="ad">'+esc(bldg)+'</div>':'')+'</div>'
        +   '<div style="display:flex;gap:8px;align-items:center">'+visBtn+'<span class="tag">'+esc(pr.status)+'</span></div></div>'
        + '<div class="rounds"><table class="rtable"><thead><tr>'
        +   '<th>Rd</th><th>From</th><th>Structure</th><th class="num">Base $/SF</th><th class="num">Opex</th>'
        +   '<th class="num">≈ Gross</th><th class="num">Size SF</th><th class="num">Term</th><th>Notes</th>'
        + '</tr></thead><tbody>'+rowsHtml+'</tbody></table></div>'
        + docsBlock(pr.id, d.id, docsByProp[pr.id]||[])
        + '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">'
        +   '<button class="miniadd" onclick="DF.newRound(\''+d.id+'\',\''+pr.id+'\')">+ Add round</button>'
        +   '<button class="miniadd ai" onclick="DF.aiDraft(\''+d.id+'\',\''+pr.id+'\')">✨ Draft with AI</button>'
        +   '<button class="miniadd ai" onclick="DF.extractFromPdf(\''+d.id+'\',\''+pr.id+'\')" title="Upload a landlord proposal/LOI PDF — Claude reads it into a draft round">📄 Read a landlord PDF</button>'
        + '</div>'
        + '</div>';

  /* ---------- questionnaire → best-fit buildings (the "market AI" match, ported
     from the Cockpit so it runs right on the deal). Scores every building in the
     catalog by the client's weighted amenity priorities, size-fit and budget. ---- */
  var MATCH_RADIUS=1600, MATCH_CATS=[['coffee','Coffee'],['dining','Dining'],['fitness','Fitness'],['grocery','Grocery'],['transit','Transit']];
  function _mhav(la1,ln1,la2,ln2){ var R=6371000,toR=Math.PI/180; var dLa=(la2-la1)*toR,dLn=(ln2-ln1)*toR; var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*toR)*Math.cos(la2*toR)*Math.sin(dLn/2)*Math.sin(dLn/2); return 2*R*Math.asin(Math.sqrt(s)); }
  function _cscore(b){
    if(b._cscore) return b._cscore;
    var cs={};
    MATCH_CATS.forEach(function(c){
      var raw=0;
      (b.amen||[]).forEach(function(a){ if(a[1]===c[0]){ var dd=_mhav(b.lat,b.lng,a[2],a[3]); if(dd<=MATCH_RADIUS){ var pf=Math.min(1,Math.max(0.15,1-dd/MATCH_RADIUS)); raw+=((a[4]||3)/5)*pf; } } });
      cs[c[0]]=10*(1-Math.exp(-raw/4));
    });
    b._cscore=cs; return cs;
  }
  function _iqSF(s){ var m=String(s||'').replace(/[^0-9]/g,''); return m?parseInt(m,10):null; }
  function _iqNeed(r){ var sf=_iqSF(r.sf); if(sf) return sf; var hc=parseInt(r.headcount,10); return hc?hc*200:null; }
  function _iqBudgetMax(r){ var b=r.budget||''; if(/under\s*\$?3/i.test(b)) return 3; if(/\+/.test(b)) return 999; var n=(b.match(/[\d.]+/g)||[]).map(parseFloat); return n.length?Math.max.apply(null,n):null; }
  function _iqLowRent(b){ var m=String(b.rent||'').match(/[\d.]+/); return m?parseFloat(m[0]):null; }
  function matchBuildings(r, buildings){
    var w={}, anyW=false;
    MATCH_CATS.forEach(function(c){ var v=(r.amenities&&r.amenities[c[0]]); if(v!=null){ w[c[0]]=v; if(v>0) anyW=true; } });
    var need=_iqNeed(r), bmax=_iqBudgetMax(r);
    return (buildings||[]).map(function(b){
      var cs=_cscore(b), score;
      if(anyW){ var sum=0,acc=0; MATCH_CATS.forEach(function(c){ var ww=w[c[0]]||0; sum+=ww; acc+=(cs[c[0]]||0)*ww; }); score=sum?Math.round(acc/sum*10):50; }
      else { var t=0; MATCH_CATS.forEach(function(c){ t+=cs[c[0]]||0; }); score=Math.round(t/MATCH_CATS.length*10); }
      var reasons=[], availSF=_iqSF(b.avail);
      if(need && availSF && availSF>=need*0.8) reasons.push('Fits ~'+need.toLocaleString()+' SF');
      if(bmax){ var lr=_iqLowRent(b); if(lr!=null && lr<=bmax+0.25) reasons.push('Within budget'); }
      if(anyW){ var strong=MATCH_CATS.filter(function(c){ return (w[c[0]]||0)>=2 && (cs[c[0]]||0)>=6; }).map(function(c){ return c[1].toLowerCase(); }); if(strong.length) reasons.push('Strong '+strong.slice(0,2).join(' & ')); }
      return {b:b, score:score, reasons:reasons};
    }).sort(function(x,y){ return y.score-x.score; });
  }
  function renderMatchInline(dealId, r){
    if(!_portalBuildings || !_portalBuildings.length) return '<div class="qnr-hint" style="margin-top:8px">Loading building matches…</div>';
    var matches=matchBuildings(r, _portalBuildings).slice(0,6);
    if(!matches.length) return '';
    return '<div class="qnr-match"><div class="qnr-match-h">✨ Best-fit buildings <span class="qnr-hint">matched from their answers — amenities, size &amp; budget</span></div>'
      + matches.map(function(m){
          return '<div class="cd-row" style="cursor:default"><span class="cd-row-nm nm-link" onclick="DF.viewBuilding(\''+esc(m.b.id)+'\')" title="See building details">'+esc(m.b.name)+' ↗ <span class="qnr-fit">fit '+m.score+'</span></span>'
            + '<span class="cd-row-meta">'+esc(m.b.submarket||'')+(m.reasons.length?' · '+esc(m.reasons.slice(0,2).join(', ')):'')+'</span>'
            + '<button class="qnr-add" onclick="DF.addMatchToDeal(\''+dealId+'\',\''+esc(m.b.id)+'\',this)">+ Add to deal</button></div>';
        }).join('')
      + '</div>';
  }
  async function addMatchToDeal(dealId, buildingId, btn){
    var b=(_portalBuildings||[]).filter(function(x){ return x.id===buildingId; })[0]; if(!b) return;
    if(btn){ btn.disabled=true; btn.textContent='Adding…'; }
    try{
      var ex=await q(sb.from('deal_properties').select('id').eq('deal_id',dealId).eq('building_id',buildingId).limit(1));
      if(ex && ex.length){ if(btn){ btn.textContent='Already added ✓'; } return; }
      await q(sb.from('deal_properties').insert({deal_id:dealId, building_id:b.id, name:b.name, address:b.addr||null, status:'considering'}).select().single());
      if(btn){ btn.textContent='Added ✓'; }
      if(typeof aiToast==='function') aiToast(b.name+' added to the deal.');
    }catch(e){ if(btn){ btn.disabled=false; btn.textContent='+ Add to deal'; } alert('Could not add: '+(e.message||e)); }
  }

  /* ---------- questionnaire: create, view responses inline, resend ---------- */
  var IQ_RATING=['Not important','Nice to have','Important','Must-have'];
  var IQ_AMEN=[['coffee','Coffee shops'],['dining','Restaurants / dining'],['fitness','Gyms / fitness'],['grocery','Grocery'],['transit','Transit access']];

  // Render a completed questionnaire's answers (mirrors the Cockpit's layout).
  function qAnswersHtml(r){
    r=r||{};
    function v(x){ if(x==null||x===''||(Array.isArray(x)&&!x.length)) return '<span class="qa-dim">—</span>'; return esc(Array.isArray(x)?x.join(', '):String(x)); }
    function row(l,val){ return '<div class="qa-row"><span class="qa-l">'+l+'</span><span class="qa-v">'+val+'</span></div>'; }
    function sec(t){ return '<div class="qa-sec">'+t+'</div>'; }
    var amen=IQ_AMEN.map(function(a){ var x=(r.amenities&&r.amenities[a[0]]); return a[1]+': '+(x==null?'—':(IQ_RATING[x]||x)); }).join(' · ');
    return sec('Company')
      + row('Company',v(r.company)) + row('Industry',v(r.industry))
      + row('Contact',v(r.contactName)) + row('Email',v(r.contactEmail))
      + row('Team size now',v(r.headcount)) + row('In 2–3 yrs',v(r.headcountFuture))
      + sec('Space needs')
      + row('Square footage',v(r.sf?r.sf+' SF':'')) + row('Parking',v(r.parking))
      + row('Layout',v(r.layout)) + row('Move-in readiness',v(r.buildout)) + row('Must-have spaces',v(r.musthaves))
      + sec('Budget &amp; timing')
      + row('Target rent',v(r.budget)) + row('Move-in timeline',v(r.timeline)) + row('Lease term',v(r.term))
      + sec('Location &amp; lifestyle')
      + row('Preferred submarkets',v(r.areas)) + row('Amenity priorities',amen)
      + row('Additional notes',v(r.notes));
  }

         + '</div>')

  // Create + link a questionnaire for a deal's client; copies the link. Returns the URL.
  async function createIntakeFor(d){
    var s=await sb.auth.getSession(); var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
    var res=await fetch('/.netlify/functions/create-intake',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:token, company:d.client_name||'Client', hsCompanyId:d.hs_company_id||undefined})});
    var out=await res.json().catch(function(){return {};});
    if(!res.ok||!out.url) throw new Error(out.error||('Error '+res.status));
    try{ await navigator.clipboard.writeText(out.url); }catch(e){}
    if(typeof aiToast==='function') aiToast('Questionnaire link created — also copied to your clipboard.');
    return out.url;
  }

      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg> Delete</button>';
  }
  function deleteDealAsk(dealId){

      + '<button class="act-btn danger solid" onclick="DF.deleteDealDo(\''+dealId+'\')">Yes, delete</button></span>';

  async function deleteDealDo(dealId){

  /* ---------- deal snapshot: progress + commission ---------- */
  function snapshotSection(d, steps){
    steps=steps||[];
    var total=steps.length, na=0, done=0;
    steps.forEach(function(s){ if(s.status==='done') done++; else if(s.status==='na') na++; });
    var denom=total-na, prog=denom>0?Math.round(100*done/denom):0;
    var commAmt = d.commission_amount!=null ? money(d.commission_amount)
      : (num(d.commission_pct)!=null && num(d.deal_value)!=null ? money(num(d.deal_value)*num(d.commission_pct)/100) : null);
    var cstat = d.commission_status ? (COMM_STATUS.filter(function(c){return c[0]===d.commission_status;})[0]||['','—'])[1] : null;
    var sub=[]; if(d.deal_value!=null) sub.push('Deal value '+money(d.deal_value)); if(d.commission_pct!=null) sub.push(d.commission_pct+'%');
    return '<div class="snap">'
      + '<div class="snap-prog">'
      +   '<div class="snap-k">Transaction progress</div>'
      +   (total
            ? '<div class="pgbar big"><span style="width:'+prog+'%"></span></div>'
              + '<div class="snap-sub">'+done+' of '+denom+' steps complete'+(prog===100?' · complete 🎉':'')+'</div>'
            : '<div class="snap-sub" style="margin-top:8px">Not set up yet.</div><button class="miniadd" onclick="DF.seedSteps(\''+d.id+'\')">+ Set up transaction checklist</button>')
      + '</div>'
      + '<div class="snap-comm">'
      +   '<button class="rev" onclick="DF.editCommission(\''+d.id+'\')">edit</button>'
      +   '<div class="snap-k">Commission</div>'
      +   '<div class="snap-commv">'+(commAmt||'—')+(cstat?' <span class="cst '+d.commission_status+'">'+cstat+'</span>':'')+'</div>'
      +   (sub.length?'<div class="snap-sub">'+sub.join(' · ')+'</div>':'<div class="snap-sub">Add deal value &amp; fee</div>')
      + '</div>'
      + '</div>';
  }

  /* ---------- transaction checklist ---------- */
  function checklistSection(d, steps){
    steps=steps||[];
    if(!steps.length){
      return '<div class="sub" style="color:var(--ink-faint);font-size:12.5px">No checklist yet — set up the full lease-transaction checklist to track every step from engagement to move-in.</div>'
        + '<button class="miniadd" onclick="DF.seedSteps(\''+d.id+'\')">+ Set up transaction checklist</button>';
    }
    var phases=[], byPhase={};
    steps.forEach(function(s){ var p=s.phase||'Other'; if(!byPhase[p]){ byPhase[p]=[]; phases.push(p); } byPhase[p].push(s); });
    return phases.map(function(p){
      var arr=byPhase[p], done=0, na=0;
      arr.forEach(function(s){ if(s.status==='done') done++; else if(s.status==='na') na++; });
      return '<div class="phase">'
        + '<div class="phase-h"><span class="phase-t">'+esc(p)+'</span><span class="phase-c">'+done+'/'+(arr.length-na)+'</span></div>'
        + arr.map(function(s){ return stepRow(s, d.id); }).join('')
        + '</div>';
    }).join('');
  }
  function stepRow(s, dealId){
    var st=STEP_STATUS[s.status]||STEP_STATUS.pending;
    return '<div class="step '+st.cls+'">'
      + '<button class="stepdot '+st.cls+'" onclick="DF.cycleStep(\''+s.id+'\',\''+dealId+'\',\''+s.status+'\')" title="Click to advance: to-do → in progress → done"></button>'
      + '<span class="step-l" onclick="DF.cycleStep(\''+s.id+'\',\''+dealId+'\',\''+s.status+'\')">'+esc(s.label)+'</span>'
      + (s.notes?'<span class="step-note-txt" title="'+esc(s.notes)+'">'+esc(s.notes)+'</span>':'')
      + '<span class="step-actions">'
      +   '<input type="date" class="step-due-in" value="'+(s.due_date||'')+'" onchange="DF.stepDue(\''+s.id+'\',this.value,\''+dealId+'\')" title="Due date">'
      +   '<button class="step-mini'+(s.notes?' has':'')+'" onclick="DF.stepNote(\''+s.id+'\',\''+dealId+'\')" title="'+(s.notes?'Edit note':'Add note')+'">✎</button>'
      +   '<button class="step-mini" onclick="DF.stepNA(\''+s.id+'\',\''+dealId+'\','+(s.status==='na'?'true':'false')+')" title="'+(s.status==='na'?'Un-skip':'Mark not applicable')+'">'+(s.status==='na'?'↩':'∅')+'</button>'
      + '</span>'
      + '</div>';
  }
  async function reloadSteps(dealId){
    var d=deals.filter(function(x){return x.id===dealId;})[0]; if(!d) return;
    var steps=[]; try{ steps=await q(sb.from('deal_steps').select('*').eq('deal_id',dealId).order('sort_order')); }catch(e){}
    var cb=$('checklistBody'); if(cb) cb.innerHTML=checklistSection(d,steps);
    var sw=$('snapWrap'); if(sw) sw.innerHTML=snapshotSection(d,steps);
  }
  async function seedSteps(dealId){
    try{
      var rows=STEP_TEMPLATE.map(function(t,i){ return {deal_id:dealId, phase:t[0], label:t[1], sort_order:i}; });
      await q(sb.from('deal_steps').insert(rows));
      reloadSteps(dealId);
    }catch(e){ alert('Could not set up the checklist.\nMake sure the deal-detail SQL has been run in Supabase.\n\n'+(e.message||e)); }
  }
  async function cycleStep(id, dealId, cur){
    var next=STEP_NEXT[cur]||'active';
    try{ await q(sb.from('deal_steps').update({status:next, completed_at: next==='done'?new Date().toISOString():null}).eq('id',id)); reloadSteps(dealId); }
    catch(e){ alert('Could not update step: '+(e.message||e)); }
  }
  async function stepNA(id, dealId, isNA){
    try{ await q(sb.from('deal_steps').update({status: isNA?'pending':'na', completed_at:null}).eq('id',id)); reloadSteps(dealId); }
    catch(e){ alert('Could not update step: '+(e.message||e)); }
  }
  async function stepDue(id, val, dealId){
    try{ await q(sb.from('deal_steps').update({due_date: val||null}).eq('id',id)); reloadSteps(dealId); }
    catch(e){ alert('Could not set due date: '+(e.message||e)); }
  }
  async function stepNote(id, dealId){
    var cur=''; try{ var r=(await q(sb.from('deal_steps').select('notes').eq('id',id).limit(1)))[0]; if(r&&r.notes) cur=r.notes; }catch(e){}
    var note=prompt('Note for this step:', cur);
    if(note===null) return;
    try{ await q(sb.from('deal_steps').update({notes:(note||'').trim()||null}).eq('id',id)); reloadSteps(dealId); }
    catch(e){ alert('Could not save note: '+(e.message||e)); }
  }

  /* ---------- commission editor ---------- */
  function editCommission(dealId){
    var d=deals.filter(function(x){return x.id===dealId;})[0]||{};
    function v(x){ return x==null?'':x; }
    openSheet('<h3>Commission &amp; deal value</h3><div class="ssub">Track the economics and where the fee stands.</div>'
      + '<div class="grid2">'
      + fld('Deal value','<input id="c_val" type="number" step="1000" inputmode="decimal" value="'+v(d.deal_value)+'" placeholder="0">','$ total')
      + fld('Commission','<input id="c_pct" type="number" step="0.1" inputmode="decimal" value="'+v(d.commission_pct)+'" placeholder="0">','%')
      + fld('Commission amount','<input id="c_amt" type="number" step="100" inputmode="decimal" value="'+v(d.commission_amount)+'" placeholder="auto from % if blank">','$')
      + fld('Status','<select id="c_stat"><option value="">— not set —</option>'+selOpts(COMM_STATUS,d.commission_status||'')+'</select>')
      + '</div>'
      + fld('Notes','<textarea id="c_notes" placeholder="e.g. 4% of aggregate rent; split 50/50 with listing side; invoiced on execution">'+esc(d.commission_notes||'')+'</textarea>')
      + '<div class="formerr" id="f_err"></div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn pri" id="f_save">Save</button></div>');
    $('f_save').addEventListener('click',async function(){
      this.disabled=true; this.textContent='Saving…';
      var val=num($('c_val').value), pct=num($('c_pct').value), amt=num($('c_amt').value);
      if(amt==null && pct!=null && val!=null) amt=Math.round(val*pct/100);
      var patch={deal_value:val, commission_pct:pct, commission_amount:amt, commission_status:($('c_stat').value||null), commission_notes:(($('c_notes').value||'').trim()||null)};
      try{
        await q(sb.from('deals').update(patch).eq('id',dealId).select().single());
        var d2=deals.filter(function(x){return x.id===dealId;})[0]; if(d2) Object.keys(patch).forEach(function(k){ d2[k]=patch[k]; });
        closeSheet(); openDeal(dealId);
      }catch(e){
        var m=e.message||''+e;
        $('f_err').textContent=/column .* does not exist|commission_/i.test(m)?'Run the deal-detail SQL in Supabase first (it adds the commission fields).':m;
        this.disabled=false; this.textContent='Save';
      }
    });
  }

  // Tenant-side lease risk review from the AI lease read (stored in abstract.data.__ai).
  function aiReviewPanel(a){
    var ai = a && a.data && a.data.__ai; if(!ai) return '';
    var sevColor={high:'#b3372f',medium:'#b7791f',low:'#5b7183'};
    var review=(ai.review||[]).slice().sort(function(x,y){ var o={high:0,medium:1,low:2}; return (o[x.severity]||3)-(o[y.severity]||3); });
    var items = review.length ? review.map(function(r){
      var c=sevColor[r.severity]||'#5b7183';
      return '<div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line,#eee)">'
        + '<span style="flex:none;font:700 9.5px Inter;letter-spacing:.04em;color:#fff;background:'+c+';border-radius:4px;padding:2px 6px;margin-top:1px">'+esc((r.severity||'').toUpperCase())+'</span>'
        + '<span style="font-size:12.5px;line-height:1.5">'+esc(r.issue||'')+'</span></div>';
    }).join('') : '<div style="font-size:12px;color:var(--ink-faint);padding:4px 0">No notable tenant-side risks flagged.</div>';
    var when=''; try{ when=new Date(ai.at).toLocaleDateString(); }catch(e){}
    return '<div class="la-airev" style="margin-top:12px;border:1px solid #f0e2d0;background:#fbf7f0;border-radius:9px;padding:11px 13px">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><b style="font-size:12.5px;color:#8a5a1a">⚠ AI lease review</b>'
      + '<span style="font:400 10.5px Inter;color:var(--ink-faint)">'+(review.length?review.length+' flag'+(review.length>1?'s':''):'no flags')+(when?' · '+esc(when):'')+' · '+esc(ai.confidence||'')+' confidence</span></div>'
      + items
      + '<div style="font:400 10.5px Inter;color:var(--ink-faint);margin-top:7px">AI-generated from the lease PDF — not legal advice. Verify against the document and counsel.</div>'
      + '</div>';
  }

      + fld('Client / company name','<input id="f_name" placeholder="e.g. Pico Robertson Partners" autocomplete="off" oninput="DF.companySuggest(this.value)" autofocus><div class="sugg" id="f_csugg"></div>')
      + '<div id="f_chint" style="font-size:11.5px;color:var(--ink-faint);margin-top:6px">Pick a HubSpot company to link this deal to that client — its questionnaires, proposals &amp; leases then all live on the deal.</div>'
      + '<div class="formerr" id="f_err"></div>'
      + '<div class="srow"><button class="btn" onclick="DF.close()">Cancel</button><button class="btn" id="f_save">Create deal</button><button class="btn pri" id="f_save_q">Create &amp; send questionnaire</button></div>');
    loadCompanies();
    async function create(withQ){
      var name=($('f_name').value||'').trim();
      if(!name){ $('f_err').textContent='Enter a client name.'; return; }
      // exact-name match auto-links even if the broker didn't click a suggestion
      if(!_pickedCompanyId && Array.isArray(_companies)){ var mt=_companies.filter(function(c){return (c.name||'').toLowerCase()===name.toLowerCase();})[0]; if(mt) _pickedCompanyId=mt.id; }
      var b1=$('f_save'), b2=$('f_save_q'); if(b1) b1.disabled=true; if(b2) b2.disabled=true;
      var btn=withQ?b2:b1; var old=btn.textContent; btn.textContent='Creating…';
      try{
        var row;
        try{ row=await q(sb.from('deals').insert({owner_id:me.id, client_name:name, stage:'needs'}).select().single()); }
        catch(stageErr){ row=await q(sb.from('deals').insert({owner_id:me.id, client_name:name, stage:'touring'}).select().single()); }  // pre-migration fallback if the new stage values aren't enabled in the DB yet
        // best-effort link to the HubSpot company; never blocks deal creation (e.g. column not migrated yet)
        if(_pickedCompanyId){ try{ await q(sb.from('deals').update({hs_company_id:_pickedCompanyId}).eq('id',row.id)); row.hs_company_id=_pickedCompanyId; }catch(linkErr){} }
        deals.unshift(row);
        if(withQ){ try{ await createIntakeFor(row); }catch(qe){ /* deal still created; surface but don't block */ if(typeof aiToast==='function') aiToast('Deal created, but the questionnaire failed: '+(qe.message||qe)); } }
        closeSheet(); openDeal(row.id);
      }catch(e){ $('f_err').textContent=e.message; if(b1) b1.disabled=false; if(b2) b2.disabled=false; btn.textContent=old; }
    }
    $('f_save').addEventListener('click',function(){ create(false); });
    $('f_save_q').addEventListener('click',function(){ create(true); });
  }

    _companiesLoading=(async function(){
      try{
        var s=await sb.auth.getSession(); var token=s&&s.data&&s.data.session?s.data.session.access_token:null;
        var res=await fetch('/.netlify/functions/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, action:'list'})});
        var d=await res.json(); _companies=(d&&d.companies)||[];
      }catch(e){ _companies=[]; }
      return _companies;
    })();
    return _companiesLoading;

  function renderRfp(dealId, d, text){

  function downloadRfp(subject){

  // ---- live "market check": this round's net-effective vs the org's office comps ----
  var _compsCache=null, _compsLoading=false;
  async function loadComps(){
    if(_compsCache) return _compsCache;
    if(_compsLoading) return null;
    _compsLoading=true;
    try{
      var s=await sb.auth.getSession(); var token=(s&&s.data&&s.data.session)?s.data.session.access_token:null;
      var res=await fetch('/.netlify/functions/comps',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token, action:'list', mode:'broker'})});
      var d=await res.json().catch(function(){return {};});
      _compsCache=(d&&d.comps)||[];
    }catch(e){ _compsCache=[]; }
    _compsLoading=false;
    return _compsCache;
  }
  function _median(a){ if(!a.length) return null; var s=a.slice().sort(function(x,y){return x-y;}); var m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }
  function marketCheckHtml(comps, round){
    var er=effectiveRent(round); var mine=er?er.netEff:null;
    var pool=(comps||[]).filter(function(c){ return (c.product_type==='office'||!c.product_type) && c.net_effective_rent_psf!=null; }).map(function(c){ return Number(c.net_effective_rent_psf); });
    var wrap='padding:9px 11px;border-radius:9px;font:400 12px Inter';
    if(!pool.length){
      return '<div style="'+wrap+';background:var(--bg,#f2f5f8);color:var(--ink-faint)">'+(comps&&comps.length?'No office comps to benchmark against yet.':'Add closed deals under <b>Market › Comps</b> to benchmark each round against the market.')+'</div>';
    }
    var lo=Math.min.apply(null,pool), hi=Math.max.apply(null,pool), med=_median(pool);
    var badge='';
    if(mine!=null){
      var pct=med?Math.round((mine-med)/med*100):0;
      var inRange=mine>=lo&&mine<=hi;
      var col=inRange?'#2f855a':(mine<lo?'#2b6cb0':'#b7791f');
      var txt=inRange?'within range':(mine<lo?Math.abs(pct)+'% below median':pct+'% above median');
      badge='<span style="margin-left:auto;font:700 10.5px Inter;color:#fff;background:'+col+';border-radius:5px;padding:2px 8px">'+txt+'</span>';
    }
    var mineTxt=mine!=null?('$'+mine.toFixed(2)+'/SF NER'):'enter base + term →';
    return '<div style="'+wrap+';background:#f6f8fa;border:1px solid var(--line,#e3e9ef)">'
      + '<div style="display:flex;align-items:center;gap:8px;margin-bottom:5px"><b style="font-size:11.5px;letter-spacing:.02em;color:var(--ink-soft,#40566b)">MARKET CHECK</b>'
      +   '<span style="font-size:10.5px;color:var(--ink-faint)">office comps · '+pool.length+'</span></div>'
      + '<div style="display:flex;align-items:center;gap:10px"><span style="color:var(--ink-faint)">This round</span><b style="font-size:13px">'+mineTxt+'</b>'+badge+'</div>'
      + '<div style="display:flex;align-items:center;gap:10px;margin-top:3px"><span style="color:var(--ink-faint)">Comp NER</span><b>$'+lo.toFixed(2)+' – $'+hi.toFixed(2)+'</b><span style="color:var(--ink-faint);font-size:11px">median $'+med.toFixed(2)+'</span></div></div>';
  }
  function marketCheck(){
    var box=$('f_marketcheck'); if(!box) return;
    if(_compsCache){ box.innerHTML=marketCheckHtml(_compsCache, readRoundForm()); return; }
    box.innerHTML='<div style="padding:9px 11px;border-radius:9px;background:var(--bg,#f2f5f8);color:var(--ink-faint);font:400 12px Inter">Loading comps…</div>';

  }

  function safeName(s){ return (s||'').replace(/[\\/:*?"<>|\n\r\t]/g,' ').replace(/\s+/g,' ').trim(); }
  function todayStamp(){ var dt=new Date(); return dt.getFullYear()+'-'+('0'+(dt.getMonth()+1)).slice(-2)+'-'+('0'+dt.getDate()).slice(-2); }
  function proposalFilename(){
    var d=_curRound?deals.filter(function(x){return x.id===_curRound.dealId;})[0]:null;

    var addr=safeName((_curRound&&(_curRound.address||_curRound.building))||'');
    var parts=[client+' Proposal']; if(addr) parts.push(addr); parts.push(todayStamp());
    return safeName(parts.join(' - '));
  }

  /* ---- firm letterhead (.docx template merge via docxtemplater) ---- */
  function getLetterhead(){
    var b64=null; try{ b64=localStorage.getItem('vantage_letterhead_docx'); }catch(e){}
    if(!b64) return null;
    try{ var bin=atob(b64), len=bin.length, bytes=new Uint8Array(len); for(var i=0;i<len;i++) bytes[i]=bin.charCodeAt(i); return bytes.buffer; }catch(e){ return null; }
  }
  function pickLetterhead(){
    return new Promise(function(res){
      var inp=document.createElement('input'); inp.type='file'; inp.accept='.docx';
      inp.onchange=function(){
        var f=inp.files&&inp.files[0]; if(!f){ res(null); return; }
        var rd=new FileReader();
        rd.onload=function(){
          var ab=rd.result;
          try{ var bytes=new Uint8Array(ab), bin=''; for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
               localStorage.setItem('vantage_letterhead_docx', btoa(bin)); localStorage.setItem('vantage_letterhead_name', f.name); }catch(e){}
          res(ab);
        };
        rd.readAsArrayBuffer(f);
      };
      inp.click();
    });
  }
  function clearLetterhead(){
    try{ localStorage.removeItem('vantage_letterhead_docx'); localStorage.removeItem('vantage_letterhead_name'); }catch(e){}
    aiToast('Letterhead cleared — you\'ll be asked to pick it next time you download in the firm template.');
  }
  function buildMergeData(r, d, bldg, body){
    function s(x){ return x==null?'':String(x); }
    var base=r.base_rent_psf, opex=r.opex_psf;
    return {
      date: new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),
      broker: (me&&me.email)||'',
      client: s(d&&d.client_name), tenant: s(d&&d.client_name),
      building: s(bldg),
      rent_structure: basisLabel(r.rent_basis, r.rent_basis_label),
      base_rent: base==null?'':('$'+Number(base).toFixed(2)),
      opex: opex==null?'':('$'+Number(opex).toFixed(2)),
      gross_rent: base==null?'':('$'+(Number(base)+(Number(opex)||0)).toFixed(2)),
      size_sf: r.size_sf==null?'':Number(r.size_sf).toLocaleString(),
      term_months: r.term_months==null?'':String(r.term_months),
      term_years: r.term_months==null?'':(r.term_months/12).toFixed(1),
      escalation: r.annual_escalation_pct==null?'':(Number(r.annual_escalation_pct).toFixed(1)+'%'),
      free_rent: r.free_rent_months==null?'':String(r.free_rent_months),
      ti: r.ti_psf==null?'':('$'+Number(r.ti_psf).toFixed(2)),
      notes: s(r.summary),
      proposal_body: s(body!=null?body:r.draft_text)
    };
  }
  function fillTemplateDocx(ab, data, filename){
    var DT = window.docxtemplater || window.Docxtemplater;
    if(!window.PizZip || !DT){ alert('The Word template engine is still loading — give it a second and try again.'); return; }
    try{
      var zip=new window.PizZip(ab);
      var doc=new DT(zip, {paragraphLoop:true, linebreaks:true, nullGetter:function(){ return ''; }});
      doc.render(data);
      var out=doc.getZip().generate({type:'blob', mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
      var url=URL.createObjectURL(out);
      var a=document.createElement('a'); a.href=url; a.download=(filename||'Proposal')+'.docx';
      document.body.appendChild(a); a.click();
      aiToast('Saved “'+(filename||'Proposal')+'.docx” to your Downloads.');
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
    }catch(e){
      var msg=e.message||(''+e);
      if(e.properties && e.properties.errors){ msg=e.properties.errors.map(function(x){ return (x.properties&&x.properties.explanation)||''; }).filter(Boolean).join('; ')||msg; }
      alert('Could not fill the letterhead template:\n'+msg+'\n\nCheck that your .docx uses the {merge tags} from the template guide.');
    }
  }
